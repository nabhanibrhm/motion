<!-- Persistent ground under every scene: warm doodle paper with a soft vignette. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
  </style>
  <div data-hf-id="hf-yw6v" id="root" data-composition-id="background" data-width="1080" data-height="1920">
    <div data-hf-id="hf-mob1" id="background-art" class="f1-layer"></div>
  </div>
  <script>
    window.__timelines["background"] = F1.scene(
      "background",
      () => `<div style="${F1.css({ position: "absolute", inset: 0, background: `radial-gradient(ellipse 80% 60% at 50% 40%, ${F1.theme.doodle.paper} 60%, #f3ede5 100%)` })}"></div>`,
      { frames: F1.segments().total },
    );
  </script>
</template>
