<!-- Sasaran: seven identical icon tiles light up in spoken order (Presiden, pejabat, politik, Media, ormas, LSM, pengusaha). Tag "KATA KABARESKRIM, 3 NOV · NAMA TIDAK DIUNGKAP" on the line start, chip TANPA PROSEDUR on "prosedur", PERIODE 2025-2026 on "periode". No names, no faces. Sumber: detik, Kompas, CNN Indonesia, Journal ARTA (script S5, S6). -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root { position: absolute; inset: 0; background: #0d0f16; overflow: hidden; }
  </style>
  <div id="root" data-composition-id="sasaran" data-width="1080" data-height="1920">
    <div id="sasaran-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="sasaran-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="40" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="sasaran-sfx-prosedur" class="clip" src="public/sfx/stamp.wav" data-at="word:prosedur" data-track-index="41" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="sasaran-sfx-presiden" class="clip" src="public/sfx/pop-in.wav" data-at="word:Presiden" data-track-index="42" data-volume="0.15"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="sasaran-sfx-periode" class="clip" src="public/sfx/ding.wav" data-at="word:periode" data-track-index="43" data-volume="0.15"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const mono = "'JetBrains Mono', monospace";
      const osw = "Oswald, sans-serif";
      const W = F1.world;

      // simple line icons on a 64x64 box, stroke colour passed in
      const ICON = {
        presiden: (c) => `<circle cx="32" cy="32" r="25"/><path d="M32 14 L36.5 26 L49 26.5 L39.2 34.4 L42.6 46.5 L32 39.6 L21.4 46.5 L24.8 34.4 L15 26.5 L27.5 26 Z"/>`,
        pejabat: (c) => `<path d="M8 25 L32 9 L56 25 Z"/><path d="M14 30 V47 M26 30 V47 M38 30 V47 M50 30 V47"/><path d="M8 52 H56"/>`,
        politik: (c) => `<path d="M12 56 H52 M16 56 L20 28 H44 L48 56"/><rect x="24" y="8" width="16" height="12" rx="6"/><path d="M32 20 V28"/>`,
        media: (c) => `<rect x="8" y="12" width="40" height="40" rx="4"/><path d="M48 24 H56 V48 A4 4 0 0 1 52 52 H48"/><path d="M15 22 H32 M15 31 H41 M15 38 H41 M15 45 H30"/>`,
        ormas: (c) => `<circle cx="32" cy="20" r="7"/><circle cx="14" cy="26" r="5.5"/><circle cx="50" cy="26" r="5.5"/><path d="M19 50 V44 A13 13 0 0 1 45 44 V50 Z"/><path d="M4 48 V43 A10 10 0 0 1 12 35 M60 48 V43 A10 10 0 0 0 52 35"/>`,
        lsm: (c) => `<circle cx="32" cy="32" r="24"/><ellipse cx="32" cy="32" rx="10" ry="24"/><path d="M8 32 H56 M12 20 H52 M12 44 H52"/>`,
        pengusaha: (c) => `<rect x="8" y="20" width="48" height="32" rx="5"/><path d="M24 20 V14 A3 3 0 0 1 27 11 H37 A3 3 0 0 1 40 14 V20"/><path d="M8 34 H56"/><rect x="28" y="30" width="8" height="8" rx="2"/>`,
      };
      const svgIcon = (key, c, size) => `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">${ICON[key](c)}</svg>`;

      window.__timelines["sasaran"] = F1.scene("sasaran", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const l0 = F1.line(S, 0).start;
        const disadap = w("disadap");
        const prosedur = w("prosedur");
        const periode = w("periode");

        const tiles = [
          { key: "presiden", label: "PRESIDEN", at: w("Presiden") },
          { key: "pejabat", label: "PEJABAT NEGARA", at: w("pejabat") },
          { key: "politik", label: "TOKOH POLITIK", at: w("politik") },
          { key: "media", label: "MEDIA", at: w("Media") },
          { key: "ormas", label: "TOKOH ORMAS", at: w("ormas") },
          { key: "lsm", label: "LSM", at: w("LSM") },
          { key: "pengusaha", label: "PENGUSAHA", at: w("pengusaha") },
        ];

        // grid: 3 columns, 3 rows (7 tiles, last one centred), identical size
        const TW = 280, TH = 244, GX = 24, GY = 22, X0 = 72, Y0 = 530;
        const pos = (i) => {
          const r = Math.floor(i / 3), c = i % 3;
          const cols = r === 2 ? 1 : 3;
          const rowW = cols * TW + (cols - 1) * GX;
          const x = X0 + (888 - rowW) / 2 + c * (TW + GX);
          return { x, y: Y0 + r * (TH + GY) };
        };

        const tileHtml = (t, i) => {
          const inAt = disadap - 6 + i * 2;
          const ip = F1.ramp(f, inAt, 12, F1.expoOut);
          if (ip <= 0) return "";
          const { x, y } = pos(i);
          const lp = F1.ramp(f, t.at - 2, 10, F1.backOut);
          const lit = Math.min(1, Math.max(0, lp));
          const pulse = Math.max(0, 1 - (f - t.at) / 26);
          const sc = 1 + 0.07 * Math.max(0, Math.min(1, lp)) * Math.max(0, 1 - (f - t.at) / 14);
          return `<div style="position:absolute;left:${x}px;top:${n(y + (1 - ip) * 30)}px;width:${TW}px;height:${TH}px;opacity:${n(ip, 3)};transform:scale(${n(sc, 3)})">
<div style="position:absolute;inset:0;border-radius:22px;background:#151a26;border:4px solid rgba(255,255,255,0.18)"></div>
<div style="position:absolute;left:0;top:0;width:${TW}px;height:${TH}px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:${n(1 - lit, 3)}">${svgIcon(t.key, "#6f7585", 104)}<div style="font-family:${osw};font-weight:600;font-size:36px;letter-spacing:2px;white-space:nowrap;color:#6f7585">${t.label}</div></div>
<div style="position:absolute;inset:0;border-radius:22px;background:#1f2638;border:4px solid #ffd23f;box-sizing:border-box;opacity:${n(lit, 3)};box-shadow:0 0 ${n(10 + 40 * pulse)}px rgba(255,210,63,${n(0.18 + 0.5 * pulse, 3)})"></div>
<div style="position:absolute;left:0;top:0;width:${TW}px;height:${TH}px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:${n(lit, 3)}">${svgIcon(t.key, "#ffd23f", 104)}<div style="font-family:${osw};font-weight:600;font-size:36px;letter-spacing:2px;white-space:nowrap;color:#fff">${t.label}</div></div></div>`;
        };

        // attribution tag under the grid
        const tp = F1.ramp(f, l0 + 8, 14, F1.expoOut);
        const TAG = tp <= 0 ? "" : `<div style="position:absolute;left:72px;top:1336px;width:888px;text-align:center;opacity:${n(tp, 3)};transform:translateY(${n((1 - tp) * 20)}px)">
<div style="display:inline-block;padding:10px 20px;border-radius:10px;background:#111;border:2px solid rgba(255,255,255,0.5);font-family:${mono};font-weight:700;font-size:24px;line-height:1.4;letter-spacing:2px;color:#fff">KATA KABARESKRIM, 3 NOV<br><span style="color:#ffd23f">NAMA TIDAK DIUNGKAP</span></div></div>`;

        // period line
        const pp = F1.ramp(f, periode, 12, F1.expoOut);
        const PER = pp <= 0 ? "" : `<div style="position:absolute;left:72px;top:1425px;width:888px;text-align:center;opacity:${n(pp, 3)};transform:translateY(${n((1 - pp) * 16)}px);font-family:${mono};font-weight:700;font-size:28px;letter-spacing:4px;color:#ff7a1a">PERIODE <span style="color:#fff">2025–2026</span></div>`;

        // TANPA PROSEDUR chip, right of the HUD
        const cp = F1.ramp(f, prosedur - 2, 10, F1.expoOut);
        const CHIP = cp <= 0 ? "" : `<div style="position:absolute;left:${n(590 + (1 - cp) * 40)}px;top:262px;width:370px;text-align:center;box-sizing:border-box;padding:12px 18px;border-radius:12px;background:#ff2d3d;opacity:${n(cp, 3)};transform:scale(${n(1.5 - 0.5 * cp, 3)}) rotate(-3deg);font-family:${osw};font-weight:700;font-size:44px;letter-spacing:3px;color:#fff">TANPA PROSEDUR</div>`;

        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="sasaran-glow" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#1b2132"/><stop offset="1" stop-color="#0d0f16"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#sasaran-glow)"/>
${W.drift(f, { seed: 1210, count: 8, y0: 300, y1: 1400, color: "#ff7a1a", a: 0.16 })}
${W.sweep(f, { color: "#ffffff", a: 0.14, y0: 300, y1: 1400 })}
</svg>${tiles.map(tileHtml).join("")}${TAG}${PER}${CHIP}`;

        return F1.join(
          C.stage(f, D, BG, { zoom: 0.02, whip: false, shots: [{ at: 0, scale: 1, ox: 50, oy: 45 }] }),
          C.vignette(0.35, "50% 50%", 55),
          C.hud(f, { at: 4, kicker: "SASARAN", big: "SIAPA SAJA", sub: "MENURUT KABARESKRIM", src: "detik, Kompas, CNN Indonesia", bigSize: 56, w: 480 }),
          C.progress(f, { step: 4, label: "SIAPA YANG DISADAP" }),
        );
      });
    })();
  </script>
</template>
