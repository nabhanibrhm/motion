<!-- Belum: line 0 four identical photo suspect cards (2x2, each a TERSANGKA chip) appear on "Keempatnya", pasal strip on "pasal", "ANCAMAN MAKS 10 TAHUN" on "sepuluh". Line 1 the cards shrink to a mini grid top right, a case-file checklist with yellow BELUM markers (never red) appears on "motifnya", "mengalir", "pernyataan". Photos credited on screen; no stamp over faces. Sumber: lihat script-short.md S3, S7, S8. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root { position: absolute; inset: 0; background: #0d0f16; overflow: hidden; }
  </style>
  <div id="root" data-composition-id="belum" data-width="1080" data-height="1920">
    <div id="belum-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="belum-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="50" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="belum-sfx-pasal" class="clip" src="public/sfx/pop-in.wav" data-at="word:pasal" data-track-index="51" data-volume="0.15"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="belum-sfx-sepuluh" class="clip" src="public/sfx/stamp.wav" data-at="word:sepuluh" data-track-index="52" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="belum-sfx-motif" class="clip" src="public/sfx/pop.wav" data-at="word:motifnya" data-track-index="53" data-volume="0.12"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const mono = "'JetBrains Mono', monospace";
      const osw = "Oswald, sans-serif";
      // background-only ambient motion: deterministic, continuous in f (works with fractional frames at 60 fps)
      const DRIFT = (f, { seed, count, y0, y1, color, a }) => `<g fill="${color}" opacity="${a}">${Array.from({ length: count }, (_, i) => { const h = (k) => F1.world.hash(seed + i * 5 + k); return `<circle cx="${F1.n(60 + 960 * h(1) + 26 * Math.sin(f * 0.035 * (0.6 + h(2)) + h(3) * 6.28), 1)}" cy="${F1.n(y0 + (y1 - y0) * h(4) + 34 * Math.sin(f * 0.026 * (0.6 + h(5)) + h(6) * 6.28), 1)}" r="${F1.n(8 + 18 * h(7), 1)}"/>`; }).join("")}</g>`;
      const SWEEP = (f, { color, a, y0, y1 }) => `<g style="filter:blur(26px)" opacity="${F1.n(a * (0.65 + 0.35 * Math.sin(f * 0.021)), 3)}" transform="translate(${F1.n(-260 + 1000 * (0.5 + 0.5 * Math.sin(f * 0.0175)), 1)} 0)"><polygon points="0,${y0} 200,${y0} 100,${y1} -100,${y1}" fill="${color}"/></g>`;

      const PHOTOS = ["public/photos/listyo-ksp.jpg", "public/photos/ahrie.jpg", "public/photos/eko.jpg", "public/photos/slamet.jpg"];
      const NAMES = [
        ["LISTYO SIGIT", "PRABOWO"],
        ["AHRIE SONTA", "NASUTION"],
        ["EKO HADI", "SANTOSO"],
        ["SLAMET", "ULIANDI"],
      ];

      window.__timelines["belum"] = F1.scene("belum", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const L1 = F1.line(S, 1).start;
        const kempat = w("Keempatnya");
        const pasal = w("pasal");
        const sepuluh = w("sepuluh");
        const motif = w("motifnya");
        const belum0 = w("belum", 0);
        const mengalir = w("mengalir");
        const terjawab = w("terjawab");
        const listyo = w("Listyo");
        const pernyataan = w("pernyataan");

        // shrink progress of the suspect cards (all four share it)
        const k = F1.ramp(f, L1 - 4, 20, F1.expoOut);

        // ---------- four identical photo cards
        const CW = 435, CH = 300, S0 = 0.4;
        const card = (i) => {
          const p = F1.ramp(f, Math.max(2, kempat) + i * 4, 14, F1.backOut);
          if (p <= 0) return "";
          const pe = Math.min(1, p);
          const gx = 72 + (i % 2) * (CW + 18), gy = 500 + Math.floor(i / 2) * (CH + 18);
          const mx = 578 + (i % 2) * 182, my = 250 + Math.floor(i / 2) * 124;
          const x = F1.lerp(gx, mx, k), y = F1.lerp(gy, my, k);
          const sc = F1.lerp(1, S0, k) * (0.85 + 0.15 * Math.min(1.08, p));
          const op = pe * F1.lerp(1, 0.6, k);
          const nm = NAMES[i];
          return `<div style="position:absolute;left:${n(x)}px;top:${n(y + (1 - pe) * 40)}px;width:${CW}px;height:${CH}px;transform-origin:0 0;transform:scale(${n(sc, 3)});opacity:${n(op, 3)}">
<div style="position:absolute;inset:0;border-radius:20px;background:#1b2132;border:4px solid rgba(255,255,255,0.8)"></div>
<img src=${JSON.stringify(PHOTOS[i])} style="position:absolute;left:24px;top:18px;width:120px;height:160px;border-radius:12px;object-fit:cover;object-position:50% 20%;filter:saturate(0.9) contrast(1.05);background:#252d44;border:2px solid rgba(255,255,255,0.35);box-sizing:border-box">
<div style="position:absolute;left:164px;top:26px;padding:6px 14px;border-radius:8px;background:#ff7a1a;font-family:${mono};font-weight:700;font-size:24px;letter-spacing:2px;color:#111">TERSANGKA</div>
<div style="position:absolute;left:164px;top:80px;font-family:${mono};font-weight:500;font-size:22px;letter-spacing:2px;color:#c9c6c0">KASUS SADAPAN</div>
<div style="position:absolute;left:24px;right:16px;top:190px;font-family:${osw};font-weight:700;font-size:44px;line-height:1.08;letter-spacing:1px;color:#fff">${nm[0]}<br>${nm[1]}</div></div>`;
        };

        // ---------- pasal strip + ancaman banner (line 0, fade out as the line 1 starts)
        const out0 = 1 - F1.ramp(f, L1 - 4, 12, F1.easeOut);
        const pp = F1.ramp(f, pasal - 4, 14, F1.expoOut) * out0;
        const PASAL = pp <= 0 ? "" : `<div style="position:absolute;left:72px;top:${n(1190 + (1 - pp) * 30)}px;width:888px;height:112px;opacity:${n(pp, 3)}">
<div style="position:absolute;inset:0;border-radius:14px;background:#111;border:3px solid rgba(255,255,255,0.7)"></div>
<div style="position:absolute;left:0;right:0;top:12px;text-align:center;font-family:${mono};font-weight:500;font-size:22px;letter-spacing:3px;color:#c9c6c0">PASAL YANG DIJERATKAN · MENURUT POLRI</div>
<div style="position:absolute;left:0;right:0;top:46px;text-align:center;font-family:${mono};font-weight:700;font-size:34px;letter-spacing:1px;color:#fff">258 KUHP · 332 KUHP · 32 UU ITE</div></div>`;
        const cr = F1.ramp(f, Math.max(2, kempat) + 16, 12, F1.expoOut) * out0;
        const CREDIT = cr <= 0 ? "" : `<div style="position:absolute;left:72px;top:1126px;width:888px;opacity:${n(0.65 * cr, 3)};font-family:${mono};font-weight:500;font-size:18px;line-height:1.35;letter-spacing:0.3px;color:#fff">Foto: Listyo – BPMI Setpres (domain publik) · Ahrie – Ahrie Sonta Nasution (CC BY-SA 4.0) · Eko, Slamet – CNN Indonesia via Wikimedia Commons (CC BY-SA 4.0)</div>`;
        const sp = F1.ramp(f, sepuluh - 2, 10, F1.expoOut) * out0;
        const BANNER = sp <= 0 ? "" : `<div style="position:absolute;left:72px;top:1316px;width:888px;height:112px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#ff7a1a;opacity:${n(sp, 3)};transform:scale(${n(1.25 - 0.25 * sp, 3)});transform-origin:50% 50%"><span style="font-family:${osw};font-weight:700;font-size:64px;letter-spacing:3px;color:#111">ANCAMAN MAKS 10 TAHUN</span></div>`;

        // ---------- checklist (line 1)
        const items = [
          { at: motif, mark: belum0, tag: "MOTIF", text: "BELUM DIUNGKAP" },
          { at: mengalir, mark: terjawab, tag: "HASIL SADAPAN KE MANA", text: "BELUM TERJAWAB" },
          { at: listyo, mark: pernyataan, tag: "PERNYATAAN LISTYO", text: "BELUM ADA" },
        ];
        const PX = 72, PW = 888, PY = 560, HDR = 74, RH = 190, GAP = 18;
        const PH = HDR + items.length * (RH + GAP) + 6;
        const pp2 = F1.ramp(f, L1 + 2, 16, F1.expoOut);
        const row = (it, i) => {
          const y = PY + HDR + i * (RH + GAP);
          const p = F1.ramp(f, it.at - 6, 12, F1.backOut);
          if (p <= 0) return "";
          const pe = Math.min(1, p);
          const mk = F1.ramp(f, it.mark, 10, F1.backOut);
          const glow = Math.max(0, 1 - (f - it.mark) / 24);
          const col = "#ffd23f";
          const marker = `<div style="position:absolute;right:28px;top:${(RH - 88) / 2}px;width:88px;height:88px;border-radius:50%;border:6px dashed ${col};box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:${osw};font-weight:700;font-size:56px;color:${col};opacity:${n(Math.min(1, mk), 3)};transform:scale(${n(Math.max(0, mk), 3)}) rotate(${n(Math.sin(f / 14 + i) * 4, 2)}deg)">?</div>`;
          return `<div style="position:absolute;left:${n(PX + 18 + (1 - pe) * 70)}px;top:${y}px;width:${PW - 36}px;height:${RH}px;opacity:${n(pe, 3)}">
<div style="position:absolute;inset:0;border-radius:16px;background:#1b2132;border:3px solid rgba(255,210,63,0.55);box-shadow:0 0 ${n(30 * glow)}px rgba(255,210,63,0.45)"></div>
<div style="position:absolute;left:30px;top:0;right:140px;height:${RH}px;display:flex;flex-direction:column;justify-content:center;gap:10px">
<div style="font-family:${mono};font-weight:700;font-size:24px;letter-spacing:3px;color:#c9c6c0">${it.tag}</div>
<div style="font-family:${osw};font-weight:700;font-size:62px;line-height:1.05;letter-spacing:1px;color:${col}">${it.text}</div>
</div>${marker}</div>`;
        };
        const PANEL = pp2 <= 0 ? "" : `<div style="position:absolute;left:${PX}px;top:${n(PY + (1 - pp2) * 50)}px;width:${PW}px;height:${PH}px;opacity:${n(pp2, 3)}">
<div style="position:absolute;inset:0;border-radius:24px;background:#151a26;border:4px solid rgba(255,255,255,0.85)"></div>
<div style="position:absolute;left:50%;top:-18px;width:160px;height:36px;margin-left:-80px;border-radius:10px;background:#ffd23f"></div>
<div style="position:absolute;left:34px;top:22px;font-family:${mono};font-weight:700;font-size:26px;letter-spacing:4px;color:#ff7a1a">BERKAS KASUS · PENYADAPAN</div>
<div style="position:absolute;left:34px;right:34px;top:${HDR - 6}px;height:2px;background:rgba(255,255,255,0.18)"></div></div>`;
        const ft = F1.ramp(f, L1 + 20, 12, F1.expoOut);
        const FOOT = ft <= 0 ? "" : `<div style="position:absolute;left:72px;top:${PY + PH + 30}px;width:888px;text-align:center;opacity:${n(ft, 3)};font-family:${mono};font-weight:700;font-size:24px;letter-spacing:3px;color:#c9c6c0">STATUS PER 6 NOV 2026 · MENURUT PEMBERITAAN</div>`;

        const BG = `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, #1b2132 0%, #0d0f16 75%)"></div>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">${DRIFT(f, { seed: 520, count: 8, y0: 480, y1: 1400, color: "#ff7a1a", a: 0.18 })}${SWEEP(f, { color: "#ffffff", a: 0.14, y0: 300, y1: 1400 })}</svg>
${[0, 1, 2, 3].map(card).join("")}${CREDIT}${PASAL}${BANNER}${PANEL}${items.map(row).join("")}${FOOT}`;

        return F1.join(
          C.stage(f, D, BG, { zoom: 0.025, whip: false, shots: [{ at: 0, scale: 1, ox: 50, oy: 50 }] }),
          C.vignette(0.35, "50% 50%", 55),
          C.hud(f, { at: 4, kicker: "KASUS PENYADAPAN", big: "4 TERSANGKA", sub: "YANG BELUM TERJAWAB", src: "Kompas, detik, CNBC Indonesia", bigSize: 52 }),
          C.progress(f, { step: 5, label: "BELUM TERJAWAB" }),
        );
      });
    })();
  </script>
</template>
