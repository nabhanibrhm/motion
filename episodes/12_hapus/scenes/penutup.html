<!-- Penutup (hapus): phone with lock. "NOMOR PRESIDEN SAJA BISA DISADAP" on "Presiden", signal rings on "disadap", lock opens on "aman", "NOMOR KITA?" on "kita". Line 1: end card INGAT, STATUS: TERSANGKA ("tersangka"), PRADUGA TAK BERSALAH ("praduga"), APA YANG HARUS DIUNGKAP DULUAN? ("Menurutmu"), TULIS DI KOMENTAR ("Tulis"), FOLLOW ("follow"), footer HOTWIZZ #03 · SUMBER DI DESKRIPSI. Then a title-only cover card over the tail. No photos. Sumber: detik, Kompas, CNN Indonesia. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root { position: absolute; inset: 0; background: #0d0f16; overflow: hidden; }
  </style>
  <div id="root" data-composition-id="penutup" data-width="1080" data-height="1920">
    <div id="penutup-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="penutup-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="60" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="penutup-sfx-kita" class="clip" src="public/sfx/ding.wav" data-at="word:kita" data-track-index="61" data-volume="0.15"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="penutup-sfx-tersangka" class="clip" src="public/sfx/stamp.wav" data-at="word:tersangka" data-track-index="62" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="penutup-sfx-follow" class="clip" src="public/sfx/pop-in.wav" data-at="word:follow" data-track-index="63" data-volume="0.15"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const RED = "#ff2d3d", ORG = "#ff7a1a", YEL = "#ffd23f";
      const mono = "'JetBrains Mono', monospace";
      const CX = 500; // art centre (right ~120 px stays clear)
      // background-only ambient motion: deterministic, continuous in f (fractional frames at 60 fps are fine)
      const DRIFT = (f, { seed, count, y0, y1, color, a }) => `<g fill="${color}" opacity="${a}">${Array.from({ length: count }, (_, i) => { const h = (k) => F1.world.hash(seed + i * 5 + k); return `<circle cx="${F1.n(60 + 960 * h(1) + 26 * Math.sin(f * 0.035 * (0.6 + h(2)) + h(3) * 6.28), 1)}" cy="${F1.n(y0 + (y1 - y0) * h(4) + 34 * Math.sin(f * 0.026 * (0.6 + h(5)) + h(6) * 6.28), 1)}" r="${F1.n(8 + 18 * h(7), 1)}"/>`; }).join("")}</g>`;
      const SWEEP = (f, { color, a, y0, y1 }) => `<g style="filter:blur(26px)" opacity="${F1.n(a * (0.65 + 0.35 * Math.sin(f * 0.021)), 3)}" transform="translate(${F1.n(-260 + 1000 * (0.5 + 0.5 * Math.sin(f * 0.0175)), 1)} 0)"><polygon points="0,${y0} 200,${y0} 100,${y1} -100,${y1}" fill="${color}"/></g>`;
      window.__timelines["penutup"] = F1.scene("penutup", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const presiden = w("Presiden"), disadap = w("disadap"), aman = w("aman"), kita = w("kita");
        const L1 = F1.line(S, 1);
        const tersangka = w("tersangka"), praduga = w("praduga"), menurutmu = w("Menurutmu"), tulis = w("Tulis"), follow = w("follow");
        const pop = (at, d = 12) => Math.min(1, F1.ramp(f, at, d, F1.backOut));
        const sm = (at, d = 14) => F1.ramp(f, at, d, F1.expoOut);
        const sh = (p) => `opacity:${n(Math.min(1, p), 3)};transform:translateY(${n((1 - Math.min(1, p)) * 40)}px) scale(${n(0.9 + 0.1 * Math.min(1, p), 3)})`;
        const txt = (size, color, extra = "") => `font-family:Oswald,sans-serif;font-weight:700;font-size:${size}px;color:${color};letter-spacing:2px;${extra}`;
        const box = (y, inner, extra = "") => `<div style="position:absolute;left:${CX - 440}px;top:${y}px;width:880px;text-align:center;${extra}">${inner}</div>`;

        // ---------- line 0: phone with lock ----------
        const gone = F1.ramp(f, L1.start - 8, 12, F1.easeIn);
        const phoneIn = pop(4, 16);
        const open = F1.ramp(f, aman, 14, F1.backOut);
        const openC = Math.min(1, Math.max(0, open));
        const kp = pop(kita - 2, 12);
        const hot = F1.ramp(f, aman, 10, F1.easeOut);
        const lockCol = hot > 0.5 ? RED : YEL;
        // signal rings from "disadap": continuous phase, fractional-safe
        let rings = "";
        const rs = F1.ramp(f, disadap - 2, 10, F1.easeOut);
        if (rs > 0) {
          for (let i = 0; i < 3; i++) {
            const t = (f - disadap) * 0.017 + i / 3;
            const ph = t - Math.floor(t);
            rings += `<circle cx="0" cy="0" r="${n(90 + 190 * ph)}" fill="none" stroke="${hot > 0.5 ? RED : YEL}" stroke-width="5" opacity="${n(rs * 0.7 * (1 - ph), 3)}"/>`;
          }
        }
        const PX = CX - 220, PY = 690, PW = 440, PH = 730;
        const lockSvg = `<svg width="440" height="440" viewBox="-220 -220 440 440" style="position:absolute;left:${PX}px;top:${PY + 90}px;overflow:visible">
<g transform="translate(0 -10)">${rings}</g>
<g transform="translate(0 ${n(-openC * 22)}) rotate(${n(openC * -24)} 38 -20)"><path d="M-56 -30 V-70 A56 56 0 0 1 56 -70 V-30" fill="none" stroke="${lockCol}" stroke-width="22" stroke-linecap="round"/></g>
<rect x="-86" y="-36" width="172" height="136" rx="20" fill="${lockCol}"/>
<circle cx="0" cy="22" r="17" fill="#0d0f16"/><rect x="-6" y="30" width="12" height="38" rx="6" fill="#0d0f16"/></svg>`;
        const PHONE = phoneIn <= 0 ? "" : `<div style="position:absolute;left:${PX}px;top:${n(PY + (1 - Math.min(1, phoneIn)) * 80 + gone * 200)}px;width:${PW}px;height:${PH}px;opacity:${n(Math.min(1, phoneIn) * (1 - gone), 3)}">
<div style="position:absolute;inset:0;border-radius:56px;background:#05070c;border:10px solid #2a3144;box-shadow:0 0 80px rgba(255,45,61,${n(0.35 * hot, 3)}),0 30px 60px rgba(0,0,0,0.5)"></div>
<div style="position:absolute;left:30px;top:30px;right:30px;bottom:30px;border-radius:36px;background:linear-gradient(180deg,#171d2c 0%,#0d0f16 100%);overflow:hidden"></div>
<div style="position:absolute;left:50%;top:38px;width:110px;height:26px;margin-left:-55px;border-radius:14px;background:#05070c"></div>
<div style="position:absolute;left:30px;right:30px;top:96px;text-align:center;font-family:${mono};font-weight:700;font-size:24px;letter-spacing:3px;color:#9aa3b8">NOMOR PRESIDEN</div>
<div style="position:absolute;left:30px;right:30px;top:134px;text-align:center;font-family:${mono};font-weight:700;font-size:30px;letter-spacing:4px;color:#fff">+62 8●● ●●●● ●●●●</div></div>`;
        const LOCK = phoneIn <= 0 ? "" : `<div style="position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:${n(Math.min(1, phoneIn) * (1 - gone), 3)};transform:translateY(${n(gone * 200)}px)">${lockSvg}</div>`;
        const KITA = kp <= 0 ? "" : `<div style="position:absolute;left:${PX + 20}px;top:${n(PY + 520 + (1 - kp) * 30 + gone * 200)}px;width:${PW - 40}px;text-align:center;opacity:${n(Math.min(1, kp) * (1 - gone), 3)};transform:scale(${n(0.7 + 0.3 * kp, 3)})">
<div style="${txt(70, "#fff", "white-space:nowrap;padding:8px 0;border-radius:16px;background:" + RED + ";letter-spacing:3px")}">NOMOR KITA?</div></div>`;
        const hp = F1.ramp(f, presiden - 4, 14, F1.expoOut);
        const HEADL = hp <= 0 ? "" : box(n(480 + (1 - hp) * 30 + gone * 80), `<div style="${txt(68, "#fff", "line-height:76px;letter-spacing:2px")}">NOMOR <span style="color:${YEL}">PRESIDEN</span><br>SAJA BISA <span style="color:${RED}">DISADAP</span></div>`, `opacity:${n(hp * (1 - gone), 3)}`);

        // ---------- line 1: end card ----------
        const e0 = pop(L1.start - 2, 12), e1 = pop(tersangka - 2, 12), e2 = pop(praduga - 2, 12);
        const e3 = pop(menurutmu - 1, 12), e4 = pop(tulis - 1, 12), e5 = pop(follow, 12), e6 = sm(follow + 8, 14);
        const ul = F1.ramp(f, praduga + 6, 16, F1.easeOut);
        const item = (p, inner) => `<div style="text-align:center;opacity:${n(Math.min(1, p), 3)};transform:translateY(${n((1 - Math.min(1, p)) * 30)}px) scale(${n(0.92 + 0.08 * Math.min(1, p), 3)})">${inner}</div>`;
        const CARD = f < L1.start - 2 ? "" : `<div style="position:absolute;left:${CX - 440}px;top:300px;width:880px;height:1140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px">
${item(e0, `<span style="font-family:${mono};font-weight:700;font-size:34px;letter-spacing:8px;color:${ORG}">INGAT</span>`)}
${item(e1, `<div style="font-family:${mono};font-weight:700;font-size:34px;letter-spacing:5px;color:#9aa3b8">STATUS:</div><div style="${txt(110, YEL, "line-height:116px;letter-spacing:4px;white-space:nowrap")}">TERSANGKA</div>`)}
${item(e2, `<div style="${txt(64, "#fff", "letter-spacing:2px;white-space:nowrap")}">PRADUGA TAK BERSALAH</div><div style="margin:8px auto 0;width:${n(760 * ul)}px;height:8px;border-radius:4px;background:${ORG}"></div>`)}
${item(e3, `<div style="${txt(76, "#fff", "line-height:84px;letter-spacing:2px;white-space:nowrap")}">APA YANG HARUS<br><span style="color:${ORG}">DIUNGKAP DULUAN?</span></div>`)}
${item(e4, `<span style="display:inline-block;padding:8px 32px;border-radius:14px;border:5px solid ${RED};background:rgba(255,45,61,0.14);${txt(50, "#fff", "letter-spacing:3px;white-space:nowrap")}">TULIS DI KOMENTAR</span>`)}
${item(e5, `<span style="display:inline-block;padding:8px 40px;border-radius:14px;background:${YEL};${txt(52, "#0d0f16", "letter-spacing:4px;white-space:nowrap")}">FOLLOW UNTUK UPDATE</span>`)}
<div style="opacity:${n(e6, 3)};text-align:center"><span style="font-family:${mono};font-weight:700;font-size:26px;letter-spacing:3px;color:#9aa3b8;white-space:nowrap">HOTWIZZ #03 · SUMBER DI DESKRIPSI</span></div></div>`;

        const BG = `<div style="position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 45%,#1a2030 0%,#0d0f16 80%)"></div>
<div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,0.025) 0 2px,transparent 2px 6px)"></div>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
${DRIFT(f, { seed: 1260, count: 8, y0: 300, y1: 1400, color: ORG, a: 0.2 })}
${SWEEP(f, { color: "#ffffff", a: 0.14, y0: 280, y1: 1420 })}</svg>
${HEADL}${PHONE}${LOCK}${KITA}${CARD}`;

        // Title-only cover card over the tail (after the last word), for TikTok's "Select cover".
        // Text stays inside the centred 3:4 crop (y 240-1680). Drawn last so the progress bar and hud never show over it.
        const cv = F1.ramp(f, L1.end + 4, 5);
        const cover = cv <= 0 ? "" : `<div style="${F1.css({ position: "absolute", inset: 0, zIndex: 50, background: "radial-gradient(ellipse 80% 55% at 50% 48%,#1b2132 0%,#0d0f16 80%)", opacity: n(cv, 3), display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 40 })}">
<div style="${F1.css({ padding: "10px 26px", border: "6px solid " + RED, borderRadius: 12, transform: "rotate(-5deg)", fontFamily: "Oswald, sans-serif", fontWeight: 600, fontSize: 52, letterSpacing: 6, color: RED })}">HOTWIZZ #03</div>
<div style="${F1.css({ textAlign: "center", fontFamily: "Oswald, sans-serif", fontWeight: 700, color: "#fff", lineHeight: 1.04, letterSpacing: 2 })}"><div style="font-size:118px">TERSANGKA</div><div style="font-size:118px;color:${YEL}">KEEMPAT</div></div>
<div style="${F1.css({ padding: "6px 34px", borderRadius: 16, background: RED, fontFamily: "Oswald, sans-serif", fontWeight: 700, fontSize: 84, letterSpacing: 3, color: "#fff" })}">HAPUS SADAPAN?</div></div>`;

        return F1.join(
          C.stage(f, D, BG, { zoom: 0.02, whip: false, shots: [{ at: 0, scale: 1, ox: 50, oy: 45 }, { at: L1.start - 6, scale: 1, ox: 50, oy: 48, ease: 14 }] }),
          C.vignette(0.45, "50% 50%", 50),
          f < L1.start - 8 ? C.hud(f, { at: 4, kicker: "PERTANYAAN", big: "KEAMANAN", sub: "NOMOR PRESIDEN DISADAP", src: "detik, Kompas, CNN Indonesia", bigSize: 52, w: 440 }) : "",
          C.progress(f, { step: 6, label: "PERTANYAAN KITA" }),
          cover,
        );
      });
    })();
  </script>
</template>
