<!-- MSCI: a giant clipboard "DAFTAR MSCI EMERGING MARKETS" whose rows tick on "daftar"; fund trucks drive in and park in line behind it on "dana", the INDONESIA row lights up on "pasif" (HUD ±0,42%, Kontan). On "Terus" the clipboard and trucks swing out and a ladder DEVELOPED / EMERGING / FRONTIER / STANDALONE slides in; the INDONESIA? marker sits on EMERGING and drops to STANDALONE on "Standalone" (a proposal: BARU USULAN). Reason tags pop on "kepemilikan" and "dugaan" (MSCI, 15 Okt 2026). Nisa, Muklis, Beni, Muklis. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #efe4d0;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="msci" data-width="1080" data-height="1920">
    <div id="msci-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="msci-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="20" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="3.1667" id="msci-sfx-daftar" class="clip" src="public/sfx/pop-in.wav" data-at="word:daftar" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="6.2333" id="msci-sfx-pasif" class="clip" src="public/sfx/ding-num.wav" data-at="word:pasif" data-track-index="13" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="11.4" id="msci-sfx-slide" class="clip" src="public/sfx/swoosh-soft.wav" data-at="word:Standalone" data-track-index="14" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="15.9" id="msci-sfx-milik" class="clip" src="public/sfx/pop-in.wav" data-at="word:kepemilikan" data-track-index="15" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="18.4667" id="msci-sfx-dugaan" class="clip" src="public/sfx/pop-in.wav" data-at="word:dugaan" data-track-index="16" data-volume="0.09"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      // the clipboard: five rows, each ticks in order from `tick0`; row 3 is INDONESIA and lights up from `hot`
      const CLIP = (f, { tick0, hot }) => {
        const rows = [150, 70, 120, 0, 100].map((wd, i) => {
          const y = 190 + 56 * i;
          const p = F1.ramp(f, tick0 + 8 * i, 8, F1.expoOut);
          const isId = i === 3;
          const lit = isId ? F1.ramp(f, hot, 10, F1.expoOut) : 0;
          const bar = isId
            ? `<text x="112" y="${y + 29}" font-family="Oswald" font-weight="600" font-size="32" letter-spacing="3" fill="${lit > 0 ? "#c0392b" : INK}">INDONESIA</text>`
            : `<rect x="112" y="${y + 10}" width="${180 + wd}" height="16" rx="8" fill="#d6cdbd"/><rect x="112" y="${y + 32}" width="${100 + wd / 2}" height="10" rx="5" fill="#e4dccb"/>`;
          return `<g>${isId && lit > 0 ? `<rect x="46" y="${y - 6}" width="488" height="52" rx="10" fill="#d0413a" opacity="${n(0.16 * lit, 3)}" stroke="#c0392b" stroke-width="4"/>` : ""}<rect x="62" y="${y + 6}" width="38" height="38" rx="8" fill="#fff" stroke="${INK}" stroke-width="4"/>${p > 0 ? `<path d="M69 ${y + 25} L79 ${y + 36} L94 ${y + 14}" fill="none" stroke="#4e8a4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="48" stroke-dashoffset="${n(48 * (1 - p))}"/>` : ""}${bar}</g>`;
        });
        return `<g transform="translate(250 490) rotate(-2 290 260)"><rect x="0" y="0" width="580" height="530" rx="26" fill="#a87f55" stroke="${INK}" stroke-width="6"/>
<rect x="28" y="46" width="524" height="456" rx="10" fill="#fffaf0" stroke="${INK}" stroke-width="4"/>
<rect x="190" y="-18" width="200" height="62" rx="14" fill="#c9c6c0" stroke="${INK}" stroke-width="5"/><circle cx="290" cy="12" r="12" fill="#8d8a84" stroke="${INK}" stroke-width="3"/>
<text x="290" y="106" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="36" letter-spacing="3" fill="${INK}">DAFTAR MSCI</text>
<text x="290" y="150" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="32" letter-spacing="3" fill="#6b5f52">EMERGING MARKETS</text>
${rows.join("")}</g>`;
      };
      const TRUCK = (x, y, label, ang) => `<g transform="translate(${n(x)} ${y})"><rect x="0" y="-96" width="156" height="84" rx="10" fill="#f6efe1" stroke="${INK}" stroke-width="5"/><text x="78" y="-46" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="22" letter-spacing="1" fill="${INK}">${label}</text>
<path d="M156 -80 H198 L224 -46 V-12 H156 Z" fill="#3f78b5" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M172 -68 H194 L210 -46 H172 Z" fill="#cfe6ee" stroke="${INK}" stroke-width="3"/>
${[40, 190].map((cx) => `<g transform="translate(${cx} -12) rotate(${n(ang, 1)})"><circle r="21" fill="#3b3b40" stroke="${INK}" stroke-width="4"/><path d="M-14 0 H14 M0 -14 V14" stroke="#c9c6c0" stroke-width="4"/></g>`).join("")}</g>`;
      const RUNGS = [
        { t: "DEVELOPED", c: "#b9dfb0", y: 500 },
        { t: "EMERGING", c: "#f1dd8e", y: 636 },
        { t: "FRONTIER", c: "#f3b97b", y: 772 },
        { t: "STANDALONE", c: "#ee8f84", y: 908 },
      ];
      const LADDER = (f, { slide, mark, drop, land }) => {
        const rungs = RUNGS.map((r, i) => {
          const shake = i === 3 && land > 0 ? 6 * Math.sin(land * 30) * (1 - land) : 0;
          return `<g transform="translate(${n(shake)} 0)"><rect x="90" y="${r.y}" width="470" height="118" rx="16" fill="${r.c}" stroke="${INK}" stroke-width="6"/><text x="325" y="${r.y + 76}" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="46" letter-spacing="5" fill="${INK}">${r.t}</text></g>`;
        }).join("");
        const my = 695 + (967 - 695) * drop;
        const marker =
          mark <= 0
            ? ""
            : `<g transform="translate(770 ${n(my)}) scale(${n(0.6 + 0.4 * mark, 3)})" opacity="${n(mark, 3)}"><path d="M-200 0 L-160 -34 H160 V34 H-160 Z" fill="${INK}"/><text x="0" y="14" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="38" letter-spacing="3" fill="#f5d27a">INDONESIA${drop > 0.9 ? "" : "?"}</text></g>`;
        return `<g transform="translate(${n(1100 * (1 - slide))} 0)"><rect x="60" y="480" width="10" height="560" fill="#8a6f55" opacity="0.5"/>${rungs}${marker}
<text x="90" y="1076" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="2" fill="#6b5f52">BARU USULAN · BELUM KEPUTUSAN</text></g>`;
      };
      window.__timelines["msci"] = F1.scene("msci", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const daftar = w("daftar");
        const dana = w("dana");
        const pasif = w("pasif");
        const terus = w("Terus");
        const indonesia = w("Indonesia");
        const standalone = w("Standalone");
        const kepemilikan = w("kepemilikan");
        const dugaan = w("dugaan");
        const out = F1.ramp(f, terus, 14, F1.expoOut);
        const slide = F1.ramp(f, terus + 4, 16, F1.expoOut);
        const mark = F1.ramp(f, indonesia, 10, F1.expoOut);
        const drop = F1.ramp(f, standalone, 22, F1.easeOut);
        const land = F1.ramp(f, standalone + 22, 14, F1.easeOut);
        const trucks = ["DANA GLOBAL", "DANA PASIF", "DANA PASIF"]
          .map((label, i) => {
            const p = F1.ramp(f, dana + 6 * i, 36, F1.easeOut);
            const x0 = -260 - 280 * i;
            const x1 = 90 + 260 * i;
            const x = x0 + (x1 - x0) * p;
            const bounce = f > pasif ? -3 * Math.abs(Math.sin((f - pasif) / 4 + i)) * (1 - F1.ramp(f, pasif + 30, 10)) : 0;
            return TRUCK(x, 1120 + bounce, label, x * 1.6);
          })
          .join("");
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#efe4d0"/>
<g style="filter:blur(3px)"><rect x="700" y="300" width="300" height="400" fill="#f7e3b0"/><path d="M700 300 h300 v400 h-300 Z M850 300 v400 M700 500 h300" stroke="#8a6f55" stroke-width="16" fill="none"/></g>
${W.dust(f, { x: 120, y: 480, w: 800, h: 640, count: 20, seed: 6, color: "#fff3cf", alpha: 0.5 })}
<rect x="0" y="1128" width="1080" height="792" fill="#cdb898"/><rect x="0" y="1118" width="1080" height="12" fill="#a8906f"/>
<g transform="translate(${n(-1100 * out)} 0)">${CLIP(f, { tick0: daftar, hot: pasif })}${trucks}</g>
${LADDER(f, { slide, mark, drop, land })}</svg>`;
        const hud =
          f >= indonesia
            ? C.hud(f, { at: indonesia, kicker: "USULAN MSCI · KONSULTASI", big: "STANDALONE", sub: "PENGUMUMAN 15 OKT 2026", src: "MSCI (15 Okt 2026)", bigSize: 54, w: 520 })
            : f >= pasif
              ? C.hud(f, { at: pasif, kicker: "PORSI INDONESIA", big: "±0,42%", sub: "DARI MSCI EM · 9 SAHAM", src: "Kontan (14 Okt 2026)" })
              : C.hud(f, { at: 4, kicker: "TERSANGKA", big: "MSCI", sub: "PEMBUAT DAFTAR SAHAM GLOBAL" });
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.04,
            shots: [
              { at: 0, scale: 1.05, ox: 50, oy: 36 },
              { at: dana, scale: 1.06, ox: 35, oy: 32, ease: 14 },
              { at: terus, scale: 1, ox: 50, oy: 45, ease: 12 },
              { at: kepemilikan - 6, scale: 1.03, ox: 55, oy: 25, ease: 14 },
            ],
          }),
          C.vignette(0.3, "50% 50%", 55),
          f >= terus ? "" : C.tag(f, { at: w("wajib"), x: 600, y: 920, rot: 5, light: true, size: 40, text: `<span style="color:#c0392b">WAJIB IKUT</span>` }),
          f < terus + 14 ? "" : C.tag(f, { at: kepemilikan, x: 590, y: 520, rot: -3, size: 30, text: "KEPEMILIKAN<br>TIDAK TRANSPARAN" }),
          f < terus + 14 ? "" : C.tag(f, { at: dugaan, x: 590, y: 650, rot: 3, size: 30, text: "DUGAAN TRANSAKSI<br>TERKOORDINASI" }),
          C.progress(f, { step: 3, label: "TERSANGKA · MSCI" }),
          hud,
          C.cast(S, f, [
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
            { src: C.CAST.beni, x: 540, y: 1200, w: 400 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
