<!-- Kalau: a wall calendar shows "?" while Beni asks; on "Juni" the page flips to 30 JUN 2027 · KEPUTUSAN MSCI (paling lambat; HUD with source). On "Argentina" a flag card pops: STANDALONE SEJAK 2021. On "Tapi" the scene swaps to two history charts with only the verified points: KRISIS 2008 (2.830 -> 1.111 -> record 2.844) draws from "rekor", COVID 2020 (±6.300 -> 3.937 -> record 6.723,39) draws from "COVID"; the MASA LALU BUKAN JAMINAN stamp slams on "jaminan". Beni, Muklis. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #eadcc4;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="kalau" data-width="1080" data-height="1920">
    <div id="kalau-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="kalau-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="20" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.8333" id="kalau-sfx-juni" class="clip" src="public/sfx/tick.wav" data-at="word:Juni" data-track-index="12" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.5667" id="kalau-sfx-arg" class="clip" src="public/sfx/pop-in.wav" data-at="word:Argentina" data-track-index="13" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="10.6667" id="kalau-sfx-rekor" class="clip" src="public/sfx/ding-num.wav" data-at="word:rekor" data-track-index="14" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="14.1" id="kalau-sfx-covid" class="clip" src="public/sfx/pop-in.wav" data-at="word:COVID" data-track-index="15" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="15.5667" id="kalau-sfx-stamp" class="clip" src="public/sfx/stamp.wav" data-at="word:jaminan" data-track-index="16" data-volume="0.35"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const mono = "JetBrains Mono";
      // wall calendar; the page squashes away and back around the binding when it flips from "?" to 30 JUN 2027
      const CAL = (f, { flip, juni, alpha }) => {
        const after = f >= juni + 5;
        const sy = flip > 0 ? Math.abs(Math.cos(Math.PI * flip)) : 1;
        return `<g opacity="${n(alpha, 3)}" transform="translate(330 500)"><rect x="0" y="0" width="420" height="340" rx="20" fill="#f6efe1" stroke="${INK}" stroke-width="6"/><rect x="0" y="0" width="420" height="92" rx="20" fill="#c0392b" stroke="${INK}" stroke-width="6"/>
<circle cx="110" cy="0" r="12" fill="${INK}"/><circle cx="310" cy="0" r="12" fill="${INK}"/>
<g transform="translate(0 92) scale(1 ${n(sy, 3)}) translate(0 -92)"><text x="210" y="66" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="48" letter-spacing="4" fill="#fff">${after ? "JUN 2027" : "TAHUN DEPAN"}</text>
<text x="210" y="252" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="${after ? 170 : 150}" fill="${after ? "#c0392b" : INK}">${after ? "30" : "?"}</text>
<text x="210" y="312" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="30" letter-spacing="3" fill="#6b5f52">KEPUTUSAN MSCI</text></g></g>`;
      };
      const ARG = (p, alpha) =>
        p <= 0
          ? ""
          : `<g opacity="${n(p * alpha, 3)}" transform="translate(540 985) scale(${n(0.7 + 0.3 * p, 3)}) translate(-540 -985)"><rect x="190" y="880" width="700" height="210" rx="20" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<g stroke="${INK}" stroke-width="4"><rect x="220" y="910" width="200" height="40" fill="#74acdf"/><rect x="220" y="950" width="200" height="50" fill="#fff"/><rect x="220" y="1000" width="200" height="40" fill="#74acdf"/></g><circle cx="320" cy="975" r="14" fill="#f2c14e" stroke="${INK}" stroke-width="3"/>
<text x="450" y="975" font-family="Oswald" font-weight="600" font-size="58" letter-spacing="3" fill="${INK}">ARGENTINA</text>
<text x="450" y="1022" font-family="Oswald" font-weight="600" font-size="32" letter-spacing="2" fill="#c0392b">STANDALONE SEJAK 2021</text>
<text x="450" y="1062" font-family="${mono}" font-weight="500" font-size="18" fill="#6b5f52">Sumber: CNBC Africa (Jun 2021)</text></g>`;
      // history chart: panel at (px, 490), width 420; points = [{ fx, v, big, small, kind }]; p draws the line (0..1)
      const HIST = (f, { px, alpha, title, pts, lo, hi, p, src }) => {
        if (alpha <= 0) return "";
        const x0 = px + 40;
        const span = 340;
        const X = (fx) => x0 + fx * span;
        const Y = (v) => 920 - ((v - lo) / (hi - lo)) * 240;
        const q = pts.map((t) => ({ x: X(t.fx), y: Y(t.v) }));
        // length-based drawing across the two segments
        const L = [Math.hypot(q[1].x - q[0].x, q[1].y - q[0].y), Math.hypot(q[2].x - q[1].x, q[2].y - q[1].y)];
        const d = p * (L[0] + L[1]);
        const upto = [q[0]];
        if (d <= L[0]) upto.push({ x: q[0].x + ((q[1].x - q[0].x) * d) / L[0], y: q[0].y + ((q[1].y - q[0].y) * d) / L[0] });
        else {
          const e = (d - L[0]) / L[1];
          upto.push(q[1], { x: q[1].x + (q[2].x - q[1].x) * e, y: q[1].y + (q[2].y - q[1].y) * e });
        }
        const path = upto.map((t, i) => `${i ? "L" : "M"}${n(t.x)} ${n(t.y)}`).join(" ");
        const tip = upto[upto.length - 1];
        const reached = [p > 0.001, d >= L[0] - 1, p > 0.999];
        const labels = pts
          .map((t, i) => {
            if (!reached[i]) return "";
            const below = t.kind === "low";
            const anchor = i === 0 ? "start" : i === 2 ? "end" : "middle";
            const lx = i === 0 ? q[i].x - 12 : i === 2 ? q[i].x + 12 : q[i].x;
            const rec = t.kind === "rec";
            const vy = below ? 962 : q[i].y - (rec ? 52 : 36);
            const sy = below ? 984 : q[i].y - (rec ? 28 : 16);
            const big =
              t.kind === "rec"
                ? `<g><rect x="${n(lx - 8 - t.bw)}" y="${n(vy - 28)}" width="${t.bw + 16}" height="38" rx="9" fill="#C6F432" stroke="${INK}" stroke-width="4"/><text x="${n(lx)}" y="${n(vy)}" text-anchor="end" font-family="Oswald" font-weight="600" font-size="28" fill="${INK}">${t.big}</text></g>`
                : `<text x="${n(lx)}" y="${n(vy)}" text-anchor="${anchor}" font-family="${mono}" font-weight="700" font-size="28" fill="${t.kind === "low" ? "#c0392b" : INK}">${t.big}</text>`;
            return `${big}<text x="${n(lx)}" y="${n(sy)}" text-anchor="${anchor}" font-family="${mono}" font-weight="500" font-size="18" fill="#6b5f52">${t.small}</text>`;
          })
          .join("");
        return `<g opacity="${n(alpha, 3)}" transform="translate(0 ${n(30 * (1 - alpha))})"><rect x="${px}" y="490" width="420" height="540" rx="22" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<text x="${px + 30}" y="556" font-family="Oswald" font-weight="600" font-size="38" letter-spacing="3" fill="${INK}">${title}</text>
<line x1="${x0}" y1="${n(Y(lo))}" x2="${x0 + span}" y2="${n(Y(lo))}" stroke="#d6cdbd" stroke-width="3" stroke-dasharray="8 8"/>
<path d="${path}" fill="none" stroke="#c0392b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="${n(tip.x)}" cy="${n(tip.y)}" r="11" fill="${p > 0.999 ? "#C6F432" : "#c0392b"}" stroke="${INK}" stroke-width="4"/>
${labels}<text x="${px + 30}" y="1010" font-family="${mono}" font-weight="500" font-size="17" fill="#8d8a84">Sumber: ${src}</text></g>`;
      };
      window.__timelines["kalau"] = F1.scene("kalau", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const lambat = w("lambat");
        const juni = w("Juni");
        const arg = w("Argentina");
        const tapi = w("Tapi");
        const bangkit = w("bangkit");
        const rekor = w("rekor");
        const delapan = w("delapan");
        const covid = w("COVID");
        const jaminan = w("jaminan");
        const aA = 1 - F1.ramp(f, tapi - 4, 8);
        const flip = f >= juni ? F1.ramp(f, juni, 10) : 0;
        const argP = F1.ramp(f, arg, 12, F1.expoOut);
        const h1 = F1.ramp(f, bangkit, 10, F1.expoOut);
        const h2 = F1.ramp(f, delapan, 10, F1.expoOut);
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#eadcc4"/>
<g style="filter:blur(3px)"><rect x="80" y="300" width="260" height="300" fill="#f7e3b0"/><path d="M80 300 h260 v300 h-260 Z M210 300 v300 M80 450 h260" stroke="#8a6f55" stroke-width="14" fill="none"/></g>
${W.dust(f, { x: 120, y: 480, w: 800, h: 640, count: 18, seed: 12, color: "#fff3cf", alpha: 0.5 })}
<rect x="0" y="1128" width="1080" height="792" fill="#cdb391"/><rect x="0" y="1118" width="1080" height="12" fill="#a8906f"/>
${CAL(f, { flip, juni, alpha: aA })}${ARG(argP, aA)}
${HIST(f, { px: 70, alpha: h1, title: "KRISIS 2008", lo: 1111, hi: 2844, p: F1.ramp(f, rekor, 70, F1.easeOut), src: "detik", pts: [{ fx: 0, v: 2830, big: "2.830", small: "9 JAN 2008", kind: "peak" }, { fx: 0.36, v: 1111, big: "1.111", small: "28 OKT 2008", kind: "low" }, { fx: 1, v: 2844, big: "REKOR 2.844", small: "5 APR 2010", kind: "rec", bw: 150 }] })}
${HIST(f, { px: 520, alpha: h2, title: "COVID 2020", lo: 3937, hi: 6723.39, p: F1.ramp(f, covid, 66, F1.easeOut), src: "IDX Channel", pts: [{ fx: 0, v: 6300, big: "±6.300", small: "SEBELUM COVID", kind: "peak" }, { fx: 0.25, v: 3937, big: "3.937", small: "24 MAR 2020", kind: "low" }, { fx: 1, v: 6723.39, big: "REKOR 6.723,39", small: "22 NOV 2021", kind: "rec", bw: 196 }] })}</svg>`;
        const hud =
          f >= jaminan
            ? C.hud(f, { at: jaminan, kicker: "BUKAN SARAN INVESTASI", big: "SEJARAH", sub: "BUKAN JAMINAN MASA DEPAN", w: 520 })
            : f >= tapi
              ? C.hud(f, { at: tapi, kicker: "SEJARAH IHSG", big: "REKOR BARU", sub: "SETELAH KRISIS 2008 & COVID", src: "detik, IDX Channel", w: 520, bigSize: 60 })
              : f >= arg
                ? C.hud(f, { at: arg, kicker: "CONTOH KASUS", big: "ARGENTINA", sub: "STANDALONE · EFEKTIF NOV 2021", src: "CNBC Africa (Jun 2021)", w: 560, bigSize: 64 })
                : f >= juni
                  ? C.hud(f, { at: juni, kicker: "KEPUTUSAN MSCI", big: "30 JUN 2027", sub: "PALING LAMBAT", src: "MSCI (15 Okt 2026)", w: 540, bigSize: 62 })
                  : C.hud(f, { at: 4, kicker: "SKENARIO", big: "KALAU…?", sub: "BARU USULAN MSCI, BELUM FINAL" });
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.04,
            shots: [
              { at: 0, scale: 1.04, ox: 50, oy: 25 },
              { at: arg, scale: 1.03, ox: 50, oy: 30, ease: 12 },
              { at: tapi, scale: 1, ox: 50, oy: 25, ease: 12 },
              { at: rekor, scale: 1.06, ox: 25, oy: 25, ease: 14 },
              { at: covid, scale: 1.06, ox: 75, oy: 25, ease: 14 },
              { at: w("Masa"), scale: 1.02, ox: 50, oy: 25, ease: 12 },
            ],
          }),
          C.vignette(0.3, "50% 50%", 55),
          f < tapi ? C.tag(f, { at: lambat, x: 700, y: 795, rot: 5, light: true, size: 34, text: `<span style="color:#c0392b">PALING LAMBAT</span>` }) : "",
          C.stamp(f, { at: jaminan, x: 120, y: 1085, rot: -3, text: "MASA LALU BUKAN JAMINAN", size: 42 }),
          C.progress(f, { step: 5, label: "SKENARIO" }),
          hud,
          C.cast(S, f, [
            { src: C.CAST.beniKaget, x: 540, y: 1200, w: 400, at: 0 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
