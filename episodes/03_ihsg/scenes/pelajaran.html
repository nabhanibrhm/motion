<div style="${mono};font-weight:500;font-size:26px;letter-spacing:2px;color:#6f6a66">KASUS #03 · IHSG</div>
<div style="${F1.css({ textAlign: "center", opacity: n(rev, 3), transform: `translateY(${n(24 * (1 - rev))}px)` })}"><div style="font-family:Oswald,sans-serif;font-weight:600;font-size:40px;letter-spacing:2px;color:#2a2a2e">REVIEW MSCI BERIKUTNYA: <span style="color:#c0392b">11 NOV 2026</span></div><div style="${mono};font-weight:500;font-size:19px;color:#8d8a84;margin-top:6px">Sumber: Antara (Agu 2026)</div></div>

            { src: C.CAST.muklisSenyum, x: 540, y: 1200, w: 380, at: 0 },
