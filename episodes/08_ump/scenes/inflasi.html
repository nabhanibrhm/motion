<!-- Inflasi: Muklis says "Inflasi" and the HUD "INFLASI SEP 2026 · 3,28% YOY" (BPS via Kontan, U4) opens over the +Rp280 RB coin stack carried over from the simulation. On Nisa's "Belanjaan" a shopping basket "Rp3,50 JT · SETAHUN LALU" appears (a basket worth the average UMP, simulation), swells on "sekarang" to "Rp3,62 JT · SEKARANG", and the tag "+Rp115 RB" pops on "ribu". On "kepotong" a slice labelled "−Rp115 RB" is cut off the coin stack and the TERPOTONG stamp slams down. Muklis, Nisa. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #efe6d4;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="inflasi" data-width="1080" data-height="1920">
    <div id="inflasi-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="inflasi-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="0.5" id="inflasi-sfx-1" class="clip" src="public/sfx/pop-in.wav" data-at="word:Inflasi" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="3" id="inflasi-sfx-2" class="clip" src="public/sfx/pop-in.wav" data-at="word:Belanjaan" data-track-index="13" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="5" id="inflasi-sfx-3" class="clip" src="public/sfx/ding-num.wav" data-at="word:sekarang" data-track-index="14" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="6" id="inflasi-sfx-4" class="clip" src="public/sfx/pop.wav" data-at="word:ribu" data-track-index="15" data-volume="0.12"></audio>
    <audio data-hf-media-start-basis="local" data-start="8" id="inflasi-sfx-5" class="clip" src="public/sfx/swoosh-soft.wav" data-at="word:kepotong" data-track-index="16" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="8" id="inflasi-sfx-6" class="clip" src="public/sfx/stamp.wav" data-at="word:kepotong+8" data-track-index="17" data-volume="0.35"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const INK = "#2a2a2e";
      const mono = "JetBrains Mono";
      // the basket: woven body, handle, a few groceries; drawn around (0,0), body about 380 wide
      const BASKET = () => {
        const rows = [-70, -20, 30, 80].map((y) => `<path d="M${n(-170 + (y + 90) * 0.18)} ${y} H${n(170 - (y + 90) * 0.18)}" stroke="#8a5a2b" stroke-width="5" opacity="0.7"/>`).join("");
        const cols = [-110, -55, 0, 55, 110].map((x) => `<path d="M${x} -100 L${n(x * 0.8)} 100" stroke="#8a5a2b" stroke-width="5" opacity="0.5"/>`).join("");
        const goods = `<g stroke="${INK}" stroke-width="5" stroke-linejoin="round"><rect x="-120" y="-170" width="70" height="90" rx="10" fill="#f0c14b"/><circle cx="10" cy="-125" r="42" fill="#d0413a"/><rect x="60" y="-185" width="64" height="105" rx="12" fill="#6fae6a"/></g>`;
        return `<path d="M-120 -100 Q-120 -230 0 -230 Q120 -230 120 -100" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round"/>${goods}<path d="M-190 -100 H190 L150 100 Q146 120 126 120 H-126 Q-146 120 -150 100 Z" fill="#c68a4a" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>${cols}${rows}<rect x="-200" y="-116" width="400" height="32" rx="14" fill="#b57a3a" stroke="${INK}" stroke-width="8"/>`;
      };
      // a coin lying in the stack, centre (cx, y)
      const COIN = (cx, y, fill = "#f2c14e") => `<path d="M${cx - 110} ${y} v26 a110 30 0 0 0 220 0 v-26" fill="#d9a21f" stroke="${INK}" stroke-width="6"/><ellipse cx="${cx}" cy="${y}" rx="110" ry="30" fill="${fill}" stroke="${INK}" stroke-width="6"/><ellipse cx="${cx}" cy="${y}" rx="78" ry="19" fill="none" stroke="#c48f14" stroke-width="4"/>`;
      window.__timelines["inflasi"] = F1.scene("inflasi", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const inflasi = w("Inflasi");
        const belanjaan = w("Belanjaan");
        const sekarang = w("sekarang");
        const ribu = w("ribu");
        const potong = w("kepotong");
        const pCoin = F1.ramp(f, 6, 14, F1.expoOut);
        const pBasket = F1.ramp(f, belanjaan - 4, 14, F1.expoOut);
        const swell = F1.ramp(f, sekarang - 2, 18, F1.backOut);
        const tag = F1.ramp(f, ribu, 10, F1.backOut);
        const cut = F1.ramp(f, potong, 18, F1.expoOut);
        const sc = n(1 + 0.16 * swell, 3);
        const BX = 540;
        const BY = 880;
        // coin stack: 7 coins; the top 3 (about 41%, 115 of 280) are the slice that gets cut off
        const SX = 210;
        const base = 1393;
        const topY = 1160;
        const sliceMove = `${n(260 * cut)} ${n(-70 * cut + 120 * cut * cut)}`;
        const coins = Array.from({ length: 7 }, (_, i) => {
          const y = base - i * 28;
          const drop = F1.ramp(f, 8 + i * 2, 10, F1.backOut);
          if (drop <= 0) return "";
          const lift = n((1 - drop) * -40);
          if (i < 4) return `<g transform="translate(0 ${lift})" opacity="${n(Math.min(1, drop * 2), 3)}">${COIN(SX, y)}</g>`;
          return `<g transform="translate(${sliceMove}) translate(0 ${lift}) rotate(${n(14 * cut, 2)} ${SX} ${y})" opacity="${n(Math.min(1, drop * 2) * (1 - 0.35 * cut), 3)}">${COIN(SX, y, "#f6d57a")}</g>`;
        }).join("");
        const sliceLabel = cut > 0 ? `<g opacity="${n(cut, 3)}" transform="translate(${sliceMove})"><text x="${SX}" y="${topY}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="46" fill="#c0392b" stroke="#efe6d4" stroke-width="8" paint-order="stroke">−Rp115 RB</text></g>` : "";
        const coinLabel = `<g opacity="${n(pCoin, 3)}"><text x="${SX}" y="${topY}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="58" fill="${INK}" opacity="${n(1 - cut, 3)}">+Rp280 RB</text><text x="${SX}" y="1188" text-anchor="middle" font-family="${mono}" font-weight="700" font-size="20" letter-spacing="1" fill="#6b5f52">KENAIKAN SIMULASI +8%</text></g>`;
        const basketLabelText = f < sekarang ? "Rp3,50 JT" : "Rp3,62 JT";
        const basketCaption = f < sekarang ? "SETAHUN LALU" : "SEKARANG";
        const basket =
          pBasket <= 0
            ? ""
            : `<g opacity="${n(pBasket, 3)}" transform="translate(0 ${n(40 * (1 - pBasket))})">
<rect x="${BX - 230}" y="462" width="460" height="132" rx="22" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<text x="${BX}" y="532" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="70" fill="${f < sekarang ? INK : "#c0392b"}">${basketLabelText}</text>
<text x="${BX}" y="575" text-anchor="middle" font-family="${mono}" font-weight="700" font-size="22" letter-spacing="3" fill="#6b5f52">${basketCaption}</text>
<g transform="translate(${BX} ${BY}) scale(${sc})">${BASKET()}</g>
<text x="${BX + 250}" y="${n(BY + 130 + 70 * swell)}" text-anchor="end" font-family="${mono}" font-weight="500" font-size="19" fill="#6f6a66">simulasi: keranjang senilai rata-rata UMP</text>
<text x="${BX + 250}" y="${n(BY + 158 + 70 * swell)}" text-anchor="end" font-family="${mono}" font-weight="500" font-size="17" fill="#6f6a66">Inflasi 3,28% (BPS via Kontan); Rp3.503.220 × 1,0328</text></g>`;
        const tagSvg =
          tag <= 0
            ? ""
            : `<g transform="translate(${BX + 215} ${BY - 150}) rotate(-8) scale(${n(0.5 + 0.5 * tag, 3)})" opacity="${n(Math.min(1, tag * 2), 3)}"><rect x="-100" y="-42" width="200" height="84" rx="14" fill="#111"/><text x="0" y="16" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="48" fill="#ff7a6e">+Rp115 RB</text></g>`;
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="inflasi-glow" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff4da"/><stop offset="1" stop-color="#ead9bb"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#inflasi-glow)"/>
<rect x="0" y="1200" width="1080" height="720" fill="#c9ae84"/>
${F1.world.dust(f, { x: 100, y: 500, w: 840, h: 620, count: 16, seed: 21, color: "#fff3cf", alpha: 0.45 })}
${basket}${tagSvg}${coins}${sliceLabel}${coinLabel}
</svg>`;
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.03,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 58 },
              { at: belanjaan - 6, scale: 1.04, ox: 50, oy: 52, ease: 14 },
              { at: potong - 6, scale: 1.05, ox: 40, oy: 66, ease: 14 },
            ],
          }),
          C.vignette(0.2, "50% 55%", 55),
          C.progress(f, { step: 4, label: "TERSANGKA · HARGA" }),
          f < belanjaan ? `<div style="opacity:${n(1 - F1.ramp(f, belanjaan - 8, 8), 3)}">${C.hud(f, { at: inflasi, kicker: "TERSANGKA", big: "INFLASI", sub: "SEP 2026 · 3,28% YOY", src: "BPS via Kontan", bigSize: 56, w: 540 })}</div>` : "",
          C.stamp(f, { at: potong + 8, x: 90, y: 1335, rot: -8, text: "TERPOTONG", size: 46 }),
          C.cast(S, f, [
            { src: C.CAST.muklis, x: 860, y: 1200, w: 340, at: 0 },
            { src: C.CAST.nisa, x: 860, y: 1200, w: 340 },
          ]),
        );
      });
    })();
  </script>
</template>
