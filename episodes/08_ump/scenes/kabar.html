<!-- Kabar: a November 2026 calendar page with "UMP 2027: BELUM DIPUTUSKAN" (on "diputuskan") and the target tag TARGET: PALING LAMBAT AKHIR NOVEMBER (day 30 circled on "paling"; Kemnaker via Kontan, 14 Okt 2026). On Muklis's line a range bar USULAN SERIKAT BURUH 7,5%-9,5% slides in (KSPI/Partai Buruh via CNBC Indonesia, 21 Okt 2026); on Beni's "Rumusnya" a formula card builds INFLASI + PERTUMBUHAN EKONOMI + INDEKS ALFA (Kemnaker via Kontan), and the GUBERNUR MENETAPKAN stamp slams on "gubernur" (Menaker via CNBC Indonesia). Nisa, Muklis, Beni, Nisa. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #efe3c8;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="kabar" data-width="1080" data-height="1920">
    <div id="kabar-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="kabar-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="kabar-sfx-diputuskan" class="clip" src="public/sfx/pop-in.wav" data-at="word:diputuskan" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="kabar-sfx-paling" class="clip" src="public/sfx/tick.wav" data-at="word:paling" data-track-index="13" data-volume="0.12"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="kabar-sfx-serikat" class="clip" src="public/sfx/whoosh.wav" data-at="word:Serikat" data-track-index="14" data-volume="0.1"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="kabar-sfx-rumusnya" class="clip" src="public/sfx/pop.wav" data-at="word:Rumusnya" data-track-index="15" data-volume="0.1"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="kabar-sfx-alfa" class="clip" src="public/sfx/ding.wav" data-at="word:alfa" data-track-index="16" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="kabar-sfx-gubernur" class="clip" src="public/sfx/stamp.wav" data-at="word:gubernur" data-track-index="17" data-volume="0.35"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const INK = "#2a2a2e";
      const RED = "#c0392b";
      const BLUE = "#1f6d86";
      const mono = "JetBrains Mono";
      window.__timelines["kabar"] = F1.scene("kabar", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const diputuskan = w("diputuskan");
        const paling = w("paling");
        const serikat = w("Serikat");
        const rumusnya = w("Rumusnya");
        const inflasi = w("inflasi");
        const pertumbuhan = w("pertumbuhan");
        const alfa = w("alfa");
        const gubernur = w("gubernur");

        // ---- calendar page: November 2026 starts on a Sunday, 30 days, weeks run Sen..Min ----
        const cal = Math.min(1, F1.ramp(f, 2, 14, F1.backOut));
        const CX = 90, CY = 250, CW = 900;
        const cellW = 100, gx = CX + 100, gy = CY + 128;
        const heads = ["SEN", "SEL", "RAB", "KAM", "JUM", "SAB", "MIN"];
        let grid = "";
        heads.forEach((h, i) => {
          grid += `<text x="${gx + i * cellW + cellW / 2}" y="${gy - 10}" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="22" letter-spacing="2" fill="${i >= 5 ? RED : "#6f6a66"}">${h}</text>`;
        });
        for (let d = 1; d <= 30; d++) {
          const idx = d + 5; // Sunday (d=1) lands in column 6 of week 0
          const col = idx % 7, row = Math.floor(idx / 7);
          const cx = gx + col * cellW + cellW / 2, cy = gy + 24 + row * 46;
          grid += `<text x="${cx}" y="${cy}" text-anchor="middle" font-family="${mono}" font-weight="${d === 30 ? 700 : 500}" font-size="26" fill="${col >= 5 ? RED : INK}">${d}</text>`;
        }
        // the deadline: day 30 gets circled on "paling"
        const circ = F1.ramp(f, paling, 14, F1.backOut);
        const i30 = 35, c30 = i30 % 7, r30 = Math.floor(i30 / 7);
        const ccx = gx + c30 * cellW + cellW / 2, ccy = gy + 24 + r30 * 46 - 9;
        const CIRCLE = circ <= 0 ? "" : `<ellipse cx="${n(ccx)}" cy="${n(ccy)}" rx="${n(34 * circ)}" ry="${n(26 * circ)}" fill="none" stroke="${RED}" stroke-width="6" opacity="${n(Math.min(1, circ), 3)}" transform="rotate(-6 ${n(ccx)} ${n(ccy)})"/>`;
        const pend = F1.ramp(f, diputuskan, 10, F1.easeOut);
        const CAL = `<g opacity="${n(cal, 3)}" transform="translate(0 ${n((1 - cal) * 40)})">
<rect x="${CX + 8}" y="${CY + 10}" width="${CW}" height="500" rx="22" fill="#000" opacity="0.14"/>
<rect x="${CX}" y="${CY}" width="${CW}" height="500" rx="22" fill="#fbf6ea" stroke="${INK}" stroke-width="5"/>
<path d="M${CX} ${CY + 90} v-68 a22 22 0 0 1 22 -22 h${CW - 44} a22 22 0 0 1 22 22 v68 z" fill="${RED}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
<text x="${CX + CW / 2}" y="${CY + 62}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="46" letter-spacing="6" fill="#fff">NOVEMBER 2026</text>
${grid}${CIRCLE}
<g opacity="${n(pend, 3)}"><rect x="${CX + 40}" y="${CY + 424}" width="${CW - 80}" height="58" rx="12" fill="#f3e3b0" stroke="${INK}" stroke-width="4"/>
<text x="${CX + CW / 2}" y="${CY + 464}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="36" letter-spacing="2" fill="${INK}">UMP 2027: <tspan fill="${RED}">BELUM DIPUTUSKAN</tspan></text></g>
</g>
<text x="${CX}" y="${CY + 538}" opacity="${n(pend, 3)}" font-family="${mono}" font-weight="500" font-size="17" fill="#6f6a66">Sumber: Kemnaker via Kontan (14 Okt 2026)</text>`;

        // ---- range bar: union proposal 7,5%-9,5% on a 6%..11% scale ----
        const rb = Math.min(1, F1.ramp(f, serikat, 14, F1.expoOut));
        const BX = 110, BW = 760, BY = 855;
        const sx = (v) => BX + ((v - 6) / 5) * BW;
        const fill = F1.ramp(f, serikat + 6, 26, F1.easeOut);
        let ticks = "";
        [6, 7, 8, 9, 10, 11].forEach((v) => {
          ticks += `<line x1="${sx(v)}" y1="${BY + 60}" x2="${sx(v)}" y2="${BY + 70}" stroke="${INK}" stroke-width="3"/><text x="${sx(v)}" y="${BY + 94}" text-anchor="middle" font-family="${mono}" font-weight="500" font-size="20" fill="#6f6a66">${v}%</text>`;
        });
        const RANGE = rb <= 0 ? "" : `<g opacity="${n(rb, 3)}" transform="translate(${n((1 - rb) * 80)} 0)">
<text x="${BX}" y="${BY}" font-family="Oswald" font-weight="700" font-size="34" letter-spacing="2" fill="${INK}">USULAN SERIKAT BURUH <tspan fill="${BLUE}">7,5%–9,5%</tspan></text>
<rect x="${BX}" y="${BY + 20}" width="${BW}" height="36" rx="18" fill="#e4d6b4" stroke="${INK}" stroke-width="4"/>
<rect x="${n(sx(7.5))}" y="${BY + 20}" width="${n((sx(9.5) - sx(7.5)) * fill)}" height="36" rx="18" fill="${BLUE}" stroke="${INK}" stroke-width="4"/>
${ticks}
<text x="${BX}" y="${BY + 124}" font-family="${mono}" font-weight="500" font-size="17" fill="#6f6a66">Sumber: KSPI/Partai Buruh via CNBC Indonesia (21 Okt 2026)</text>
</g>`;

        // ---- formula card: three terms build up while Nisa names them ----
        const FY = 995;
        const fc = Math.min(1, F1.ramp(f, rumusnya, 12, F1.backOut));
        const t1 = F1.ramp(f, inflasi, 8, F1.backOut);
        const t2 = F1.ramp(f, pertumbuhan, 8, F1.backOut);
        const t3 = F1.ramp(f, alfa, 8, F1.backOut);
        const term = (x, y, w2, p, label, color) =>
          p <= 0 ? "" : `<g opacity="${n(Math.min(1, p), 3)}" transform="translate(${n(x + w2 / 2)} ${n(y + 30)}) scale(${n(0.7 + 0.3 * Math.min(1.1, p), 3)}) translate(${n(-(x + w2 / 2))} ${n(-(y + 30))})"><rect x="${x}" y="${y}" width="${w2}" height="60" rx="12" fill="${color}" stroke="${INK}" stroke-width="4"/><text x="${x + w2 / 2}" y="${y + 40}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="23" letter-spacing="0.5" fill="#fff">${label}</text></g>`;
        const plus = (x, y, p) => (p <= 0 ? "" : `<text x="${x}" y="${y + 44}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="40" fill="${INK}" opacity="${n(Math.min(1, p), 3)}">+</text>`);
        const FORM = fc <= 0 ? "" : `<g opacity="${n(fc, 3)}" transform="translate(0 ${n((1 - fc) * 40)})">
<rect x="${BX - 20}" y="${FY}" width="${BW + 40}" height="150" rx="18" fill="#fbf6ea" stroke="${INK}" stroke-width="5"/>
<text x="${BX}" y="${FY + 36}" font-family="Oswald" font-weight="600" font-size="22" letter-spacing="3" fill="#6f6a66">RUMUS UMP</text>
<text x="${BX + BW}" y="${FY + 36}" text-anchor="end" font-family="${mono}" font-weight="500" font-size="15" fill="#6f6a66">Sumber: Kemnaker via Kontan · gubernur: CNBC Indonesia</text>
${term(BX, FY + 56, 130, t1, "INFLASI", RED)}${plus(BX + 152, FY + 56, t2)}${term(BX + 174, FY + 56, 310, t2, "PERTUMBUHAN EKONOMI", "#3f78b5")}${plus(BX + 506, FY + 56, t3)}${term(BX + 528, FY + 56, 220, t3, "INDEKS ALFA", "#5fae7a")}
</g>`;

        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="kabar-glow" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#fff4da"/><stop offset="1" stop-color="#ecdcba"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#kabar-glow)"/>
<rect x="0" y="1290" width="1080" height="630" fill="#cdb48a"/><rect x="0" y="1290" width="1080" height="12" fill="#a8906f"/>
${CAL}
${RANGE}
${FORM}</svg>`;
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.03,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 40 },
              { at: serikat - 6, scale: 1.03, ox: 50, oy: 50, ease: 14 },
              { at: rumusnya - 6, scale: 1.03, ox: 50, oy: 58, ease: 14 },
            ],
          }),
          C.vignette(0.2, "50% 55%", 55),
          f >= paling && f < serikat ? `<div style="opacity:${n(1 - F1.ramp(f, serikat - 10, 8), 3)}">${C.tag(f, { at: paling, x: 200, y: 800, rot: -2, light: true, size: 32, text: `TARGET: <span style="color:#c0392b">PALING LAMBAT AKHIR NOVEMBER</span>` })}</div>` : "",
          f >= gubernur ? C.stamp(f, { at: gubernur, x: 270, y: 1156, rot: -6, text: "GUBERNUR MENETAPKAN", size: 40 }) : "",
          C.progress(f, { step: 2, label: "BUKTI 1 · KABAR UMP" }),
          C.cast(S, f, [
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
            { src: C.CAST.beni, x: 540, y: 1200, w: 380 },
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
