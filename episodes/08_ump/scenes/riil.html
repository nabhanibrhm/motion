<!-- Riil: equation card "GAJI RIIL ≈ KENAIKAN GAJI − INFLASI" builds on "riil" / "dikurangi"; a second card "8% − 3,28% ≈ 4,7%" (SIMULASI, perkiraan sederhana) drops in on "delapan" and the 4,7 counts up on "empat koma tujuh". On Muklis' line the cards leave and two columns rise: INFLASI UMUM +3,28% (BPS via Kontan, U4) vs MAKANAN, MINUMAN & TEMBAKAU +4,37% (BPS via Databoks, U5; taller), Sep 2026; the MAKANAN LEBIH CEPAT stamp slams on "cepat". Nisa, Muklis. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #ead9bb;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="riil" data-width="1080" data-height="1920">
    <div id="riil-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="riil-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="20" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="riil-sfx-riil" class="clip" src="public/sfx/pop-in.wav" data-at="word:riil" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="riil-sfx-kurang" class="clip" src="public/sfx/tick.wav" data-at="word:dikurangi" data-track-index="13" data-volume="0.12"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="riil-sfx-delapan" class="clip" src="public/sfx/pop-in.wav" data-at="word:delapan" data-track-index="14" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="riil-sfx-hasil" class="clip" src="public/sfx/ding-num.wav" data-at="word:tujuh" data-track-index="15" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="riil-sfx-makanan" class="clip" src="public/sfx/pop-in.wav" data-at="word:makanan" data-track-index="16" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="riil-sfx-cepat" class="clip" src="public/sfx/stamp.wav" data-at="word:cepat" data-track-index="17" data-volume="0.35"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const INK = "#2a2a2e";
      const fmt = (v, d = 2) => v.toFixed(d).replace(".", ",");
      const CARD = (p, y, h, inner) => `<g opacity="${n(p, 3)}" transform="translate(0 ${n(50 * (1 - p))})"><rect x="70" y="${y}" width="870" height="${h}" rx="24" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>${inner}</g>`;
      const BASE = 1000;
      const COLH = 420;
      // one vertical column with its value above and label below
      const COL = (x, p, frac, fill, value, valColor, l1, l2) => {
        const h = COLH * frac * p;
        return `<rect x="${x - 8}" y="${BASE - COLH - 70}" width="276" height="${COLH + 70 + 8}" rx="18" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<rect x="${x}" y="${n(BASE - h)}" width="260" height="${n(h)}" rx="10" fill="${fill}"/>
<text x="${x + 130}" y="${n(BASE - h - 14)}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="64" fill="${valColor}" opacity="${n(Math.min(1, p * 4), 3)}">${value}</text>
<text x="${x + 130}" y="${BASE + 44}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="1" fill="#6b5f52" opacity="${n(Math.min(1, p * 3), 3)}">${l1}</text>
<text x="${x + 130}" y="${BASE + 72}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="1" fill="#6b5f52" opacity="${n(Math.min(1, p * 3), 3)}">${l2}</text>`;
      };
      window.__timelines["riil"] = F1.scene("riil", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const riil = w("riil");
        const kurang = w("dikurangi");
        const delapan = w("delapan");
        const empat = w("empat");
        const tujuh = w("tujuh");
        const padahal = w("Padahal");
        const harga1 = w("harga", 1);
        const makanan = w("makanan");
        const cepat = w("cepat");
        const empat1 = w("empat", 1);
        const gone = F1.ramp(f, padahal - 2, 12, F1.easeOut);
        const cA = F1.ramp(f, riil - 2, 12, F1.expoOut);
        const kA = F1.ramp(f, kurang - 2, 10, F1.expoOut);
        const cB = F1.ramp(f, delapan - 4, 12, F1.expoOut);
        const cnt = F1.ramp(f, empat, tujuh - empat + 6, F1.easeOut);
        const aI = F1.ramp(f, harga1, makanan - harga1 + 4, F1.easeOut);
        const aF = F1.ramp(f, makanan, empat1 - makanan + 8, F1.easeOut);
        const eq = `<text x="110" y="560" font-family="Oswald" font-weight="700" font-size="84" fill="${INK}">GAJI RIIL</text>
<text x="110" y="660" font-family="Oswald" font-weight="600" font-size="52" letter-spacing="1" fill="#2e7d3a" opacity="${n(cA, 3)}">≈ KENAIKAN GAJI</text>
<text x="110" y="740" font-family="Oswald" font-weight="600" font-size="52" letter-spacing="1" fill="#c0392b" opacity="${n(kA, 3)}" transform="translate(${n(40 * (1 - kA))} 0)">− INFLASI</text>`;
        const cardA = CARD(cA * (1 - gone), 480, 300, eq);
        const calc = `<text x="110" y="910" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="3" fill="#6b5f52">SIMULASI · UMP RATA-RATA</text>
<text x="110" y="1010" font-family="Oswald" font-weight="700" font-size="64" fill="${INK}">8% − 3,28% ≈ </text>
<text x="590" y="1010" font-family="Oswald" font-weight="700" font-size="84" fill="#2e7d3a">${fmt(4.7 * cnt, 1)}%</text>
<text x="110" y="1066" font-family="JetBrains Mono" font-weight="500" font-size="22" fill="#6b5f52">perkiraan sederhana · simulasi</text>
<text x="110" y="1104" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="#6f6a66">Sumber: BPS via Kontan (inflasi Sep 2026)</text>`;
        const cardB = CARD(cB * (1 - gone), 850, 290, calc);
        const cols = `<g opacity="${n(Math.min(1, aI * 3), 3)}">
${COL(170, aI, 3.28 / 4.37, "#e8a33d", `+${fmt(3.28 * aI)}%`, INK, "INFLASI UMUM", "SEP 2026")}
${COL(560, aF, 1, "#d0413a", `+${fmt(4.37 * aF)}%`, "#fff", "MAKANAN, MINUMAN", "&amp; TEMBAKAU")}
<text x="170" y="1128" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="#6f6a66">Sumber: BPS via Kontan (U4) · BPS via Databoks (U5), Sep 2026</text></g>`;
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="riil-glow" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff1d4"/><stop offset="1" stop-color="#ead9bb"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#riil-glow)"/>
<rect x="0" y="1160" width="1080" height="760" fill="#c9ae84"/>
${F1.world.dust(f, { x: 100, y: 500, w: 840, h: 620, count: 16, seed: 21, color: "#fff3cf", alpha: 0.45 })}
<g transform="translate(0 50)">${cardA}${cardB}</g>${gone > 0 ? cols : ""}</svg>`;
        const hud =
          f >= makanan
            ? C.hud(f, { at: makanan, kicker: "MAKANAN, MINUMAN & TEMBAKAU", big: "+4,37%", sub: "TAHUNAN · SEP 2026", src: "BPS via Databoks", bigSize: 64 })
            : f >= delapan
              ? C.hud(f, { at: delapan, kicker: "KENAIKAN RIIL · SIMULASI", big: "≈ 4,7%", sub: "8% − 3,28% · PERKIRAAN SEDERHANA", src: "BPS via Kontan", bigSize: 64, w: 540 })
              : C.hud(f, { at: 4, kicker: "GAJI RIIL", big: "GAJI − HARGA", sub: "KENAIKAN GAJI DIKURANGI INFLASI", src: "", bigSize: 52, w: 540 });
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.03,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 56 },
              { at: delapan - 6, scale: 1.04, ox: 50, oy: 60, ease: 14 },
              { at: padahal - 6, scale: 1.03, ox: 50, oy: 52, ease: 14 },
            ],
          }),
          C.vignette(0.2, "50% 55%", 55),
          f >= cepat ? C.stamp(f, { at: cepat, x: 520, y: 1180, rot: -7, text: "MAKANAN LEBIH CEPAT", size: 48 }) : "",
          C.progress(f, { step: 5, label: "BUKTI 3 · GAJI RIIL" }),
          hud,
          C.cast(S, f, [
            { src: C.CAST.nisa, x: 540, y: 1200, w: 420, at: 0 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
