<!-- Hitung: a payslip card on a paper desk. On "Rata-rata" the card appears with RATA-RATA UMP 2026 Rp3.503.220 (Investortrust's average of provincial decrees, Des 2025); on "delapan" the SIMULASI +8% tag lands with the small print SIMULASI, BUKAN KEPUTUSAN; from "tambahnya" to "ribu" the +Rp280.258 line and the total count up to Rp3.783.478 and a coin stack labelled +Rp280 RB pops in (the next scene slices it). Beni grins on "Lumayan" with a cash sound. Nisa, Beni. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #ead9bb;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="hitung" data-width="1080" data-height="1920">
    <div id="hitung-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="hitung-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="20" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="hitung-sfx-card" class="clip" src="public/sfx/pop-in.wav" data-at="word:Rata-rata" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="hitung-sfx-sim" class="clip" src="public/sfx/stamp.wav" data-at="word:delapan" data-track-index="13" data-volume="0.3"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="hitung-sfx-count" class="clip" src="public/sfx/tick.wav" data-at="word:tambahnya" data-track-index="14" data-volume="0.08"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="hitung-sfx-ribu" class="clip" src="public/sfx/ding-num.wav" data-at="word:ribu" data-track-index="15" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="hitung-sfx-coin" class="clip" src="public/sfx/pop.wav" data-at="word:ribu" data-track-index="16" data-volume="0.1"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="hitung-sfx-cash" class="clip" src="public/sfx/cash.wav" data-at="word:Lumayan" data-track-index="17" data-volume="0.2"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const INK = "#2a2a2e";
      // 3503220 -> "Rp3.503.220"
      const rp = (v) => "Rp" + Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const BASE = 3503220;
      const RAISE = 280258;
      const COINS = 7;
      const coinStack = (f, t0, cx, base) => {
        let s = "";
        for (let i = 0; i < COINS; i++) {
          const p = F1.ramp(f, t0 + i * 2, 8, F1.backOut);
          if (p <= 0) continue;
          const y = base - i * 22 - (1 - p) * 60;
          const dx = i % 2 ? 4 : -4;
          const x = cx + dx;
          s += `<g opacity="${n(Math.min(1, p * 2), 3)}"><ellipse cx="${n(x)}" cy="${n(y + 14)}" rx="78" ry="22" fill="#a97c18" stroke="${INK}" stroke-width="5"/><rect x="${n(x - 78)}" y="${n(y - 8)}" width="156" height="22" fill="#d9a521"/><path d="M${n(x - 78)} ${n(y + 14)} A78 22 0 0 0 ${n(x + 78)} ${n(y + 14)}" fill="#d9a521" stroke="${INK}" stroke-width="5"/><ellipse cx="${n(x)}" cy="${n(y - 8)}" rx="78" ry="22" fill="#f2c94c" stroke="${INK}" stroke-width="5"/><ellipse cx="${n(x)}" cy="${n(y - 8)}" rx="50" ry="13" fill="none" stroke="#b9871a" stroke-width="3"/></g>`;
        }
        return s;
      };
      window.__timelines["hitung"] = F1.scene("hitung", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const rata = w("Rata-rata");
        const delapan = w("delapan");
        const tambahnya = w("tambahnya");
        const ribu = w("ribu");
        const card = F1.ramp(f, rata - 2, 12, F1.expoOut);
        const sim = F1.ramp(f, delapan, 10, F1.expoOut);
        const small = F1.ramp(f, delapan + 6, 10, F1.expoOut);
        const cnt = F1.ramp(f, tambahnya, Math.max(6, ribu - tambahnya), F1.easeOut);
        const lineA = F1.ramp(f, tambahnya - 4, 10, F1.expoOut);
        const raise = RAISE * cnt;
        const total = BASE + raise;
        const pulse = 1 + 0.04 * Math.sin(Math.PI * F1.ramp(f, ribu + 6, 10)) * (1 - F1.ramp(f, ribu + 16, 4));
        const lab = F1.ramp(f, ribu, 10, F1.expoOut);
        const slip = `<g opacity="${n(card, 3)}" transform="translate(0 ${n(50 * (1 - card))})">
<rect x="70" y="480" width="870" height="660" rx="26" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<text x="110" y="548" font-family="JetBrains Mono" font-weight="700" font-size="24" letter-spacing="3" fill="#6b5f52">SLIP GAJI · CONTOH</text>
<text x="110" y="604" font-family="Oswald" font-weight="600" font-size="46" letter-spacing="3" fill="${INK}">RATA-RATA UMP 2026</text>
<text x="110" y="696" font-family="JetBrains Mono" font-weight="700" font-size="72" fill="${INK}">${rp(BASE)}</text>
<g opacity="${n(sim, 3)}" transform="translate(0 ${n(14 * (1 - sim))})">
<rect x="110" y="730" width="330" height="62" rx="12" fill="#c0392b" stroke="${INK}" stroke-width="5" transform="rotate(-2 275 761)"/>
<text x="275" y="775" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="40" letter-spacing="3" fill="#fff" transform="rotate(-2 275 761)">SIMULASI +8%</text></g>
<text x="470" y="768" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="1" fill="#c0392b" opacity="${n(small, 3)}">SIMULASI,</text>
<text x="470" y="796" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="1" fill="#c0392b" opacity="${n(small, 3)}">BUKAN KEPUTUSAN</text>
<g opacity="${n(lineA, 3)}"><text x="110" y="880" font-family="Oswald" font-weight="600" font-size="34" letter-spacing="2" fill="#6b5f52">TAMBAHAN 8%</text>
<text x="830" y="884" text-anchor="end" font-family="JetBrains Mono" font-weight="700" font-size="58" fill="#2e7d3a">+${rp(raise)}</text>
<line x1="110" y1="920" x2="830" y2="920" stroke="${INK}" stroke-width="5" stroke-dasharray="14 10"/>
<text x="110" y="990" font-family="Oswald" font-weight="600" font-size="34" letter-spacing="2" fill="#6b5f52">TOTAL BARU (SIMULASI)</text>
<g transform="translate(830 1070) scale(${n(pulse, 4)}) translate(-830 -1070)"><text x="830" y="1070" text-anchor="end" font-family="JetBrains Mono" font-weight="700" font-size="76" fill="${INK}">${rp(total)}</text></g></g>
<text x="110" y="1118" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="#6f6a66" opacity="${n(Math.min(1, card * 2), 3)}">Sumber: rata-rata SK gubernur, dihitung Investortrust (Des 2025)</text></g>`;
        const coins = `<g opacity="${n(lab, 3)}"><text x="830" y="1218" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="46" letter-spacing="2" fill="${INK}" stroke="#fffaf0" stroke-width="9" paint-order="stroke">+Rp280 RB</text></g>${coinStack(f, ribu, 830, 1410)}`;
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="hitung-glow" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff1d4"/><stop offset="1" stop-color="#ead9bb"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#hitung-glow)"/>
<rect x="0" y="1160" width="1080" height="760" fill="#c9ae84"/><rect x="0" y="1160" width="1080" height="12" fill="#a8906f"/>
${F1.world.dust(f, { x: 100, y: 500, w: 840, h: 620, count: 14, seed: 23, color: "#fff3cf", alpha: 0.4 })}
${slip}${coins}</svg>`;
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.03,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 55 },
              { at: delapan - 4, scale: 1.03, ox: 50, oy: 58, ease: 14 },
              { at: ribu + 10, scale: 1.04, ox: 60, oy: 70, ease: 16 },
            ],
          }),
          C.vignette(0.2, "50% 55%", 55),
          C.progress(f, { step: 3, label: "BUKTI 2 · SIMULASI" }),
          f < rata - 2 ? C.chip(f, { at: 4, text: "KITA SIMULASI" }) : "",
          C.cast(S, f, [
            { src: C.CAST.nisa, x: 480, y: 1200, w: 380, at: 0 },
            { src: { who: "beni", expr: "senyum" }, x: 480, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
