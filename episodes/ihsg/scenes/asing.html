<!-- Asing: a cartoon map of the Indonesian islands; from "jual" notes marked ASING fly out of it in arcs while the HUD counts Rp3,35 T (Kontan/RTI) and a tag names it. On "Bursa" the camera drops to a price-floor sign: a red candle falls onto a floor that rises, and a big 7% slams in on "tujuh" (ARB, 19 Okt-31 Des 2026, Kontan). On "Yang kena siapa?" the scene wipes to a donut card: 32,2 juta investors count up on "tiga puluh dua juta", the lime arc grows to 53,4% on "separuhnya" (KSEI, Sep 2026), with a crowd walking below. Muklis, Nisa, Muklis. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #e9efe9;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="asing" data-width="1080" data-height="1920">
    <div id="asing-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="asing-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="0.7667" id="asing-sfx-cash" class="clip" src="public/sfx/cash.wav" data-at="word:asing" data-track-index="12" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="2" id="asing-sfx-num" class="clip" src="public/sfx/ding-num.wav" data-at="word:tiga#0" data-track-index="13" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="7.9667" id="asing-sfx-arb" class="clip" src="public/sfx/stamp.wav" data-at="word:tujuh" data-track-index="14" data-volume="0.3"></audio>
    <audio data-hf-media-start-basis="local" data-start="12.5" id="asing-sfx-juta" class="clip" src="public/sfx/pop-in.wav" data-at="word:juta" data-track-index="15" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="14.5" id="asing-sfx-half" class="clip" src="public/sfx/ding-num.wav" data-at="word:separuhnya" data-track-index="16" data-volume="0.07"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const SAGE = "#a9c79a";
      const ISLAND = (shape) => `<g fill="${SAGE}" stroke="${INK}" stroke-width="4">${shape}</g>`;
      const MAP = `<rect x="80" y="520" width="860" height="290" rx="24" fill="#cfe3e6" stroke="${INK}" stroke-width="6"/>
<text x="112" y="566" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="3" fill="#2a6f7a">INDONESIA</text>
${ISLAND(`<ellipse cx="220" cy="650" rx="110" ry="34" transform="rotate(35 220 650)"/><ellipse cx="450" cy="625" rx="90" ry="78"/><ellipse cx="420" cy="750" rx="125" ry="20"/><ellipse cx="590" cy="752" rx="40" ry="14"/><ellipse cx="668" cy="764" rx="34" ry="12"/><ellipse cx="640" cy="596" rx="24" ry="58"/><ellipse cx="692" cy="646" rx="56" ry="16" transform="rotate(-20 692 646)"/><ellipse cx="660" cy="696" rx="18" ry="36"/><ellipse cx="830" cy="652" rx="100" ry="60"/>`)}`;
      // notes marked ASING fly out of the map in arcs, one after another (seeded)
      const BILLS = (f, at) => {
        let out = "";
        for (let i = 0; i < 14; i++) {
          const r = (j) => W.hash(i * 7 + j + 60);
          const t = Math.max(0, Math.min(1, (f - at - i * 6) / 54));
          if (t <= 0 || t >= 1) continue;
          const x = 380 + 240 * r(1) + 800 * t;
          const y = 650 + 60 * (r(2) - 0.5) - 420 * t + 280 * t * t;
          const rot = 360 * t * (r(3) - 0.5);
          out += `<g transform="translate(${n(x)} ${n(y)}) rotate(${n(rot, 1)}) scale(${n(0.5 + 0.6 * Math.min(1, t * 4), 3)})"><rect x="-70" y="-32" width="140" height="64" rx="7" fill="#9ccf9a" stroke="${INK}" stroke-width="4"/><circle r="19" fill="none" stroke="#1f4d2a" stroke-width="3"/><text x="0" y="8" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="20" fill="#1f4d2a">ASING</text></g>`;
        }
        return out;
      };
      // the ARB sign: a candle falls onto a floor that rises (the daily limit gets narrower); 7% slams in
      const SIGN = (f, { show, floor, fall, big }) => {
        if (show <= 0) return "";
        const fy = 1070 - 70 * floor;
        const cy = 880 + (fy - 880 - 120) * fall;
        return `<g opacity="${n(show, 3)}" transform="translate(0 ${n(40 * (1 - show))})"><rect x="150" y="840" width="740" height="260" rx="22" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<line x1="190" y1="${n(fy)}" x2="470" y2="${n(fy)}" stroke="#c0392b" stroke-width="10" stroke-dasharray="26 14"/>
<rect x="298" y="${n(cy)}" width="46" height="120" rx="6" fill="#d0413a" stroke="${INK}" stroke-width="5"/><line x1="321" y1="${n(cy - 24)}" x2="321" y2="${n(cy + 144)}" stroke="${INK}" stroke-width="5"/>
<text x="500" y="882" font-family="JetBrains Mono" font-weight="700" font-size="30" letter-spacing="3" fill="#6b5f52">ARB</text>
<g transform="translate(560 1038) scale(${n(2 - big, 3)}) translate(-560 -1038)" opacity="${n(Math.min(1, big * 1.5), 3)}"><text x="520" y="1038" font-family="Oswald" font-weight="600" font-size="150" fill="#c0392b">7%</text></g>
<text x="500" y="1074" font-family="Oswald" font-weight="600" font-size="26" letter-spacing="2" fill="${INK}" opacity="${n(Math.min(1, big * 1.5), 3)}">BATAS TURUN HARIAN</text></g>`;
      };
      // donut: the full ring is all investors, the lime arc the share aged 30 or younger
      const DONUT = (f, { show, arc }) => {
        if (show <= 0) return "";
        const R = 150;
        const C0 = 2 * Math.PI * R;
        return `<g opacity="${n(show, 3)}" transform="translate(0 ${n(40 * (1 - show))})"><rect x="170" y="500" width="740" height="500" rx="26" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<text x="540" y="552" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="24" letter-spacing="3" fill="#6b5f52">INVESTOR PASAR MODAL · SEP 2026</text>
<g transform="translate(540 770) rotate(-90)"><circle r="${R}" fill="none" stroke="${INK}" stroke-width="84"/><circle r="${R}" fill="none" stroke="#d6cdbd" stroke-width="72"/><circle r="${R}" fill="none" stroke="${INK}" stroke-width="84" stroke-dasharray="${n(C0 * 0.534 * arc, 2)} ${n(C0, 2)}" opacity="${arc > 0 ? 1 : 0}"/><circle r="${R}" fill="none" stroke="#C6F432" stroke-width="72" stroke-dasharray="${n(C0 * 0.534 * arc, 2)} ${n(C0, 2)}" opacity="${arc > 0 ? 1 : 0}"/></g>
</g>`;
      };
      window.__timelines["asing"] = F1.scene("asing", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const jual = w("jual");
        const tiga0 = w("tiga", 0);
        const rupiah = w("rupiah");
        const bursa = w("Bursa");
        const memangkas = w("memangkas");
        const tujuh = w("tujuh");
        const kena = w("kena");
        const investor = w("Investor");
        const tiga2 = w("tiga", 2);
        const juta = w("juta");
        const sep = w("separuhnya");
        const a = 1 - F1.ramp(f, investor - 6, 10);
        const bPhase = F1.ramp(f, investor - 2, 12, F1.expoOut);
        const sign = F1.ramp(f, bursa, 12, F1.expoOut);
        const floor = F1.ramp(f, memangkas, 22, F1.easeOut);
        const fall = F1.ramp(f, bursa + 6, 20, F1.expoOut);
        const big = F1.ramp(f, tujuh, 8, F1.expoOut);
        const arc = F1.ramp(f, sep, 28, F1.easeOut);
        const rp = (3.35 * F1.ramp(f, tiga0, rupiah - tiga0 + 6, F1.easeOut)).toFixed(2).replace(".", ",");
        const jt = (32.2 * F1.ramp(f, investor, juta - investor + 10, F1.easeOut)).toFixed(1).replace(".", ",");
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#e9efe9"/>
<g style="filter:blur(3px)"><path d="M0 420 L140 330 L260 390 L420 300 L600 380 L760 320 L900 390 L1080 340 V480 H0 Z" fill="#cdd9cf"/></g>
<rect x="0" y="1128" width="1080" height="792" fill="#cbbf9f"/><rect x="0" y="1118" width="1080" height="12" fill="#a8906f"/>
<g opacity="${n(a, 3)}">${MAP}${BILLS(f, jual)}${SIGN(f, { show: sign, floor, fall, big })}</g>
${DONUT(f, { show: bPhase, arc })}
<g opacity="${n(Math.min(1, bPhase * 1.5), 3)}">${W.row(f, { y: 1110, s: 0.72, count: 12, seed: 52, speed: 0.9 })}</g></svg>`;
        // the donut centre text lives in the overlay layer so it stays crisp: count of investors, then the share
        const centre =
          bPhase <= 0
            ? ""
            : `<div style="${F1.css({ position: "absolute", left: 0, width: 1080, top: 726, textAlign: "center", opacity: n(bPhase, 3), fontFamily: "Oswald, sans-serif", fontWeight: 600, color: "#2a2a2e", lineHeight: 1 })}">${
                f < sep
                  ? `<div style="font-size:68px">${jt}</div><div style="font-size:24px;letter-spacing:2px;color:#6b5f52;margin-top:6px">JUTA</div>`
                  : `<div style="font-size:64px;color:#c0392b">53,4%</div><div style="font-size:22px;letter-spacing:1px;color:#6b5f52;margin-top:6px">≤ 30 TAHUN</div>`
              }</div>`;
        const hud =
          f >= sep
            ? C.hud(f, { at: sep, kicker: "USIA ≤ 30 TAHUN", big: "53,4%", sub: "DARI SELURUH INVESTOR", src: "KSEI (Sep 2026)" })
            : f >= investor
              ? C.hud(f, { at: investor, kicker: "INVESTOR PASAR MODAL", big: `${jt} JT`, sub: "SID · AKHIR SEP 2026", src: "KSEI (Sep 2026)" })
              : f >= tujuh
                ? C.hud(f, { at: tujuh, kicker: "ARB · BATAS TURUN", big: "7%", sub: "19 OKT–31 DES 2026", src: "Kontan" })
                : C.hud(f, { at: 4, kicker: "ASING JUAL BERSIH", big: `Rp${rp} T`, sub: "16 OKT 2026", src: "Kontan (RTI)" });
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.04,
            shots: [
              { at: 0, scale: 1.08, ox: 50, oy: 36 },
              { at: bursa, scale: 1.1, ox: 50, oy: 56, ease: 14 },
              { at: kena, scale: 1, ox: 50, oy: 25, ease: 12 },
              { at: sep, scale: 1.03, ox: 50, oy: 25, ease: 12 },
            ],
          }),
          C.vignette(0.3, "50% 50%", 55),
          centre,
          f < bursa ? C.tag(f, { at: rupiah - 20, x: 150, y: 860, rot: -2, light: true, size: 44, text: `<span style="color:#c0392b">ASING JUAL BERSIH</span> · 16 OKT` }) : "",
          f >= kena && f < investor ? C.tag(f, { at: kena, x: 260, y: 700, rot: -4, light: true, size: 60, text: `<span style="color:#c0392b">SIAPA YANG KENA?</span>` }) : "",
          C.progress(f, { step: 4, label: "BUKTI 2 · ASING KABUR" }),
          hud,
          C.cast(S, f, [
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
