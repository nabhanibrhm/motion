<!-- Jangka: two gold columns. NOV 2021 (10 g = Rp9.510.000, grows on "dibeli") vs OKT 2026 (BUYBACK 10 g = Rp23.410.000, grows on "nilainya"); a +146% badge on "lebih" and a LEBIH DARI x2 stamp on "lipat". On "Rekor" the panel swaps to a three-point timeline (only the listed points): REKOR AGU 2020 Rp1.065.000, TURUN APR 2021 Rp930.000, REKOR BARU MAR 2023 Rp1.088.000, with a bracket "≈2,5 TAHUN". On Beni's line the chart dims and an EMAS = JANGKA PANJANG pill slams in. Sources: Kontan, Katadata, CNBC Indonesia, Republika. Muklis, Beni. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #eadcc4;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="jangka" data-width="1080" data-height="1920">
    <div id="jangka-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="jangka-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="3.6333" id="jangka-sfx-nov" class="clip" src="public/sfx/pop-in.wav" data-at="word:November" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="3.3333" id="jangka-sfx-num1" class="clip" src="public/sfx/ding-num.wav" data-at="word:dibeli" data-track-index="13" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="6.3667" id="jangka-sfx-num2" class="clip" src="public/sfx/ding-num.wav" data-at="word:nilainya" data-track-index="14" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="7.0333" id="jangka-sfx-pct" class="clip" src="public/sfx/pop-in.wav" data-at="word:lebih" data-track-index="15" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="8.2667" id="jangka-sfx-x2" class="clip" src="public/sfx/stamp.wav" data-at="word:lipat" data-track-index="16" data-volume="0.35"></audio>
    <audio data-hf-media-start-basis="local" data-start="9.1" id="jangka-sfx-rekor" class="clip" src="public/sfx/pop-in.wav" data-at="word:Rekor" data-track-index="17" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="11.3667" id="jangka-sfx-new" class="clip" src="public/sfx/ding-num.wav" data-at="word:terpecahkan" data-track-index="18" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="14.4333" id="jangka-sfx-end" class="clip" src="public/sfx/stamp.wav" data-at="word:Jadi" data-track-index="19" data-volume="0.35"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const RED = "#c0392b";
      const MUTE = "#6b5f52";
      const LIME = "#C6F432";
      const fmt = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const T = (x, y, size, fill, text, { anchor = "start", font = "JetBrains Mono", weight = 700, ls = 0 } = {}) =>
        `<text x="${n(x)}" y="${n(y)}" text-anchor="${anchor}" font-family="${font}" font-weight="${weight}" font-size="${size}" letter-spacing="${ls}" fill="${fill}">${text}</text>`;
      // panel 1: two gold columns on a base line at y 1030
      const COLS = (f, o) => {
        if (o.alpha <= 0) return "";
        const BASE = 1030;
        const h1 = 154 * o.g1;
        const h2 = 380 * o.g2;
        const col = (x, h, fill, hl) => `<rect x="${x}" y="${n(BASE - h)}" width="230" height="${n(h)}" rx="10" fill="${fill}" stroke="${INK}" stroke-width="6"/><rect x="${x + 22}" y="${n(BASE - h + 16)}" width="22" height="${n(Math.max(0, h - 32))}" rx="8" fill="#fff" opacity="${hl}"/>`;
        return `<g opacity="${n(o.alpha, 3)}"><rect x="80" y="490" width="860" height="650" rx="24" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<line x1="130" y1="${BASE}" x2="890" y2="${BASE}" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
${T(110, 560, 40, INK, "10 GRAM EMAS · 5 TAHUN", { font: "Oswald", weight: 600, ls: 2 })}<rect x="190" y="${BASE - 154}" width="230" height="154" rx="10" fill="none" stroke="#b9ad98" stroke-width="4" stroke-dasharray="10 10"/><rect x="560" y="${BASE - 380}" width="230" height="380" rx="10" fill="none" stroke="#b9ad98" stroke-width="4" stroke-dasharray="10 10"/>${col(190, h1, "#f0d98a", 0.35)}${col(560, h2, "#e0b13a", 0.4)}
${o.g1 > 0 ? T(305, BASE - h1 - 20, 46, INK, "Rp" + fmt(9510000 * o.g1), { anchor: "middle", font: "Oswald" }) : ""}
${o.g2 > 0 ? T(675, BASE - h2 - 20, 46, INK, "Rp" + fmt(23410000 * o.g2), { anchor: "middle", font: "Oswald" }) : ""}
${o.l1 > 0 ? `<g opacity="${n(o.l1, 3)}">${T(305, 1070, 34, INK, "NOV 2021", { anchor: "middle", font: "Oswald", weight: 600, ls: 3 })}${T(305, 1096, 17, MUTE, "10 g · BELI Rp951.000/g", { anchor: "middle", weight: 500 })}</g>` : ""}
${o.l2 > 0 ? `<g opacity="${n(o.l2, 3)}">${T(675, 1070, 34, INK, "OKT 2026", { anchor: "middle", font: "Oswald", weight: 600, ls: 3 })}${T(675, 1096, 17, MUTE, "10 g · BUYBACK Rp2.341.000/g", { anchor: "middle", weight: 500 })}</g>` : ""}
${o.pct > 0 ? `<g transform="translate(480 ${n(720 - (1 - o.pct) * 20)}) scale(${n(0.6 + 0.4 * o.pct, 3)})" opacity="${n(o.pct, 3)}"><path d="M-110 70 Q-20 -10 100 -42" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="M86 -66 L116 -42 L80 -26" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="-84" y="-30" width="168" height="62" rx="16" fill="${LIME}" stroke="${INK}" stroke-width="5"/>${T(0, 16, 42, INK, "+146%", { anchor: "middle", font: "Oswald", ls: 1 })}</g>` : ""}
${T(110, 1126, 16, "#8a6f55", "Sumber: Kontan (11 Nov 2021), Katadata (30 Okt 2026)", { weight: 500 })}</g>`;
      };
      // panel 2: milestones on a time axis (Aug 2020 -> Apr 2021 -> Mar 2023), height = price
      const LINE = (f, o) => {
        if (o.alpha <= 0) return "";
        const q0 = { x: 170, y: 700 };
        const q1 = { x: 348, y: 900 };
        const q2 = { x: 850, y: 660 };
        const a = { x: q0.x + (q1.x - q0.x) * o.s1, y: q0.y + (q1.y - q0.y) * o.s1 };
        const b = { x: q1.x + (q2.x - q1.x) * o.s2, y: q1.y + (q2.y - q1.y) * o.s2 };
        const d = `M${q0.x} ${q0.y} L${n(a.x)} ${n(a.y)}${o.s2 > 0 ? ` L${n(b.x)} ${n(b.y)}` : ""}`;
        const tip = o.s2 > 0 ? b : a;
        return `<g opacity="${n(o.alpha, 3)}"><rect x="80" y="490" width="860" height="650" rx="24" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
${o.s2 >= 1 ? `<line x1="${q0.x}" y1="${q0.y}" x2="${q2.x}" y2="${q0.y}" stroke="#b9ad98" stroke-width="3" stroke-dasharray="8 8"/>` : ""}
<path d="${d}" fill="none" stroke="${o.s2 > 0 ? "#e0b13a" : RED}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
${o.s1 > 0 ? `<path d="M${q0.x} ${q0.y} L${n(a.x)} ${n(a.y)}" fill="none" stroke="${RED}" stroke-width="10" stroke-linecap="round"/>` : ""}
${o.p0 > 0 ? `<circle cx="${q0.x}" cy="${q0.y}" r="12" fill="#e0b13a" stroke="${INK}" stroke-width="4"/><g opacity="${n(o.p0, 3)}">${T(110, 636, 20, INK, "REKOR · AGU 2020")}${T(110, 678, 40, INK, "Rp1.065.000", { font: "Oswald" })}</g>` : ""}
${o.s1 >= 1 ? `<circle cx="${q1.x}" cy="${q1.y}" r="12" fill="${RED}" stroke="${INK}" stroke-width="4"/>${T(q1.x, 950, 20, RED, "TURUN · APR 2021", { anchor: "middle" })}${T(q1.x, 994, 42, RED, "Rp930.000", { anchor: "middle", font: "Oswald" })}` : ""}
${o.s2 >= 1 ? `<circle cx="${q2.x}" cy="${q2.y}" r="13" fill="${LIME}" stroke="${INK}" stroke-width="4"/>${T(810, 606, 20, INK, "REKOR BARU · MAR 2023", { anchor: "end" })}${T(810, 646, 40, INK, "Rp1.088.000", { anchor: "end", font: "Oswald" })}` : o.s1 >= 1 ? `<circle cx="${n(tip.x)}" cy="${n(tip.y)}" r="11" fill="#e0b13a" stroke="${INK}" stroke-width="4"/>` : ""}
${o.br > 0 ? `<g opacity="${n(Math.min(1, o.br * 2), 3)}"><path d="M${q0.x} 580 V560 H${n(q0.x + (q2.x - q0.x) * o.br)} V580" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>${o.br > 0.55 ? `<rect x="410" y="532" width="200" height="50" rx="14" fill="${LIME}" stroke="${INK}" stroke-width="5"/>${T(510, 568, 32, INK, "≈2,5 TAHUN", { anchor: "middle", font: "Oswald", ls: 1 })}` : ""}</g>` : ""}
${T(110, 1124, 16, "#8a6f55", "Sumber: CNBC Indonesia (Mar 2023), Republika (2021)", { weight: 500 })}</g>`;
      };
      window.__timelines["jangka"] = F1.scene("jangka", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const november = w("November");
        const dibeli = w("dibeli");
        const sekarang = w("sekarang");
        const nilainya = w("nilainya");
        const lebih = w("lebih");
        const lipat = w("lipat");
        const rekor = w("Rekor");
        const baru = w("baru");
        const terpecah = w("terpecahkan");
        const setengah = w("setengah");
        const jadi = F1.line(S, 1).start;
        const g1 = F1.ramp(f, dibeli, 24, F1.easeOut);
        const g2 = F1.ramp(f, nilainya, 28, F1.easeOut);
        const pct = F1.ramp(f, lebih, 12, F1.expoOut);
        const swapOut = 1 - F1.ramp(f, rekor - 6, 8);
        const dim = f >= jadi - 6 ? 1 - 0.88 * F1.ramp(f, jadi - 6, 10) : 1;
        const end = F1.ramp(f, jadi + 14, 10, F1.expoOut);
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#eadcc4"/>
<g style="filter:blur(3px)"><rect x="740" y="290" width="260" height="300" fill="#f7e3b0"/><path d="M740 290 h260 v300 h-260 Z M870 290 v300 M740 440 h260" stroke="#8a6f55" stroke-width="14" fill="none"/></g>
${W.dust(f, { x: 100, y: 480, w: 840, h: 680, count: 20, seed: 41, color: "#fff3cf", alpha: 0.5 })}
<rect x="0" y="1190" width="1080" height="730" fill="#cdb391"/><rect x="0" y="1180" width="1080" height="12" fill="#a8906f"/>
${COLS(f, { alpha: swapOut, g1, g2, l1: F1.ramp(f, november, 10, F1.expoOut), l2: F1.ramp(f, sekarang, 10, F1.expoOut), pct })}
${LINE(f, { alpha: f < rekor - 6 ? 0 : F1.ramp(f, rekor - 6, 8) * dim, p0: F1.ramp(f, rekor, 10, F1.expoOut), s1: F1.ramp(f, baru, 18, F1.easeOut), s2: F1.ramp(f, terpecah, 44, F1.easeOut), br: F1.ramp(f, setengah - 4, 16, F1.easeOut) })}</svg>`;
        const pctN = Math.round(146 * F1.ramp(f, lebih, 26, F1.easeOut));
        const hud =
          f >= rekor
            ? C.hud(f, { at: rekor, kicker: "REKOR 2020 → REKOR BARU", big: "≈2,5 TAHUN", sub: "AGU 2020 → MAR 2023", src: "CNBC Indonesia, Republika", w: 540, bigSize: 60 })
            : f >= lebih
              ? C.hud(f, { at: lebih, kicker: "10 GRAM · 5 TAHUN", big: "+146%", sub: "Rp9.510.000 → Rp23.410.000", src: "Kontan, Katadata", w: 540 })
              : C.hud(f, { at: 4, kicker: "LIHAT JANGKA PANJANG", big: "5 TAHUN", sub: "10 GRAM · NOV 2021 → OKT 2026", src: "Kontan, Katadata", w: 540 });
        const pill =
          end <= 0
            ? ""
            : `<div style="${F1.css({ position: "absolute", left: 90, top: 760, width: 900, display: "flex", justifyContent: "center", opacity: n(end, 3) })}"><div style="${F1.css({ padding: "20px 44px", borderRadius: 22, background: LIME, border: "7px solid #2a2a2e", textAlign: "center", fontFamily: "Oswald, sans-serif", fontWeight: 700, fontSize: 72, lineHeight: 1.08, letterSpacing: 2, color: "#2a2a2e", transform: `rotate(-3deg) scale(${n(2 - end, 3)})` })}">EMAS =<br>JANGKA PANJANG</div></div>`;
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.03,
            shots: [
              { at: 0, scale: 1.02, ox: 50, oy: 28 },
              { at: rekor - 4, scale: 1.03, ox: 50, oy: 34, ease: 14 },
              { at: jadi, scale: 1.03, ox: 50, oy: 40, ease: 12 },
            ],
          }),
          C.vignette(0.24, "50% 55%", 50),
          f < rekor - 4 ? C.stamp(f, { at: lipat, x: 625, y: 482, rot: -5, text: "LEBIH DARI ×2", size: 34, color: "#3d6b0f" }) : "",
          pill,
          C.progress(f, { step: 6, label: "BUKTI 3 · JANGKA PANJANG" }),
          hud,
          C.cast(S, f, [
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.beni, x: 540, y: 1200, w: 400 },
          ]),
        );
      });
    })();
  </script>
</template>
