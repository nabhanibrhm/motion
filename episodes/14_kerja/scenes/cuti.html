<!-- Cuti (BUKTI 4 · CUTI): every card carries the label BERLAKU · TEKS UU 27/2026. A calendar fills 12 working days teal on "dua belas" (counter card >= 12 HARI KERJA); on "cuti bersama" three red rings draw on other days and the badge CUTI BERSAMA TIDAK MEMOTONG lands while the counter stays 12. A small ISTIRAHAT PANJANG chip follows. Beni asks about birth leave; Nisa's answer brings the SUAMI card on "Dua" and the CUTI MELAHIRKAN card on "ibunya". Muklis, Beni, Nisa. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #dfe8ee;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="cuti" data-width="1080" data-height="1920">
    <div id="cuti-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="1" id="cuti-sfx-belas" class="clip" src="public/sfx/pop-in.wav" data-at="word:belas" data-track-index="12" data-volume="0.15"></audio>
    <audio data-hf-media-start-basis="local" data-start="2" id="cuti-sfx-bersama" class="clip" src="public/sfx/click.wav" data-at="word:bersama" data-track-index="13" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="3" id="cuti-sfx-bayar" class="clip" src="public/sfx/ding.wav" data-at="word:dibayar" data-track-index="14" data-volume="0.15"></audio>
    <audio data-hf-media-start-basis="local" data-start="4" id="cuti-sfx-suami" class="clip" src="public/sfx/pop-in.wav" data-at="word:ditambah" data-track-index="15" data-volume="0.15"></audio>
    <audio data-hf-media-start-basis="local" data-start="5" id="cuti-sfx-ibu" class="clip" src="public/sfx/pop-in.wav" data-at="word:ibunya" data-track-index="16" data-volume="0.15"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const RED = "#d0413a";
      const TEAL = "#3d7480";
      const TEAL2 = "#2f6a6e";
      const PAPER = "#f3f7fa";
      const mono = "font-family:'JetBrains Mono',monospace";
      const osw = "font-family:Oswald,sans-serif";
      // office backdrop: soft towers, drifting light, concrete floor from y 1190
      const OFFICE = (f, seed) => `<rect width="1080" height="1920" fill="#dfe8ee"/>
${W.drift(f, { seed, count: 7, y0: 300, y1: 1100, color: "#8fd0d2", a: 0.26 })}
${W.sweep(f, { color: "#f3f7fa", a: 0.22, y0: 240, y1: 1180 })}
<g style="filter:blur(3px)" fill="#c4d3dd">${[0, 1, 2, 3, 4, 5, 6, 7].map((k) => `<rect x="${k * 140 - 20}" y="${600 - 140 * W.hash(k + seed)}" width="${100 + 30 * W.hash(k + 3)}" height="700"/>`).join("")}</g>
<rect x="-20" y="1190" width="1120" height="740" fill="#b3bcc3"/><rect x="-20" y="1190" width="1120" height="12" fill="#9aa6ae"/>`;
      // a sourced card: kicker, big text, optional sub, "Sumber:" line
      const CARD = (f, { at, x, y, w, kicker, big, sub = "", src = "", bigSize = 48, bg = PAPER, color = INK, kc = TEAL, rot = 0, dir = 0, extra = "" }) => {
        const p = F1.ramp(f, at, 12, F1.expoOut);
        if (p <= 0) return "";
        const dark = color !== INK;
        return `<div style="${F1.css({ position: "absolute", left: x, top: y, width: w, boxSizing: "border-box", padding: "16px 24px 16px", borderRadius: 16, background: bg, border: `5px solid ${INK}`, boxShadow: "0 8px 0 rgba(42,42,46,0.18)", opacity: n(p, 3), transform: `translate(${n(dir * 50 * (1 - p))}px, ${n(dir ? 0 : 36 * (1 - p))}px) rotate(${rot}deg)` })}">
${kicker ? `<div style="${mono};font-weight:700;font-size:20px;letter-spacing:2px;color:${kc}">${kicker}</div>` : ""}<div style="${osw};font-weight:700;font-size:${bigSize}px;line-height:1.08;color:${color};margin-top:4px">${big}</div>${sub ? `<div style="${mono};font-weight:500;font-size:21px;letter-spacing:1px;color:${dark ? "#d3dde3" : "#55606a"};margin-top:6px">${sub}</div>` : ""}${extra}${src ? `<div style="${mono};font-weight:500;font-size:16px;color:${dark ? "#9fb0ba" : "#5f6a72"};margin-top:8px">Sumber: ${src}</div>` : ""}</div>`;
      };
      const BADGE = (f, { at, x, y, text, bg = RED, color = "#fff", size = 30, rot = 0 }) => {
        const p = F1.ramp(f, at, 10, F1.expoOut);
        if (p <= 0) return "";
        return `<div style="${F1.css({ position: "absolute", left: x, top: y, padding: "8px 18px", borderRadius: 10, background: bg, color, fontFamily: "Oswald, sans-serif", fontWeight: 600, fontSize: size, letterSpacing: 2, opacity: n(p, 3), transform: `rotate(${rot}deg) scale(${n(0.6 + 0.4 * p, 3)})`, whiteSpace: "nowrap" })}">${text}</div>`;
      };
      // month grid: day 1 sits in column 2. ring = days with a red ring (draws in), fill = days filled teal (grows in)
      const CAL = (f, { x, y, w, ring = [], fill = [], ringP = 1, fillP = 1, rows = 5 }) => {
        const cw = w / 7;
        const ch = 62;
        let g = `<g transform="translate(${x} ${y})"><rect width="${w}" height="${rows * ch + 56}" rx="18" fill="${PAPER}" stroke="${INK}" stroke-width="6"/><rect x="0" y="0" width="${w}" height="52" rx="18" fill="${TEAL2}"/><rect x="0" y="30" width="${w}" height="22" fill="${TEAL2}"/>`;
        ["S", "S", "R", "K", "J", "S", "M"].forEach((d, i) => (g += `<text x="${n(cw * i + cw / 2)}" y="36" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="24" fill="#fff">${d}</text>`));
        for (let d = 1; d <= 30; d++) {
          const idx = d + 1;
          const c = idx % 7;
          const r = Math.floor(idx / 7);
          if (r >= rows) break;
          const cx = cw * c + cw / 2;
          const cy = 56 + ch * r + ch / 2;
          const fi = fill.indexOf(d);
          let fp = 0;
          if (fi >= 0) {
            fp = Math.max(0, Math.min(1, fillP * (fill.length + 1) - fi));
            g += `<rect x="${n(cx - 40)}" y="${n(cy - 24)}" width="80" height="48" rx="12" fill="${TEAL}" opacity="${n(fp, 3)}"/>`;
          }
          g += `<text x="${n(cx)}" y="${n(cy + 9)}" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="30" fill="${fp > 0.5 ? "#fff" : c === 5 || c === 6 ? "#9aa6ae" : INK}">${d}</text>`;
          const ri = ring.indexOf(d);
          if (ri >= 0) {
            const p = Math.max(0, Math.min(1, ringP * (ring.length + 1) - ri));
            g += `<circle cx="${n(cx)}" cy="${n(cy)}" r="29" fill="none" stroke="${RED}" stroke-width="7" stroke-dasharray="183" stroke-dashoffset="${n(183 * (1 - p))}" transform="rotate(-90 ${n(cx)} ${n(cy)})"/>`;
          }
        }
        return g + "</g>";
      };
      const ICON = {
        broom: (c) => `<path d="M-6 -50 L6 -50 L10 -6 L-10 -6 Z" fill="${c}"/><path d="M-26 -6 H26 L34 40 H-34 Z" fill="${c}" opacity="0.75"/><path d="M-18 6 V36 M0 6 V36 M18 6 V36" stroke="#fff" stroke-width="4"/>`,
        pot: (c) => `<path d="M-34 -14 H34 V24 Q34 40 18 40 H-18 Q-34 40 -34 24 Z" fill="${c}"/><rect x="-42" y="-24" width="84" height="12" rx="6" fill="${c}"/><path d="M-14 -34 q-8 -12 0 -22 M6 -34 q-8 -12 0 -22 M24 -34 q-8 -12 0 -22" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
        shield: (c) => `<path d="M0 -50 L38 -36 V4 Q38 34 0 52 Q-38 34 -38 4 V-36 Z" fill="${c}"/><path d="M-16 2 L-4 16 L18 -14" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
        bus: (c) => `<rect x="-48" y="-36" width="96" height="62" rx="12" fill="${c}"/><rect x="-38" y="-26" width="24" height="22" rx="4" fill="#dfe8ee"/><rect x="-8" y="-26" width="24" height="22" rx="4" fill="#dfe8ee"/><rect x="22" y="-26" width="18" height="22" rx="4" fill="#dfe8ee"/><circle cx="-26" cy="30" r="11" fill="${INK}"/><circle cx="26" cy="30" r="11" fill="${INK}"/>`,
        pick: (c) => `<path d="M-40 -22 Q0 -54 40 -22" stroke="${c}" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M0 -36 V50" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="M-18 44 H18" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`,
        person: (c) => `<circle cx="0" cy="-30" r="13" fill="${c}"/><path d="M-20 12 Q-20 -14 0 -14 Q20 -14 20 12 Z" fill="${c}"/>`,
        doc: (c) => `<path d="M-30 -44 H14 L34 -24 V44 H-30 Z" fill="${PAPER}" stroke="${c}" stroke-width="6" stroke-linejoin="round"/><path d="M-18 -8 H22 M-18 10 H22 M-18 28 H6" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`,
        gavel: (c) => `<g transform="rotate(-35)"><rect x="-34" y="-48" width="68" height="34" rx="8" fill="${c}"/><rect x="-6" y="-14" width="12" height="70" rx="5" fill="${INK}"/></g><rect x="-44" y="48" width="88" height="10" rx="5" fill="${INK}"/>`,
        building: (c) => `<rect x="-36" y="-50" width="72" height="100" fill="${c}"/><path d="M-24 -36 h12 v12 h-12z M-4 -36 h12 v12 h-12z M16 -36 h12 v12 h-12z M-24 -12 h12 v12 h-12z M-4 -12 h12 v12 h-12z M16 -12 h12 v12 h-12z" fill="#dfe8ee"/><rect x="-10" y="20" width="20" height="30" fill="#dfe8ee"/>`,
      };
      const IC = (name, x, y, s, c) => `<g transform="translate(${n(x)} ${n(y)}) scale(${n(s, 3)})">${ICON[name](c)}</g>`;
      const header = (id, desc) => desc;

      window.__timelines["cuti"] = F1.scene("cuti", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const belas = w("belas");
        const bersama = w("bersama");
        const dibayar = w("dibayar");
        const pemerintah = w("pemerintah");
        const suami = w("Dua", 2);
        const ibunya = w("ibunya");
        const fillP = F1.ramp(f, belas, 40, (u) => u);
        const ringP = F1.ramp(f, bersama, 30, (u) => u);
        const FILL = [6, 7, 8, 9, 10, 13, 14, 15, 16, 17, 20, 21];
        const cnt = Math.min(12, Math.round(12 * fillP));
        const paid = F1.ramp(f, dibayar, 10, F1.backOut);
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
${OFFICE(f, 710)}
${CAL(f, { x: 60, y: 345, w: 640, ring: [24, 27, 28], fill: FILL, ringP, fillP })}
<text x="60" y="745" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#5f6a72">Sumber: UU 27/2026 Pasal 118 ayat (5)-(6); Bisnis 7 Nov 2026; CNBC Indonesia 7 Nov 2026</text>
</svg>`;
        const counter = `<div style="${F1.css({ position: "absolute", left: 730, top: 357, width: 290, boxSizing: "border-box", padding: "16px 20px", borderRadius: 16, background: "rgba(18,18,22,0.92)", opacity: n(F1.ramp(f, belas - 14, 12, F1.expoOut), 3) })}">
<div style="${mono};font-weight:700;font-size:19px;letter-spacing:2px;color:#ff8a80">● CUTI TAHUNAN</div>
<div style="${osw};font-weight:700;font-size:112px;line-height:1.05;color:#fff">≥ ${cnt}</div>
<div style="${mono};font-weight:500;font-size:20px;color:#c9d6dd">HARI KERJA SETELAH 12 BULAN</div>
<div style="${F1.css({ marginTop: 12, display: "inline-block", padding: "4px 14px", borderRadius: 8, background: "#3f8a5a", color: "#fff", fontFamily: "Oswald, sans-serif", fontWeight: 600, fontSize: 28, letterSpacing: 2, opacity: n(Math.min(1, paid), 3), transform: `scale(${n(0.6 + 0.4 * paid, 3)})` })}">DIBAYAR PENUH</div></div>`;
        const label = `<div style="${F1.css({ position: "absolute", left: 60, top: 262, padding: "6px 16px", borderRadius: 8, background: TEAL2, color: "#fff", fontFamily: "JetBrains Mono, monospace", fontWeight: 700, fontSize: 21, letterSpacing: 2 })}">BERLAKU · TEKS UU 27/2026</div>`;
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.03,
            shots: [
              { at: 0, scale: 1.0, ox: 50, oy: 34 },
              { at: bersama - 6, scale: 1.04, ox: 45, oy: 44, ease: 14 },
              { at: suami - 8, scale: 1.03, ox: 50, oy: 56, ease: 14 },
            ],
          }),
          C.vignette(0.2, "50% 55%", 50),
          label,
          counter,
          BADGE(f, { at: bersama, x: 60, y: 768, text: "CUTI BERSAMA TIDAK MEMOTONG", bg: RED, size: 40, rot: -1 }),
          CARD(f, { at: pemerintah, x: 60, y: 838, w: 960, big: "ISTIRAHAT PANJANG 30 HARI / 5 TAHUN", bigSize: 30, src: "UU 27/2026 Pasal 118 ayat (2) huruf c, (4)" }),
          CARD(f, { at: suami, x: 60, y: 940, w: 960, kicker: "CUTI AYAH · BERLAKU", big: "SUAMI: 2 HARI (+ HINGGA 3 HARI)", bigSize: 38, src: "UU 27/2026 Pasal 124; CNBC Indonesia 7 Nov 2026", dir: -1 }),
          CARD(f, { at: ibunya, x: 60, y: 1066, w: 960, kicker: "CUTI IBU · BERLAKU", big: "CUTI MELAHIRKAN ≥ 3 BULAN · UPAH PENUH", bigSize: 36, src: "UU 27/2026 Pasal 121, 123; CNBC Indonesia 7 Nov 2026", dir: 1, kc: RED }),
          C.progress(f, { step: 5, label: "BUKTI 4 · CUTI" }),
          C.cast(S, f, [{ src: C.CAST.muklis, x: 540, y: 1200, w: 380, at: 0 }, { src: C.CAST.beni, x: 540, y: 1200, w: 400 }, { src: C.CAST.nisa, x: 540, y: 1200, w: 380 }]),
        );
      });

    })();
  </script>
</template>
