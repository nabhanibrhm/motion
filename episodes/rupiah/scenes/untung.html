<!-- Untung: Beni asks, then a port at dusk: a container crane swings, a palm-oil truck rolls in on "sawit", a coal barge drifts in on "batu"; on "migran" the remittance HUD appears; on "Dolarnya" a dollar note drops into a wallet and a thicker stack of rupiah rises out of it and an UNTUNG stamp lands. Beni asks, Muklis answers, Nisa gets it. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #e9b98a;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="untung" data-width="1080" data-height="1920">
    <div id="untung-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="untung-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="3.5667" id="untung-sfx-sawit" class="clip" src="public/sfx/pop-in.wav" data-at="word:sawit" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.0667" id="untung-sfx-batu" class="clip" src="public/sfx/pop-in.wav" data-at="word:batu" data-track-index="13" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="5.7" id="untung-sfx-migran" class="clip" src="public/sfx/ding-num.wav" data-at="word:migran" data-track-index="14" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="6.4667" id="untung-sfx-cash" class="clip" src="public/sfx/cash.wav" data-at="word:Dolarnya" data-track-index="15" data-volume="0.3"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const BG = (f, { truck, barge, crane }) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><linearGradient id="untung-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d4a6a"/><stop offset="0.55" stop-color="#e48a5a"/><stop offset="1" stop-color="#f2c27a"/></linearGradient></defs>
<rect width="1080" height="1920" fill="url(#untung-sky)"/>
<circle cx="760" cy="640" r="90" fill="#f8d9a0" opacity="0.85"/>
<g style="filter:blur(2px)"><path d="M0 760 H1080 V1000 H0 Z" fill="#4c6a7a"/><path d="M0 780 q 60 -8 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0" stroke="#f2c27a" stroke-width="4" fill="none" opacity="0.5" transform="translate(${n(-((f * 0.8) % 120))} 0)"/></g>
<g transform="translate(220 360)"><rect x="-14" y="0" width="28" height="430" fill="#c2463b" stroke="#2a2a2e" stroke-width="5"/><g transform="rotate(${n(crane, 2)})"><rect x="-40" y="-14" width="420" height="28" fill="#c2463b" stroke="#2a2a2e" stroke-width="5"/><line x1="300" y1="14" x2="300" y2="150" stroke="#2a2a2e" stroke-width="4"/><rect x="250" y="150" width="100" height="56" fill="#3f78b5" stroke="#2a2a2e" stroke-width="4"/></g></g>
<g transform="translate(${n(1180 - 520 * barge)} 860)"><path d="M-200 0 H200 L170 70 H-170 Z" fill="#3b3a40" stroke="#2a2a2e" stroke-width="5"/><path d="M-170 0 Q-90 -90 0 -60 Q90 -100 170 0 Z" fill="#1d1b1c"/></g>
<rect x="0" y="1000" width="1080" height="920" fill="#8a7a66"/><rect x="0" y="1000" width="1080" height="24" fill="#6b5f52"/>
<g transform="translate(${n(-380 + 600 * truck)} 1010)"><rect x="0" y="-150" width="260" height="120" rx="8" fill="#5fae7a" stroke="#2a2a2e" stroke-width="5"/><g fill="#d9622b" stroke="#2a2a2e" stroke-width="3">${[30, 70, 110, 150, 190, 230, 50, 90, 130, 170, 210].map((x, i) => `<circle cx="${x}" cy="${i < 6 ? -160 : -185}" r="22"/>`).join("")}</g><rect x="260" y="-130" width="100" height="100" rx="10" fill="#d9a441" stroke="#2a2a2e" stroke-width="5"/><rect x="290" y="-115" width="50" height="40" rx="5" fill="#bfe3e8"/><circle cx="60" cy="-20" r="28" fill="#1d1b1c"/><circle cx="300" cy="-20" r="28" fill="#1d1b1c"/></g></svg>`;
      // the wallet trick on "Dolarnya": a dollar drops in, then rupiah rises out, more than before
      const WALLET = (f, drop, rise) => {
        if (drop <= 0) return "";
        const notes = Array.from({ length: Math.round(6 * rise) }, (_, i) => `<rect x="${-70 + 4 * Math.sin(i * 2)}" y="${-60 - 26 * i}" width="140" height="40" rx="5" fill="#e7a3ae" stroke="#111" stroke-width="4"/>`).join("");
        return `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0"><g transform="translate(780 900)">${notes}
<g transform="translate(0 ${n(-260 * (1 - drop))})" opacity="${n(1 - rise, 3)}"><rect x="-70" y="-90" width="140" height="44" rx="5" fill="#9ccf9a" stroke="#111" stroke-width="4"/><text x="0" y="-60" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="24" fill="#1f4d2a">US$1</text></g>
<rect x="-110" y="-50" width="220" height="110" rx="18" fill="#6b4f3a" stroke="#111" stroke-width="6"/><rect x="40" y="-10" width="70" height="36" rx="10" fill="#8a6a4f" stroke="#111" stroke-width="4"/></g></svg>`;
      };
      window.__timelines["untung"] = F1.scene("untung", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const yang = F1.line(S, 1).start;
        const sawit = w("sawit");
        const batu = w("batu");
        const migran = w("migran");
        const dolarnya = w("Dolarnya");
        const truck = F1.ramp(f, sawit - 6, 24, F1.expoOut);
        const barge = F1.ramp(f, batu - 10, 40, F1.easeOut);
        const crane = 8 * Math.sin(f / 40);
        const drop = F1.ramp(f, dolarnya, 10, F1.expoOut);
        const rise = F1.ramp(f, dolarnya + 14, 22, F1.easeOut);
        return F1.join(
          C.stage(f, D, BG(f, { truck, barge, crane }), {
            zoom: 0.05,
            shots: [
              { at: 0, scale: 1.25, ox: 50, oy: 60 },
              { at: yang, scale: 1, ox: 50, oy: 50 },
              { at: sawit - 6, scale: 1.15, ox: 30, oy: 52, ease: 14 },
              { at: batu, scale: 1.15, ox: 70, oy: 45, ease: 14 },
              { at: dolarnya, scale: 1.05, ox: 60, oy: 48 },
            ],
          }),
          C.vignette(0.35, "50% 50%", 55),
          WALLET(f, drop, rise),
          C.tag(f, { at: sawit, x: 110, y: 760, rot: -4, text: "SAWIT" }),
          C.tag(f, { at: batu, x: 600, y: 700, rot: 3, text: "BATU BARA" }),
          f < migran
            ? C.hud(f, { at: yang, kicker: "SIAPA UNTUNG?", big: "EKSPORTIR", sub: "DIBAYAR DALAM DOLAR", bigSize: 60 })
            : f < dolarnya
              ? C.hud(f, { at: migran, kicker: "KIRIMAN PEKERJA MIGRAN", big: "US$9,16 MILIAR", sub: "SEMESTER I 2026 · ±Rp162 TRILIUN", src: "data BI via Kontan", w: 560, bigSize: 52 })
              : C.hud(f, { at: dolarnya, kicker: "US$1 JADI BERAPA?", big: "Rp18.147", sub: "30 OKT 2026 · SETAHUN LALU Rp16.631", src: "Kontan (kurs spot)", w: 520, bigSize: 64 }),
          C.stamp(f, { at: dolarnya + 30, x: 640, y: 1000, rot: 8, color: "#2f7d4a", size: 48, text: "UNTUNG" }),
          C.progress(f, { step: 4, label: "SAKSI · YANG UNTUNG" }),
          C.cast(S, f, [
            { src: C.CAST.beni, x: 540, y: 1200, w: 400, at: 0 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
