<!-- Pelajaran: money under the mattress, the OJK shield on "legal"; Muklis, then Beni pays up, then Nisa closes the case: black end card with the KASUS DITUTUP stamp on "ditutup". -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #e6dccb;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="pelajaran" data-width="1080" data-height="1920">
    <div id="pelajaran-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="pelajaran-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.7" id="pelajaran-sfx-coins" class="clip" src="public/sfx/pop-in.wav" data-at="word:kasur" data-track-index="12" data-volume="0.13"></audio>
    <audio data-hf-media-start-basis="local" data-start="11.1667" id="pelajaran-sfx-ojk" class="clip" src="public/sfx/ding-num.wav" data-at="word:OJK" data-track-index="13" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="13.3667" id="pelajaran-sfx-pay" class="clip" src="public/sfx/cash.wav" data-at="word:bayar" data-track-index="14" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="18.2667" id="pelajaran-sfx-stamp" class="clip" src="public/sfx/stamp.wav" data-at="word:ditutup" data-track-index="15" data-volume="0.45"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const COIN = (x, y) => `<g transform="translate(${n(x)} ${n(y)})" stroke="#2a2a2e" stroke-width="5" fill="#f2c14e"><ellipse cx="0" cy="16" rx="46" ry="16"/><ellipse cx="8" cy="0" rx="46" ry="16"/></g>`;
      const BG = (f, coinsUp, shield, sprout) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#e2d6c3"/>
<g style="filter:blur(3px)"><rect x="600" y="360" width="360" height="460" fill="#f7e3b0"/><path d="M600 360 h360 v460 h-360 Z M780 360 v460 M600 590 h360" stroke="#8a6f55" stroke-width="18" fill="none"/>
<path d="M600 820 L 360 1250 L 1080 1250 L 1080 820 Z" fill="#f7e3b0" opacity="0.35"/>
<g transform="translate(600 340) skewX(${n(3 * Math.sin(f / 23), 2)})"><path d="M-30 0 H40 Q30 240 50 500 H-30 Z" fill="#b5523b"/></g><g transform="translate(960 340) skewX(${n(-3 * Math.sin(f / 23 + 1), 2)})"><path d="M30 0 H-40 Q-30 240 -50 500 H30 Z" fill="#b5523b"/></g></g>
${F1.world.dust(f, { x: 380, y: 820, w: 640, h: 420, count: 18, seed: 5, color: "#fff3cf", alpha: 0.55 })}
<g transform="translate(200 830)"><circle r="58" fill="#f6efe1" stroke="#2a2a2e" stroke-width="6"/><path d="M0 0 V-34 M0 0 L22 10" stroke="#2a2a2e" stroke-width="6" stroke-linecap="round"/><path d="M0 0 L0 -44" stroke="#c0392b" stroke-width="3" transform="rotate(${Math.floor(f / 30) * 6})"/><circle r="5" fill="#2a2a2e"/></g>
<rect x="0" y="1060" width="1080" height="860" fill="#b9a083"/>
<g transform="translate(80 900)">
<rect x="0" y="120" width="620" height="150" rx="26" fill="#efe9de" stroke="#2a2a2e" stroke-width="6"/>
<path d="M30 150 q 40 -30 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0" stroke="#cdbfa9" stroke-width="5" fill="none"/>
<rect x="20" y="70" width="190" height="80" rx="30" fill="#f6f2ea" stroke="#2a2a2e" stroke-width="6"/>
<rect x="-10" y="40" width="30" height="300" rx="8" fill="#6b4f3a"/><rect x="600" y="120" width="30" height="220" rx="8" fill="#6b4f3a"/>
${COIN(420, 260 - 120 * coinsUp)}${COIN(512, 280 - 160 * coinsUp)}
${sprout > 0 ? `<g transform="translate(470 ${n(250 - 140 * coinsUp)})"><path d="M0 0 V${n(-150 * sprout)}" stroke="#4e8a4f" stroke-width="10" stroke-linecap="round"/><g transform="translate(0 ${n(-90 * sprout)}) scale(${n(F1.ramp(sprout, 0.3, 0.5), 3)})"><path d="M0 0 Q-60 -10 -70 -60 Q-20 -60 0 0 Z" fill="#7cc59a" stroke="#2a2a2e" stroke-width="5"/></g><g transform="translate(0 ${n(-150 * sprout)}) scale(${n(F1.ramp(sprout, 0.55, 0.45), 3)})"><path d="M0 0 Q60 -10 70 -60 Q20 -60 0 0 Z" fill="#7cc59a" stroke="#2a2a2e" stroke-width="5"/></g></g>` : ""}</g>
${shield > 0 ? `<g transform="translate(410 690) scale(${n(shield, 3)}) translate(-80 -110)"><path d="M80 0 L160 30 V110 Q160 180 80 220 Q0 180 0 110 V30 Z" fill="#7cc59a" stroke="#2a2a2e" stroke-width="7" stroke-linejoin="round"/><path d="M45 110 L72 140 L120 80" stroke="#fff" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>` : ""}</svg>`;
      window.__timelines["pelajaran"] = F1.scene("pelajaran", (f, { S, D }) => {
        const C = F1.cine;
        const kasur = F1.wordFrame(S, "kasur");
        const tumbuh = F1.wordFrame(S, "tumbuh");
        const legal = F1.wordFrame(S, "legal");
        const ditutup = F1.wordFrame(S, "ditutup");
        const coinsUp = F1.ramp(f, kasur, 20, F1.expoOut);
        // "tumbuh": a sprout grows out of the coins
        const sprout = F1.ramp(f, tumbuh, 30, F1.easeOut);
        const shield = f < legal - 4 ? 0 : F1.ramp(f, legal - 4, 14, F1.expoOut);
        // end card: black over everything from "ditutup", the stamp slams in a beat later
        const black = F1.ramp(f, ditutup - 6, 8);
        const slam = F1.ramp(f, ditutup, 8, F1.expoOut);
        const end = black <= 0 ? "" : `<div style="${F1.css({ position: "absolute", inset: 0, background: "#070708", opacity: n(black, 3) })}"></div>
<div style="${F1.css({ position: "absolute", left: 0, right: 0, top: 560, display: "flex", flexDirection: "column", alignItems: "center", gap: 40, opacity: n(black, 3) })}">
<div style="${F1.css({ padding: "14px 30px", border: "6px solid #ff5a5f", borderRadius: 12, transform: `rotate(-6deg) scale(${n(2.2 - 1.2 * slam, 3)})`, opacity: n(slam, 3), fontFamily: "Oswald, sans-serif", fontWeight: 600, fontSize: 72, letterSpacing: 6, color: "#ff5a5f" })}">KASUS DITUTUP</div>
<div style="font-family:'JetBrains Mono',monospace;font-weight:500;font-size:26px;letter-spacing:2px;color:#8d8a84">KASUS #01 · NASI GORENG</div></div>`;
        return F1.join(
          C.stage(f, D, BG(f, coinsUp, shield, sprout), {
            zoom: 0.05,
            shots: [
              { at: 0, scale: 1.18, ox: 30, oy: 58 },
              { at: F1.wordFrame(S, "Uangmu"), scale: 1.3, ox: 42, oy: 56, ease: 14 },
              { at: legal - 4, scale: 1, ox: 40, oy: 45 },
              { at: F1.wordFrame(S, "bayar"), scale: 1.1, ox: 50, oy: 60 },
              { at: F1.wordFrame(S, "Kasus"), scale: 1.25, ox: 60, oy: 40, ease: 20 },
            ],
          }),
          C.vignette(0.3, "50% 50%", 55),
          C.tag(f, { at: legal, x: 280, y: 860, rot: -3, text: "LEGAL &amp; DIAWASI OJK" }),
          C.hud(f, { at: 4, kicker: "VONIS", big: f < tumbuh ? "JANGAN DIAM" : "TUMBUH ≥ INFLASI", sub: "BUKAN SARAN INVESTASI", bigSize: 56 }),
          C.cast(S, f, [
            { src: C.CAST.muklisSenyum, x: 830, y: 1200, w: 360, at: 0 },
            { src: C.CAST.beni, x: 540, y: 1210, w: 380 },
            { src: C.CAST.nisa, x: 540, y: 1210, w: 380 },
          ]),
          end,
        );
      });
    })();
  </script>
</template>
