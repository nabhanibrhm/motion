<!-- Vonis: a checklist card ticks the three tips on Muklis's words ("kemungkinan" = MASIH PADAT, "Berangkat" = BERANGKAT LEBIH PAGI, "pantau" = PANTAU INFO RESMI KAI COMMUTER) over a dawn window where a trainset waits, then pulls out on "pagi" while the sun rises. Beni closes the case: warm paper from "ditutup", KASUS DITUTUP stamp, "KASUS #10 · KRL", slogan KERETA BARU, TAPI KAPAN?, the comment question on "Kamu" (BEKAS / BARU light up on their words), SUMBER LENGKAP DI DESKRIPSI on "Tulis". After Beni's last word a title-only cover card (TikTok cover). No numbers, so no source line. Muklis, Beni. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #f1e7d3;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="vonis" data-width="1080" data-height="1920">
    <div id="vonis-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="vonis-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="20" data-volume="0.22"></audio>
    <audio data-hf-media-start-basis="local" data-start="3" id="vonis-sfx-1" class="clip" src="public/sfx/click.wav" data-at="word:kemungkinan" data-track-index="12" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="5" id="vonis-sfx-2" class="clip" src="public/sfx/click.wav" data-at="word:Berangkat" data-track-index="13" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="7" id="vonis-sfx-3" class="clip" src="public/sfx/click.wav" data-at="word:pantau" data-track-index="14" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="8" id="vonis-sfx-go" class="clip" src="public/sfx/whoosh.wav" data-at="word:pagi" data-track-index="15" data-volume="0.16"></audio>
    <audio data-hf-media-start-basis="local" data-start="10.4" id="vonis-sfx-stamp" class="clip" src="public/sfx/stamp.wav" data-at="word:ditutup" data-track-index="16" data-volume="0.45"></audio>
    <audio data-hf-media-start-basis="local" data-start="10.9" id="vonis-sfx-slogan" class="clip" src="public/sfx/pop-in.wav" data-at="word:ditutup+16" data-track-index="17" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="11.4" id="vonis-sfx-ask" class="clip" src="public/sfx/pop-in.wav" data-at="word:Kamu" data-track-index="18" data-volume="0.09"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const RED = "#d0413a";
      // generic KRL trainset, side view, facing right: white/silver body, red-yellow stripe, packed windows, spinning wheels, pantograph.
      // (x, y) = left end of the first car at rail level; wheel = wheel angle in degrees; pure function of f.
      const TRAIN = (f, { x, y, cars = 3, s = 1, body = "#f4f1ea", stripe = RED, pack = 0.6, seed = 1, wheel = 0, sway = 1 }) => {
        const CW = 260;
        const GAP = 8;
        let out = "";
        for (let c = 0; c < cars; c++) {
          const sw = sway * Math.sin(f * 0.21 + c * 1.3);
          let wins = "";
          [10, 94, 132, 216].forEach((wx, k) => {
            const h = (j) => W.hash(seed * 97 + c * 13 + k * 5 + j);
            wins += `<rect x="${wx}" y="-118" width="34" height="42" rx="6" fill="#cfe3ee" stroke="${INK}" stroke-width="3"/>`;
            [0, 1].forEach((j) => {
              if (h(j) < pack) {
                const px = wx + 10 + 14 * j;
                const col = h(j + 3) < 0.5 ? "#3a3a40" : "#5a4a44";
                wins += `<circle cx="${px}" cy="-99" r="6.5" fill="${col}"/><path d="M${px - 9} -76 Q${px - 9} -90 ${px} -90 Q${px + 9} -90 ${px + 9} -76 Z" fill="${col}"/>`;
              }
            });
          });
          [52, 170].forEach((dx, k) => {
            const has = W.hash(seed * 31 + c * 7 + k) < pack;
            wins += `<rect x="${dx}" y="-120" width="34" height="90" rx="4" fill="#d8dcdf" stroke="${INK}" stroke-width="3"/><line x1="${dx + 17}" y1="-120" x2="${dx + 17}" y2="-30" stroke="${INK}" stroke-width="3"/><rect x="${dx + 4}" y="-112" width="10" height="30" rx="3" fill="#cfe3ee"/><rect x="${dx + 20}" y="-112" width="10" height="30" rx="3" fill="#cfe3ee"/>${has ? `<circle cx="${dx + 9}" cy="-98" r="5" fill="#3a3a40"/><path d="M${dx + 1} -82 Q${dx + 1} -92 ${dx + 9} -92 Q${dx + 17} -92 ${dx + 17} -82 Z" fill="#3a3a40"/>` : ""}`;
          });
          const wheels = [44, 216].map((wx) => `<g transform="translate(${wx} -13) rotate(${n(wheel, 1)})"><circle r="13" fill="${INK}"/><circle r="5" fill="#9aa0a6"/><line x1="-11" y1="0" x2="11" y2="0" stroke="#9aa0a6" stroke-width="3"/><line x1="0" y1="-11" x2="0" y2="11" stroke="#9aa0a6" stroke-width="3"/></g>`).join("");
          const pan = c === Math.min(1, cars - 1) ? `<path d="M110 -146 L130 -176 L150 -146 M118 -160 L142 -160" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 -178 H148" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>` : "";
          const nose = c === cars - 1 ? `<circle cx="252" cy="-62" r="5" fill="#ffe9a0" stroke="${INK}" stroke-width="2"/>` : "";
          out += `<g transform="translate(${n(c * (CW + GAP))} ${n(0.8 * sw, 2)}) rotate(${n(0.25 * sw, 2)} 130 0)"><rect x="14" y="-30" width="232" height="10" rx="3" fill="${INK}"/>${wheels}<rect x="0" y="-136" width="${CW}" height="108" rx="16" fill="${body}" stroke="${INK}" stroke-width="5"/><rect x="18" y="-146" width="224" height="12" rx="5" fill="#b9bec2" stroke="${INK}" stroke-width="3"/>${wins}<rect x="3" y="-56" width="254" height="9" fill="${stripe}"/><rect x="3" y="-47" width="254" height="5" fill="#f2b632"/>${pan}${nose}</g>`;
        }
        return `<g transform="translate(${n(x)} ${n(y)}) scale(${n(s, 3)})">${out}</g>`;
      };
      const RAIL = (y, x0 = 0, x1 = 1080, shift = 0) => {
        let t = "";
        for (let k = -1; k < Math.ceil((x1 - x0) / 56) + 1; k++) t += `<rect x="${n(x0 + k * 56 + (shift % 56))}" y="${y + 6}" width="30" height="9" fill="#8a6f55"/>`;
        return `<g>${t}<rect x="${x0}" y="${y}" width="${x1 - x0}" height="7" fill="#6d6a6c"/></g>`;
      };
      const ITEMS = ["KEMUNGKINAN MASIH PADAT", "BERANGKAT LEBIH PAGI", "PANTAU INFO RESMI KAI COMMUTER"];
      const LIST = (f, o) => `<g transform="translate(60 320)"><rect x="0" y="0" width="960" height="440" rx="22" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<text x="44" y="70" font-family="Oswald" font-weight="600" font-size="44" letter-spacing="4" fill="${INK}">BUAT PENUMPANG KRL</text>
${ITEMS.map((t, i) => {
  const p = F1.ramp(f, o.ticks[i] - 2, 10, F1.expoOut);
  const y = 112 + 100 * i;
  return `<g opacity="${n(0.3 + 0.7 * p, 3)}" transform="translate(${n(-20 * (1 - p))} 0)"><rect x="40" y="${y + 6}" width="58" height="58" rx="10" fill="#fff" stroke="${INK}" stroke-width="5"/>${p > 0 ? `<path d="M52 ${y + 36} L68 ${y + 52} L90 ${y + 18}" stroke="#4e8a4f" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="64" stroke-dashoffset="${n(64 * (1 - p))}"/>` : ""}<text x="122" y="${y + 47}" font-family="Oswald" font-weight="600" font-size="${i === 2 ? 38 : 42}" letter-spacing="1" fill="${i === 0 ? RED : INK}">${t}</text></g>`;
}).join("")}</g>`;
      const PERSON = (f, x, y, k, col) => `<g transform="translate(${n(x)} ${n(y + 1.5 * Math.sin(f * 0.07 + k))})"><circle cx="0" cy="-86" r="12" fill="${col}"/><path d="M-15 -4 L-13 -66 Q-13 -74 0 -74 Q13 -74 13 -66 L15 -4 Z" fill="${col}"/></g>`;
      const DAWN = (f, o) => {
        const sunY = 230 - 70 * o.sun;
        const x = 120 + 1000 * o.go;
        const px = [800, 850, 905];
        return `<g transform="translate(60 810)"><clipPath id="vonis-clip"><rect width="960" height="360" rx="24"/></clipPath><g clip-path="url(#vonis-clip)">
<defs><linearGradient id="vonis-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa9c9"/><stop offset="0.55" stop-color="#f6c48e"/><stop offset="1" stop-color="#fbe3b6"/></linearGradient></defs>
<rect width="960" height="360" fill="url(#vonis-sky)"/>
<circle cx="700" cy="${n(sunY)}" r="${n(60 + 6 * Math.sin(f * 0.05), 1)}" fill="#fff1c9" opacity="0.95"/><circle cx="700" cy="${n(sunY)}" r="120" fill="#fff1c9" opacity="0.25"/>
<g fill="#7a7f96" opacity="0.8"><rect x="30" y="180" width="70" height="140"/><rect x="110" y="140" width="56" height="180"/><rect x="176" y="200" width="90" height="120"/><rect x="290" y="160" width="60" height="160"/><rect x="520" y="190" width="80" height="130"/><rect x="620" y="170" width="64" height="150"/></g>
<rect x="0" y="300" width="960" height="60" fill="#a7a0a2"/>
<rect x="0" y="162" width="960" height="3" fill="#4a484c"/>
${RAIL(298, 0, 960, 0)}
${TRAIN(f, { x, y: 298, cars: 3, s: 0.78, pack: 0.7, seed: 41, wheel: x * 3.6, sway: o.go > 0 ? 1.5 : 0.4 })}
<rect x="0" y="312" width="960" height="48" fill="#c8bfb0"/><rect x="0" y="312" width="960" height="5" fill="#8a8274"/>
${px.map((p, k) => PERSON(f, p, 352, k, k % 2 ? "#3a3a40" : "#5a4a44")).join("")}
</g><rect width="960" height="360" rx="24" fill="none" stroke="${INK}" stroke-width="6"/></g>`;
      };
      const BG = (f, o) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="vonis-glow" cx="50%" cy="38%" r="62%"><stop offset="0" stop-color="#fff1d4"/><stop offset="1" stop-color="#ead9bb"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#vonis-glow)"/>
${DRIFT(f, { seed: 710, count: 7, y0: 420, y1: 1050, color: "#f2c27a", a: 0.26 })}
${SWEEP(f, { color: "#ffffff", a: 0.22, y0: 300, y1: 1100 })}
${W.dust(f, { x: 120, y: 340, w: 840, h: 800, count: 16, seed: 11, color: "#fff3cf", alpha: 0.45 })}
${LIST(f, o)}${DAWN(f, o)}</svg>`;
      // background-only ambient motion: deterministic, continuous in f (works with fractional frames at 60 fps)
      const DRIFT = (f, { seed, count, y0, y1, color, a }) => `<g fill="${color}" opacity="${a}">${Array.from({ length: count }, (_, i) => { const h = (k) => F1.world.hash(seed + i * 5 + k); return `<circle cx="${F1.n(60 + 960 * h(1) + 26 * Math.sin(f * 0.035 * (0.6 + h(2)) + h(3) * 6.28), 1)}" cy="${F1.n(y0 + (y1 - y0) * h(4) + 34 * Math.sin(f * 0.026 * (0.6 + h(5)) + h(6) * 6.28), 1)}" r="${F1.n(8 + 18 * h(7), 1)}"/>`; }).join("")}</g>`;
      const SWEEP = (f, { color, a, y0, y1 }) => `<g style="filter:blur(26px)" opacity="${F1.n(a * (0.65 + 0.35 * Math.sin(f * 0.021)), 3)}" transform="translate(${F1.n(-260 + 1000 * (0.5 + 0.5 * Math.sin(f * 0.0175)), 1)} 0)"><polygon points="0,${y0} 200,${y0} 100,${y1} -100,${y1}" fill="${color}"/></g>`;
      window.__timelines["vonis"] = F1.scene("vonis", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, occ = 0) => F1.wordFrame(S, x, occ);
        const ticks = [w("kemungkinan"), w("Berangkat"), w("pantau")];
        const pagi = w("pagi");
        const ditutup = w("ditutup");
        const kamu = w("Kamu");
        const bekas = w("bekas");
        const baru = w("baru");
        const tulis = w("Tulis");
        const o = {
          ticks,
          sun: F1.ramp(f, 0, 300, (u) => u),
          go: F1.ramp(f, pagi, 80, (u) => u * u * u),
        };
        const paper = F1.ramp(f, ditutup - 6, 8);
        const slam = F1.ramp(f, ditutup, 8, F1.expoOut);
        const slogan = F1.ramp(f, ditutup + 16, 12, F1.expoOut);
        const ask = F1.ramp(f, kamu, 12, F1.expoOut);
        const src = F1.ramp(f, tulis, 10, F1.expoOut);
        const mono = "font-family:'JetBrains Mono',monospace";
        const hot = (p, base, color) => (p > 0 ? color : base);
        const end =
          paper <= 0
            ? ""
            : `<div style="${F1.css({ position: "absolute", inset: 0, background: "#f6efe1", opacity: n(paper, 3) })}"></div>
<div style="${F1.css({ position: "absolute", left: 0, right: 0, top: 330, display: "flex", flexDirection: "column", alignItems: "center", gap: 22, opacity: n(paper, 3) })}">
<div style="${F1.css({ marginTop: 56, padding: "12px 30px", border: "6px solid #c0392b", borderRadius: 12, transform: `rotate(-6deg) scale(${n(2.2 - 1.2 * slam, 3)})`, opacity: n(slam, 3), fontFamily: "Oswald, sans-serif", fontWeight: 600, fontSize: 72, letterSpacing: 6, color: "#c0392b" })}">KASUS DITUTUP</div>
<div style="${mono};font-weight:500;font-size:26px;letter-spacing:2px;color:#6f6a66">KASUS #10 · KRL</div>
<div style="${F1.css({ marginTop: 6, padding: "18px 38px", borderRadius: 18, background: "#fffaf0", border: "6px solid #2a2a2e", textAlign: "center", opacity: n(slogan, 3), transform: `translateY(${n(30 * (1 - slogan))}px) rotate(-1.5deg)` })}"><div style="font-family:Oswald,sans-serif;font-weight:700;font-size:62px;line-height:1.3;letter-spacing:2px;color:#2a2a2e">KERETA BARU,<br>TAPI <span style="background:${C.ACCENT};padding:0 12px;border-radius:10px">KAPAN?</span></div></div>
<div style="${F1.css({ marginTop: 14, padding: "24px 40px", borderRadius: 20, background: "#2a2a2e", textAlign: "center", opacity: n(ask, 3), transform: `translateY(${n(30 * (1 - ask))}px)` })}"><div style="${mono};font-weight:700;font-size:24px;letter-spacing:2px;color:#ff5a5f">● TULIS DI KOMENTAR</div><div style="font-family:Oswald,sans-serif;font-weight:600;font-size:58px;line-height:1.15;color:#fff"><span style="color:${hot(F1.ramp(f, bekas, 6), "#fff", "#ff7a70")}">BEKAS</span> TAPI CEPAT<br>ATAU <span style="color:${hot(F1.ramp(f, baru, 6), "#fff", C.ACCENT)}">BARU</span> TAPI LAMA?</div></div>
<div style="${mono};font-weight:500;font-size:20px;letter-spacing:1px;color:#6f6a66;opacity:${n(src, 3)}">SUMBER LENGKAP DI DESKRIPSI</div></div>`;
        // Title-only cover card over the outro tail (after Beni's last word), for TikTok's "Select cover".
        // Text stays inside the centred 3:4 crop (y 240-1680) used by the profile grid.
        const lastEnd = F1.line(S, 1).end;
        const cv = F1.ramp(f, lastEnd + 4, 5);
        const car = (i) => `<g transform="translate(${i * 94} 0)"><rect x="0" y="-62" width="88" height="46" rx="8" fill="#f4f1ea" stroke="#2a2a2e" stroke-width="5"/><rect x="8" y="-54" width="20" height="18" rx="3" fill="#cfe3ee"/><rect x="34" y="-54" width="20" height="18" rx="3" fill="#cfe3ee"/><rect x="60" y="-54" width="20" height="18" rx="3" fill="#cfe3ee"/><rect x="3" y="-30" width="82" height="7" fill="#d0413a"/><circle cx="20" cy="-12" r="9" fill="#2a2a2e"/><circle cx="68" cy="-12" r="9" fill="#2a2a2e"/></g>`;
        const cover =
          cv <= 0
            ? ""
            : `<div style="${F1.css({ position: "absolute", inset: 0, zIndex: 50, background: "#f1e7d3", opacity: n(cv, 3), display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 30 })}">
<div style="${F1.css({ padding: "10px 26px", border: "6px solid #c0392b", borderRadius: 12, transform: "rotate(-5deg)", fontFamily: "Oswald, sans-serif", fontWeight: 600, fontSize: 52, letterSpacing: 6, color: "#c0392b" })}">KASUS #10</div>
<div style="${F1.css({ textAlign: "center", fontFamily: "Oswald, sans-serif", fontWeight: 700, color: "#2a2a2e", lineHeight: 1.04, letterSpacing: 2 })}"><div style="font-size:84px;color:#6f6a66">IMPOR KRL BEKAS BATAL</div><div style="font-size:124px;margin-top:26px">KERETA BARU,</div><div style="font-size:124px">TAPI <span style="display:inline-block;line-height:1.1;color:#fff;background:#d0413a;padding:0 18px;border-radius:16px">KAPAN?</span></div></div>
<svg width="300" height="90" viewBox="0 -70 290 80"><g>${car(0)}${car(1)}${car(2)}</g></svg></div>`;
        return F1.join(
          C.stage(f, D, BG(f, o), {
            zoom: 0.04,
            shots: [
              { at: 0, scale: 1.04, ox: 50, oy: 40 },
              { at: ticks[1], scale: 1.06, ox: 50, oy: 56, ease: 14 },
              { at: F1.line(S, 1).start, scale: 1.05, ox: 60, oy: 55, ease: 14 },
            ],
          }),
          C.vignette(0.22, "50% 58%", 55),
          end,
          C.progress(f, { step: 7, label: "VONIS" }),
          C.cast(S, f, [
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.beni, x: 540, y: 1200, w: 400 },
          ]),
          cover,
        );
      });
    })();
  </script>
</template>
