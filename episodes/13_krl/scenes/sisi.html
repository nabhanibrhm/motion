<!-- Sisi (SISI LAIN): a balance scale with two equal cards. Left "KRL BEKAS" (used grey-green trainset, +-10 TAHUN PAKAI on "sepuluh", source Kompas); right "KRL BARU" (white-and-red trainset, INDUSTRI DALAM NEGERI on "industri", KERJA SAMA INKA x PABRIK LUAR NEGERI on "kerja", sources CNBC, IDN Times). The beam leans to the left while only the used card shows, then settles level with a small wobble: neutral. Muklis only. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #f1e7d3;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="sisi" data-width="1080" data-height="1920">
    <div id="sisi-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="sisi-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="20" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="1" id="sisi-sfx-l" class="clip" src="public/sfx/pop-in.wav" data-at="word:bekas" data-track-index="12" data-volume="0.13"></audio>
    <audio data-hf-media-start-basis="local" data-start="2" id="sisi-sfx-10" class="clip" src="public/sfx/click.wav" data-at="word:sepuluh" data-track-index="13" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="3" id="sisi-sfx-r" class="clip" src="public/sfx/pop-in.wav" data-at="word:Pesanan" data-track-index="14" data-volume="0.13"></audio>
    <audio data-hf-media-start-basis="local" data-start="4" id="sisi-sfx-ind" class="clip" src="public/sfx/click.wav" data-at="word:industri" data-track-index="15" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="5" id="sisi-sfx-kerja" class="clip" src="public/sfx/click.wav" data-at="word:kerja" data-track-index="16" data-volume="0.25"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const RED = "#d0413a";
      const GREEN = "#4e8a4f";
      const SUB = "#8a6f55";
      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      // background-only ambient motion: deterministic, continuous in f (works with fractional frames at 60 fps)
      const DRIFT = (f, { seed, count, y0, y1, color, a }) => `<g fill="${color}" opacity="${a}">${Array.from({ length: count }, (_, i) => { const h = (k) => F1.world.hash(seed + i * 5 + k); return `<circle cx="${F1.n(60 + 960 * h(1) + 26 * Math.sin(f * 0.035 * (0.6 + h(2)) + h(3) * 6.28), 1)}" cy="${F1.n(y0 + (y1 - y0) * h(4) + 34 * Math.sin(f * 0.026 * (0.6 + h(5)) + h(6) * 6.28), 1)}" r="${F1.n(8 + 18 * h(7), 1)}"/>`; }).join("")}</g>`;
      const SWEEP = (f, { color, a, y0, y1 }) => `<g style="filter:blur(26px)" opacity="${F1.n(a * (0.65 + 0.35 * Math.sin(f * 0.021)), 3)}" transform="translate(${F1.n(-260 + 1000 * (0.5 + 0.5 * Math.sin(f * 0.0175)), 1)} 0)"><polygon points="0,${y0} 200,${y0} 100,${y1} -100,${y1}" fill="${color}"/></g>`;
      const mix = (a, b, p) => {
        const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
        const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
        return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * p)).join(",")})`;
      };
      const CLOTH = ["#3f78b5", "#c0563f", "#5b8a5f", "#8a6f55", "#6b5b95", "#d9a441", "#3d4a5c"];
      const SKIN = ["#a8724c", "#d9a77d", "#8a5a3c"];
      // a generic commuter trainset in side view (white/silver body, red-and-yellow stripe, no logos).
      // (x, y) = left end and top of the rail; `wheel` in degrees; riders = share of window slots with a standing passenger
      const TRAIN = (f, o) => {
        const { x, y, cars = 3, w = 250, s = 1, body = "#eef0f2", stripe = RED, sway = 0, wheel = 0, riders = 0.6, seed = 1, ghost = false, wheels = true, op = 1, pant = true } = o;
        const gap = 6;
        const sk = ghost ? `stroke="${INK}" stroke-width="5" stroke-dasharray="14 10"` : `stroke="${INK}" stroke-width="5"`;
        let out = "";
        for (let c = 0; c < cars; c++) {
          let g = `<g transform="translate(${c * (w + gap)} 0)">`;
          if (c < cars - 1) g += `<rect x="${w - 2}" y="-62" width="${gap + 4}" height="16" fill="#555" stroke="${INK}" stroke-width="3"/>`;
          if (wheels) {
            for (const bx of [w * 0.2, w * 0.8]) {
              for (const dx of [-17, 17]) {
                g += `<g transform="translate(${n(bx + dx)} -14)"><circle r="14" fill="#3b3d44" stroke="${INK}" stroke-width="3"/><g transform="rotate(${n(wheel, 1)})"><line x1="-11" y1="0" x2="11" y2="0" stroke="#d9d4c8" stroke-width="3"/><line x1="0" y1="-11" x2="0" y2="11" stroke="#d9d4c8" stroke-width="3"/></g><circle r="3" fill="#d9d4c8"/></g>`;
              }
            }
          }
          g += `<rect x="6" y="-30" width="${w - 12}" height="14" rx="4" fill="#4a4d55" ${ghost ? "opacity=\"0.4\"" : ""}/>`;
          g += `<rect x="0" y="-152" width="${w}" height="124" rx="18" fill="${ghost ? "rgba(255,250,240,0.4)" : body}" ${sk}/>`;
          if (!ghost) {
            g += `<rect x="3" y="-66" width="${w - 6}" height="15" fill="${stripe}"/><rect x="3" y="-49" width="${w - 6}" height="7" fill="#f2c14e"/>`;
          }
          // doors
          const dx0 = w * 0.4;
          g += `<rect x="${dx0}" y="-138" width="${w * 0.2}" height="106" rx="5" fill="${ghost ? "none" : "#dfe3e6"}" stroke="${INK}" stroke-width="3"/><line x1="${dx0 + w * 0.1}" y1="-136" x2="${dx0 + w * 0.1}" y2="-34" stroke="${INK}" stroke-width="3"/>`;
          // windows with standing passengers
          const wxs = [w * 0.05, w * 0.22, w * 0.66, w * 0.83];
          wxs.forEach((wx, wi) => {
            g += `<rect x="${n(wx)}" y="-136" width="34" height="50" rx="6" fill="#bfe3ee" stroke="${INK}" stroke-width="3"/>`;
            if (ghost) return;
            for (let k = 0; k < 2; k++) {
              const h = (j) => W.hash(seed * 31 + c * 17 + wi * 5 + k * 3 + j);
              if (h(1) > riders) continue;
              const px = wx + (k ? 23 : 11);
              g += `<path d="M${n(px - 9)} -87 Q${n(px - 9)} -101 ${n(px)} -101 Q${n(px + 9)} -101 ${n(px + 9)} -87 Z" fill="${CLOTH[Math.floor(h(2) * CLOTH.length)]}"/><circle cx="${n(px)}" cy="-111" r="8" fill="${SKIN[Math.floor(h(3) * SKIN.length)]}"/>`;
            }
          });
          g += `<rect x="${w * 0.04}" y="-164" width="${w * 0.2}" height="12" rx="4" fill="#c4c8cc" stroke="${INK}" stroke-width="3"/><rect x="${w * 0.74}" y="-164" width="${w * 0.2}" height="12" rx="4" fill="#c4c8cc" stroke="${INK}" stroke-width="3"/>`;
          if (pant && c === Math.min(1, cars - 1)) {
            g += `<path d="M${w / 2 - 26} -152 L${w / 2 - 4} -190 L${w / 2 + 22} -152" fill="none" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M${w / 2 - 34} -192 H${w / 2 + 30}" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`;
          }
          if (c === cars - 1) g += `<circle cx="${w - 9}" cy="-52" r="6" fill="#ffe08a" stroke="${INK}" stroke-width="2"/>`;
          out += g + "</g>";
        }
        return `<g opacity="${n(op, 3)}" transform="translate(${n(x, 1)} ${n(y + sway, 1)}) scale(${n(s, 3)})">${out}</g>`;
      };
      const RAIL = (y) => `<rect x="0" y="${y}" width="1080" height="48" fill="#b9a27d"/>${Array.from({ length: 25 }, (_, i) => `<rect x="${i * 46 + 6}" y="${y + 14}" width="30" height="12" rx="2" fill="#8a6f55"/>`).join("")}<rect x="0" y="${y}" width="1080" height="8" fill="#6b6f78"/><rect x="0" y="${y - 2}" width="1080" height="3" fill="${INK}"/>`;
      const SPARKS = (f, { x, y, seed, count = 9, color = "#ffb703" }) => `<g fill="${color}">${Array.from({ length: count }, (_, i) => {
        const h = (k) => W.hash(seed + i * 7 + k);
        const age = (((f * 0.06 + h(1) * 3) % 1) + 1) % 1;
        const a = -0.4 - h(2) * 2.3;
        const sp = 40 + h(3) * 90;
        return `<circle cx="${n(x + Math.cos(a) * sp * age * 1.2, 1)}" cy="${n(y + Math.sin(a) * sp * age + 140 * age * age, 1)}" r="${n(4.5 * (1 - age) + 1, 1)}" opacity="${n(1 - age, 2)}"/>`;
      }).join("")}<circle cx="${x}" cy="${y}" r="${n(9 + 3 * Math.sin(f * 1.7), 1)}" fill="#fff4c2"/></g>`;
      const CARD = (x, y, w, h, p, inner, fill = "#fffaf0") => (p <= 0 ? "" : `<g opacity="${n(clamp01(p), 3)}" transform="translate(${n(x)} ${n(y + 34 * (1 - p), 1)})"><rect x="0" y="0" width="${w}" height="${h}" rx="18" fill="${fill}" stroke="${INK}" stroke-width="6"/>${inner}</g>`);
      const SRC = (x, y, text) => `<text x="${x}" y="${y}" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="${SUB}">Sumber: ${text}</text>`;
      const OSW = (x, y, size, text, fill = INK, extra = "") => `<text x="${x}" y="${y}" font-family="Oswald" font-weight="600" font-size="${size}" letter-spacing="1" fill="${fill}" ${extra}>${text}</text>`;
      const PAN = (f, side, p, l1, l2) => {
        const used = side === "L";
        const train = TRAIN(f, { x: 102, y: 196, cars: 1, s: 0.9, body: used ? "#d5d9d3" : "#eef0f2", stripe: used ? GREEN : RED, riders: used ? 0.4 : 0.2, seed: used ? 3 : 8, wheel: f * 0.6, sway: 0.8 * Math.sin(f * 0.3 + (used ? 0 : 2)) });
        const title = used ? "KRL BEKAS" : "KRL BARU";
        return `${train}<line x1="30" y1="222" x2="400" y2="222" stroke="${INK}" stroke-width="3" opacity="0.25"/>${OSW(215, 284, 58, title, used ? "#6b5b45" : RED, 'text-anchor="middle" font-weight="700" letter-spacing="3"')}
${l1 > 0 ? `<g opacity="${n(l1, 3)}">${used ? OSW(215, 344, 40, "±10 TAHUN PAKAI", INK, 'text-anchor="middle"') : OSW(215, 344, 36, "INDUSTRI DALAM NEGERI", INK, 'text-anchor="middle"')}</g>` : ""}
${l2 > 0 ? `<g opacity="${n(l2, 3)}">${OSW(215, 388, 28, "KERJA SAMA INKA ×", GREEN, 'text-anchor="middle"')}${OSW(215, 422, 28, "PABRIK LUAR NEGERI", GREEN, 'text-anchor="middle"')}</g>` : ""}
<text x="215" y="${used ? 400 : 462}" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="${SUB}">Sumber: ${used ? "Kompas" : "CNBC, IDN Times"}</text>`;
      };
      const BG = (f, o) => {
        const th = (o.tilt * Math.PI) / 180;
        const lx = 540 - 285 * Math.cos(th);
        const ly = 470 + 285 * Math.sin(th);
        const rx = 540 + 285 * Math.cos(th);
        const ry = 470 - 285 * Math.sin(th);
        const pan = (x, y, p, side, l1, l2) => {
          if (p <= 0) return "";
          const top = y + 120;
          return `<g opacity="${n(clamp01(p * 1.5), 3)}"><path d="M${n(x)} ${n(y)} L${n(x - 160)} ${n(top)} M${n(x)} ${n(y)} L${n(x + 160)} ${n(top)}" stroke="${INK}" stroke-width="5" fill="none"/><g transform="translate(${n(x - 215)} ${n(top + 14 * (1 - p), 1)})"><rect x="0" y="0" width="430" height="480" rx="18" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>${PAN(f, side, p, l1, l2)}</g></g>`;
        };
        return `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#f1e7d3"/>
${DRIFT(f, { seed: 470, count: 7, y0: 420, y1: 1050, color: "#f2c27a", a: 0.26 })}
${SWEEP(f, { color: "#fffaf0", a: 0.22, y0: 300, y1: 1100 })}
<rect x="0" y="1130" width="1080" height="790" fill="#cdb898"/>
<path d="M520 480 H560 V1110 H520 Z" fill="#8a6f55" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
<path d="M400 1130 L430 1090 H650 L680 1130 Z" fill="#6b5b45" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
<line x1="${n(lx)}" y1="${n(ly)}" x2="${n(rx)}" y2="${n(ry)}" stroke="${INK}" stroke-width="18" stroke-linecap="round"/>
<line x1="${n(lx)}" y1="${n(ly)}" x2="${n(rx)}" y2="${n(ry)}" stroke="#d9a441" stroke-width="8" stroke-linecap="round"/>
<circle cx="540" cy="470" r="28" fill="#d9a441" stroke="${INK}" stroke-width="6"/>
${pan(lx, ly, o.pl, "L", o.l1, 0)}${pan(rx, ry, o.pr, "R", o.r1, o.r2)}
</svg>`;
      };
      window.__timelines["sisi"] = F1.scene("sisi", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, occ = 0) => F1.wordFrame(S, x, occ);
        const bekas = w("bekas");
        const puluh = w("sepuluh");
        const baru = w("Pesanan");
        const ind = w("industri");
        const kerja = w("kerja");
        const pr = F1.ramp(f, baru, 12, F1.expoOut);
        const tr = f - (baru + 12);
        const tilt = 4.5 * F1.ramp(f, bekas, 14, F1.easeOut) * (1 - pr) + (tr >= 0 ? 5 * Math.exp(-tr / 18) * Math.sin(tr * 0.32) : 0);
        const o = {
          tilt,
          pl: F1.ramp(f, bekas, 12, F1.expoOut),
          pr,
          l1: F1.ramp(f, puluh, 10, F1.expoOut),
          r1: F1.ramp(f, ind, 10, F1.expoOut),
          r2: F1.ramp(f, kerja, 10, F1.expoOut),
        };
        return F1.join(
          C.stage(f, D, BG(f, o), {
            zoom: 0.025,
            shots: [
              { at: 0, scale: 1.0, ox: 50, oy: 40 },
              { at: bekas - 4, scale: 1.03, ox: 30, oy: 50, ease: 12 },
              { at: baru - 4, scale: 1.03, ox: 70, oy: 50, ease: 12 },
              { at: kerja - 8, scale: 1.0, ox: 50, oy: 50, ease: 14 },
            ],
          }),
          C.vignette(0.22, "50% 58%", 55),
          C.progress(f, { step: 6, label: "SISI LAIN" }),
          C.chip(f, { at: 4, text: "SISI LAIN" }),
          C.cast(S, f, [{ src: C.CAST.muklis, x: 540, y: 1200, w: 380, at: 0 }]),
        );
      });
    })();
  </script>
</template>
