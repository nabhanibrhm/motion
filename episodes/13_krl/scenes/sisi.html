<!-- Sisi (SISI LAIN): a "cepat tapi bekas vs baru tapi lama" dilemma. Nisa asks "kenapa" (question banner); on "seratus" a counter counts up to 102 RANGKAIAN (a count only, never a need figure; "kurang" adds KURANG DARI KEBUTUHAN, source Fortune IDN); on "bekas" (2nd) the left card KRL BEKAS appears, "bulan" reveals 1-2 BULAN; on "baru" the right card KRL BARU, "tahun" reveals 1-2 TAHUN (source Katadata, iNews). On "transisi" the cards give way to a timeline bar, "sepuluh" shows +-10 TAHUN; then Pesanan / industri / kerja build three rows: PESANAN BARU, INDUSTRI DALAM NEGERI, KERJA SAMA INKA x PABRIK LUAR NEGERI (sources CNBC, IDN Times). Nisa then Muklis. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #dfe8ee;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="sisi" data-width="1080" data-height="1920">
    <div id="sisi-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="1" id="sisi-sfx-102" class="clip" src="public/sfx/ding.wav" data-at="word:seratus" data-track-index="12" data-volume="0.18"></audio>
    <audio data-hf-media-start-basis="local" data-start="2" id="sisi-sfx-l" class="clip" src="public/sfx/pop-in.wav" data-at="word:bekas+1" data-track-index="13" data-volume="0.13"></audio>
    <audio data-hf-media-start-basis="local" data-start="3" id="sisi-sfx-bln" class="clip" src="public/sfx/click.wav" data-at="word:bulan" data-track-index="14" data-volume="0.22"></audio>
    <audio data-hf-media-start-basis="local" data-start="4" id="sisi-sfx-r" class="clip" src="public/sfx/pop-in.wav" data-at="word:baru" data-track-index="15" data-volume="0.13"></audio>
    <audio data-hf-media-start-basis="local" data-start="5" id="sisi-sfx-thn" class="clip" src="public/sfx/click.wav" data-at="word:tahun+0" data-track-index="16" data-volume="0.22"></audio>
    <audio data-hf-media-start-basis="local" data-start="6" id="sisi-sfx-trans" class="clip" src="public/sfx/whoosh.wav" data-at="word:transisi" data-track-index="17" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="7" id="sisi-sfx-10" class="clip" src="public/sfx/click.wav" data-at="word:sepuluh" data-track-index="18" data-volume="0.22"></audio>
    <audio data-hf-media-start-basis="local" data-start="8" id="sisi-sfx-pes" class="clip" src="public/sfx/pop-in.wav" data-at="word:Pesanan" data-track-index="19" data-volume="0.13"></audio>
    <audio data-hf-media-start-basis="local" data-start="9" id="sisi-sfx-ind" class="clip" src="public/sfx/click.wav" data-at="word:industri" data-track-index="21" data-volume="0.22"></audio>
    <audio data-hf-media-start-basis="local" data-start="10" id="sisi-sfx-kerja" class="clip" src="public/sfx/click.wav" data-at="word:kerja" data-track-index="22" data-volume="0.22"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const RED = "#d0413a";
      const GREEN = "#4e8a4f";
      const SUB = "#5f7683";
      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      // background-only ambient motion: deterministic, continuous in f (works with fractional frames at 60 fps)
      const DRIFT = (f, { seed, count, y0, y1, color, a }) => `<g fill="${color}" opacity="${a}">${Array.from({ length: count }, (_, i) => { const h = (k) => F1.world.hash(seed + i * 5 + k); return `<circle cx="${F1.n(60 + 960 * h(1) + 26 * Math.sin(f * 0.035 * (0.6 + h(2)) + h(3) * 6.28), 1)}" cy="${F1.n(y0 + (y1 - y0) * h(4) + 34 * Math.sin(f * 0.026 * (0.6 + h(5)) + h(6) * 6.28), 1)}" r="${F1.n(8 + 18 * h(7), 1)}"/>`; }).join("")}</g>`;
      const SWEEP = (f, { color, a, y0, y1 }) => `<g style="filter:blur(26px)" opacity="${F1.n(a * (0.65 + 0.35 * Math.sin(f * 0.021)), 3)}" transform="translate(${F1.n(-260 + 1000 * (0.5 + 0.5 * Math.sin(f * 0.0175)), 1)} 0)"><polygon points="0,${y0} 200,${y0} 100,${y1} -100,${y1}" fill="${color}"/></g>`;
      const mix = (a, b, p) => {
        const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
        const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
        return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * p)).join(",")})`;
      };
      const CLOTH = ["#3f78b5", "#c0563f", "#5b8a5f", "#5f7683", "#6b5b95", "#d9a441", "#3d4a5c"];
      const SKIN = ["#a8724c", "#d9a77d", "#8a5a3c"];
      // a generic commuter trainset in side view (white/silver body, red-and-yellow stripe, no logos).
      // (x, y) = left end and top of the rail; `wheel` in degrees; riders = share of window slots with a standing passenger
      const TRAIN = (f, o) => {
        const { x, y, cars = 3, w = 250, s = 1, body = "#eef0f2", stripe = RED, sway = 0, wheel = 0, riders = 0.6, seed = 1, ghost = false, wheels = true, op = 1, pant = true } = o;
        const gap = 6;
        const sk = ghost ? `stroke="${INK}" stroke-width="5" stroke-dasharray="14 10"` : `stroke="${INK}" stroke-width="5"`;
        let out = "";
        for (let c = 0; c < cars; c++) {
          let g = `<g transform="translate(${c * (w + gap)} 0)">`;
          if (c < cars - 1) g += `<rect x="${w - 2}" y="-62" width="${gap + 4}" height="16" fill="#555" stroke="${INK}" stroke-width="3"/>`;
          if (wheels) {
            for (const bx of [w * 0.2, w * 0.8]) {
              for (const dx of [-17, 17]) {
                g += `<g transform="translate(${n(bx + dx)} -14)"><circle r="14" fill="#3b3d44" stroke="${INK}" stroke-width="3"/><g transform="rotate(${n(wheel, 1)})"><line x1="-11" y1="0" x2="11" y2="0" stroke="#d3d9dd" stroke-width="3"/><line x1="0" y1="-11" x2="0" y2="11" stroke="#d3d9dd" stroke-width="3"/></g><circle r="3" fill="#d3d9dd"/></g>`;
              }
            }
          }
          g += `<rect x="6" y="-30" width="${w - 12}" height="14" rx="4" fill="#4a4d55" ${ghost ? "opacity=\"0.4\"" : ""}/>`;
          g += `<rect x="0" y="-152" width="${w}" height="124" rx="18" fill="${ghost ? "rgba(243,247,250,0.4)" : body}" ${sk}/>`;
          if (!ghost) {
            g += `<rect x="3" y="-66" width="${w - 6}" height="15" fill="${stripe}"/><rect x="3" y="-49" width="${w - 6}" height="7" fill="#f2c14e"/>`;
          }
          // doors
          const dx0 = w * 0.4;
          g += `<rect x="${dx0}" y="-138" width="${w * 0.2}" height="106" rx="5" fill="${ghost ? "none" : "#dfe3e6"}" stroke="${INK}" stroke-width="3"/><line x1="${dx0 + w * 0.1}" y1="-136" x2="${dx0 + w * 0.1}" y2="-34" stroke="${INK}" stroke-width="3"/>`;
          // windows with standing passengers
          const wxs = [w * 0.05, w * 0.22, w * 0.66, w * 0.83];
          wxs.forEach((wx, wi) => {
            g += `<rect x="${n(wx)}" y="-136" width="34" height="50" rx="6" fill="#bfe3ee" stroke="${INK}" stroke-width="3"/>`;
            if (ghost) return;
            for (let k = 0; k < 2; k++) {
              const h = (j) => W.hash(seed * 31 + c * 17 + wi * 5 + k * 3 + j);
              if (h(1) > riders) continue;
              const px = wx + (k ? 23 : 11);
              g += `<path d="M${n(px - 9)} -87 Q${n(px - 9)} -101 ${n(px)} -101 Q${n(px + 9)} -101 ${n(px + 9)} -87 Z" fill="${CLOTH[Math.floor(h(2) * CLOTH.length)]}"/><circle cx="${n(px)}" cy="-111" r="8" fill="${SKIN[Math.floor(h(3) * SKIN.length)]}"/>`;
            }
          });
          g += `<rect x="${w * 0.04}" y="-164" width="${w * 0.2}" height="12" rx="4" fill="#c4c8cc" stroke="${INK}" stroke-width="3"/><rect x="${w * 0.74}" y="-164" width="${w * 0.2}" height="12" rx="4" fill="#c4c8cc" stroke="${INK}" stroke-width="3"/>`;
          if (pant && c === Math.min(1, cars - 1)) {
            g += `<path d="M${w / 2 - 26} -152 L${w / 2 - 4} -190 L${w / 2 + 22} -152" fill="none" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M${w / 2 - 34} -192 H${w / 2 + 30}" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`;
          }
          if (c === cars - 1) g += `<circle cx="${w - 9}" cy="-52" r="6" fill="#ffe08a" stroke="${INK}" stroke-width="2"/>`;
          out += g + "</g>";
        }
        return `<g opacity="${n(op, 3)}" transform="translate(${n(x, 1)} ${n(y + sway, 1)}) scale(${n(s, 3)})">${out}</g>`;
      };
      const RAIL = (y) => `<rect x="0" y="${y}" width="1080" height="48" fill="#98a3ab"/>${Array.from({ length: 25 }, (_, i) => `<rect x="${i * 46 + 6}" y="${y + 14}" width="30" height="12" rx="2" fill="#5f7683"/>`).join("")}<rect x="0" y="${y}" width="1080" height="8" fill="#6b6f78"/><rect x="0" y="${y - 2}" width="1080" height="3" fill="${INK}"/>`;
      const SPARKS = (f, { x, y, seed, count = 9, color = "#ffb703" }) => `<g fill="${color}">${Array.from({ length: count }, (_, i) => {
        const h = (k) => W.hash(seed + i * 7 + k);
        const age = (((f * 0.06 + h(1) * 3) % 1) + 1) % 1;
        const a = -0.4 - h(2) * 2.3;
        const sp = 40 + h(3) * 90;
        return `<circle cx="${n(x + Math.cos(a) * sp * age * 1.2, 1)}" cy="${n(y + Math.sin(a) * sp * age + 140 * age * age, 1)}" r="${n(4.5 * (1 - age) + 1, 1)}" opacity="${n(1 - age, 2)}"/>`;
      }).join("")}<circle cx="${x}" cy="${y}" r="${n(9 + 3 * Math.sin(f * 1.7), 1)}" fill="#fff4c2"/></g>`;
      const CARD = (x, y, w, h, p, inner, fill = "#f3f7fa") => (p <= 0 ? "" : `<g opacity="${n(clamp01(p), 3)}" transform="translate(${n(x)} ${n(y + 34 * (1 - p), 1)})"><rect x="0" y="0" width="${w}" height="${h}" rx="18" fill="${fill}" stroke="${INK}" stroke-width="6"/>${inner}</g>`);
      const SRC = (x, y, text) => `<text x="${x}" y="${y}" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="${SUB}">Sumber: ${text}</text>`;
      const OSW = (x, y, size, text, fill = INK, extra = "") => `<text x="${x}" y="${y}" font-family="Oswald" font-weight="600" font-size="${size}" letter-spacing="1" fill="${fill}" ${extra}>${text}</text>`;
      const TEAL = "#3d7480";
      const TEAL2 = "#2f6a6e";
      const centerText = (x, y, size, text, fill = INK, extra = "") => OSW(x, y, size, text, fill, `text-anchor="middle" ${extra}`);
      // one dilemma card: train + title + big value (value fades in on its cue) + tagline + source
      const DCARD = (f, x, side, p, v, tag) => {
        const used = side === "L";
        const train = TRAIN(f, { x: 78, y: 300, cars: 1, s: 1.3, body: used ? "#d5d9d3" : "#eef0f2", stripe: used ? GREEN : RED, riders: used ? 0.4 : 0.2, seed: used ? 3 : 8, wheel: f * 0.6, sway: 0.8 * Math.sin(f * 0.3 + (used ? 0 : 2)) });
        const inner = `${train}<line x1="30" y1="312" x2="450" y2="312" stroke="${INK}" stroke-width="3" opacity="0.25"/>${centerText(240, 384, 54, used ? "KRL BEKAS" : "KRL BARU", used ? "#4a6670" : RED, 'font-weight="700" letter-spacing="3"')}
${v > 0 ? `<g opacity="${n(v, 3)}" transform="translate(0 ${n(16 * (1 - v), 1)})">${centerText(240, 486, 84, used ? "1–2 BULAN" : "1–2 TAHUN", used ? TEAL2 : RED, 'font-weight="700"')}${centerText(240, 534, 28, tag, SUB)}</g>` : ""}
<text x="240" y="572" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="${SUB}">Sumber: Katadata, iNews</text>`;
        return CARD(x, 480, 480, 590, p, inner);
      };
      const BG = (f, o) => {
        // counter band: question first, then the 102 count
        const q = o.q * (1 - o.cn);
        const band = o.a <= 0 ? "" : `<g opacity="${n(clamp01(o.a), 3)}">
<g opacity="${n(q, 3)}"><rect x="90" y="260" width="900" height="180" rx="18" fill="#f3f7fa" stroke="${INK}" stroke-width="6"/>${centerText(540, 372, 76, "KENAPA IMPOR BEKAS?", INK, 'font-weight="700"')}</g>
${o.cn > 0 ? `<g opacity="${n(o.cn, 3)}" transform="translate(0 ${n(24 * (1 - o.cn), 1)})"><rect x="90" y="260" width="900" height="180" rx="18" fill="#f3f7fa" stroke="${INK}" stroke-width="6"/><text x="300" y="392" text-anchor="end" font-family="Oswald" font-weight="700" font-size="130" fill="${TEAL2}">${o.count}</text>${OSW(330, 338, 46, "RANGKAIAN TERSEDIA", INK)}${o.kr > 0 ? `<g opacity="${n(o.kr, 3)}">${OSW(330, 384, 34, "KURANG DARI KEBUTUHAN", RED)}</g>` : ""}<text x="330" y="420" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="${SUB}">Sumber: Fortune IDN</text></g>` : ""}
${DCARD(f, 40, "L", o.pl, o.vl, "CEPAT, TAPI BEKAS")}${DCARD(f, 560, "R", o.pr, o.vr, "BARU, TAPI LAMA")}</g>`;
        // timeline + industry rows
        let tl = "";
        if (o.pb > 0) {
          const x0 = 90;
          const x1 = 990;
          const fx = x0 + (x1 - x0) * o.tf;
          let ticks = "";
          for (let i = 0; i <= 10; i++) ticks += `<rect x="${x0 + 90 * i - 2}" y="${i % 5 === 0 ? 558 : 568}" width="4" height="${i % 5 === 0 ? 30 : 20}" fill="${INK}" opacity="0.55"/>`;
          tl = `<g opacity="${n(o.pb, 3)}" transform="translate(0 ${n(22 * (1 - o.pb), 1)})">
${centerText(540, 340, 92, "TRANSISI", TEAL2, 'font-weight="700" letter-spacing="6"')}
${o.t10 > 0 ? `<g opacity="${n(o.t10, 3)}" transform="translate(0 ${n(14 * (1 - o.t10), 1)})">${centerText(540, 450, 112, "±10 TAHUN", RED, 'font-weight="700"')}</g>` : ""}
<rect x="${x0}" y="512" width="${x1 - x0}" height="38" rx="19" fill="#c3ccd2" stroke="${INK}" stroke-width="5"/>
<rect x="${x0}" y="512" width="${n(Math.max(0, fx - x0))}" height="38" rx="19" fill="${TEAL}" stroke="${INK}" stroke-width="5"/>
<circle cx="${n(fx)}" cy="531" r="22" fill="#d9a441" stroke="${INK}" stroke-width="5"/>
${ticks}
${OSW(x0, 626, 30, "BEKAS", "#4a6670")}${OSW(x1, 626, 30, "BARU", RED, 'text-anchor="end"')}
<text x="540" y="626" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="${SUB}">Sumber: Katadata, iNews</text></g>`;
        }
        const row = (y, p, fill, txt, size, tc) => (p <= 0 ? "" : `<g opacity="${n(clamp01(p), 3)}" transform="translate(${n(60 * (1 - p), 1)} 0)"><rect x="90" y="${y}" width="900" height="96" rx="18" fill="${fill}" stroke="${INK}" stroke-width="6"/>${centerText(540, y + 66, size, txt, tc, 'font-weight="700"')}</g>`);
        const rows = `${row(700, o.r1, "#f3f7fa", "PESANAN BARU", 54, TEAL2)}${row(820, o.r2, "#f3f7fa", "INDUSTRI DALAM NEGERI HIDUP", 44, INK)}${row(940, o.r3, "#e3efe4", "KERJA SAMA INKA × PABRIK LUAR NEGERI", 36, "#2f6a35")}${o.r1 > 0 ? `<text x="540" y="1066" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="${SUB}">Sumber: CNBC, IDN Times</text>` : ""}`;
        return `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#dfe8ee"/>
${DRIFT(f, { seed: 470, count: 7, y0: 300, y1: 1100, color: "#8fd0d2", a: 0.26 })}
${SWEEP(f, { color: "#f3f7fa", a: 0.22, y0: 300, y1: 1100 })}
<rect x="0" y="1130" width="1080" height="790" fill="#b3bcc3"/>
${band}${tl}${rows}
</svg>`;
      };
      window.__timelines["sisi"] = F1.scene("sisi", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, occ = 0) => F1.wordFrame(S, x, occ);
        const kenapa = w("kenapa");
        const seratus = w("seratus");
        const kurang = w("kurang");
        const bekas = w("bekas", 1);
        const bulan = w("bulan");
        const baru = w("baru");
        const tahun = w("tahun", 0);
        const trans = w("transisi");
        const puluh = w("sepuluh");
        const pes = w("Pesanan");
        const ind = w("industri");
        const kerja = w("kerja");
        const hide = F1.ramp(f, trans - 6, 10, F1.easeOut);
        const o = {
          a: 1 - hide,
          q: F1.ramp(f, Math.min(kenapa, 6), 10, F1.expoOut),
          cn: F1.ramp(f, seratus, 10, F1.expoOut),
          count: Math.round(102 * F1.ramp(f, seratus, 20, F1.easeOut)),
          kr: F1.ramp(f, kurang, 10, F1.expoOut),
          pl: F1.ramp(f, bekas, 12, F1.expoOut),
          vl: F1.ramp(f, bulan, 10, F1.expoOut),
          pr: F1.ramp(f, baru, 12, F1.expoOut),
          vr: F1.ramp(f, tahun, 10, F1.expoOut),
          pb: F1.ramp(f, trans, 12, F1.expoOut),
          tf: F1.ramp(f, trans, Math.max(12, pes - trans), F1.easeOut),
          t10: F1.ramp(f, puluh, 10, F1.expoOut),
          r1: F1.ramp(f, pes, 10, F1.expoOut),
          r2: F1.ramp(f, ind, 10, F1.expoOut),
          r3: F1.ramp(f, kerja, 10, F1.expoOut),
        };
        return F1.join(
          C.stage(f, D, BG(f, o), {
            zoom: 0.025,
            shots: [
              { at: 0, scale: 1.0, ox: 50, oy: 40 },
              { at: bekas - 4, scale: 1.03, ox: 30, oy: 50, ease: 12 },
              { at: baru - 4, scale: 1.03, ox: 70, oy: 50, ease: 12 },
              { at: trans - 6, scale: 1.0, ox: 50, oy: 45, ease: 14 },
              { at: kerja - 8, scale: 1.02, ox: 50, oy: 55, ease: 14 },
            ],
          }),
          C.vignette(0.22, "50% 58%", 55),
          C.progress(f, { step: 6, label: "SISI LAIN" }),
          C.cast(S, f, [
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
