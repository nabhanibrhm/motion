<!-- Pelajaran: a checklist card on a warm desk ticks one rule per phrase ("bertahap", "dingin", "legal", "cek"; "BUKAN DANA DARURAT" reveals on "bukan"). Sources: Pegadaian (7 Jun 2026) and OJK via Investortrust (6 Apr 2026). Chip BUKAN SARAN INVESTASI. On Nisa's "simpan" a gold bar arcs into a jar labelled UANG DINGIN. Beni closes the case: warm paper over the scene from "ditutup", KASUS DITUTUP stamp slams, "KASUS #06 · EMAS", EMAS = JANGKA PANJANG, then the comment question on "Kamu" (PENDEK / PANJANG light up on their words) and SUMBER LENGKAP DI DESKRIPSI on "Tulis". Chip, progress and the cast are drawn after the paper so they stay visible. Muklis, Nisa, Beni. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #ead9bb;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="pelajaran" data-width="1080" data-height="1920">
    <div id="pelajaran-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="pelajaran-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="20" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="1.2667" id="pelajaran-sfx-1" class="clip" src="public/sfx/click.wav" data-at="word:bertahap" data-track-index="12" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.7" id="pelajaran-sfx-2" class="clip" src="public/sfx/click.wav" data-at="word:dingin" data-track-index="13" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="5.3667" id="pelajaran-sfx-3" class="clip" src="public/sfx/click.wav" data-at="word:legal" data-track-index="14" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="6.7" id="pelajaran-sfx-4" class="clip" src="public/sfx/click.wav" data-at="word:cek" data-track-index="15" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="9.2333" id="pelajaran-sfx-jar" class="clip" src="public/sfx/pop-in.wav" data-at="word:simpan" data-track-index="16" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="10.4" id="pelajaran-sfx-stamp" class="clip" src="public/sfx/stamp.wav" data-at="word:ditutup" data-track-index="17" data-volume="0.45"></audio>
    <audio data-hf-media-start-basis="local" data-start="10.9333" id="pelajaran-sfx-slogan" class="clip" src="public/sfx/pop-in.wav" data-at="word:ditutup+16" data-track-index="18" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="11.3667" id="pelajaran-sfx-ask" class="clip" src="public/sfx/pop-in.wav" data-at="word:Kamu" data-track-index="19" data-volume="0.09"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const RED = "#c0392b";
      const GOLD = (x, y, s = 1, text = true) => `<g transform="translate(${n(x)} ${n(y)}) scale(${n(s, 3)})" stroke="${INK}" stroke-width="6" stroke-linejoin="round">
<path d="M-104 -66 L104 -66 L80 -98 L-80 -98 Z" fill="#f5d878"/><path d="M-130 0 L130 0 L104 -66 L-104 -66 Z" fill="#e0b13a"/>
<path d="M-62 -8 L-34 -8 L-10 -58 L-38 -58 Z" fill="#fff" opacity="0.38" stroke="none"/>
${text ? `<text x="0" y="-33" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="31" letter-spacing="3" fill="${INK}" stroke="none">1 GRAM</text><text x="0" y="-12" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="17" letter-spacing="2" fill="#7a5a12" stroke="none">999.9</text>` : ""}</g>`;
      const ITEMS = [
        { main: "BELI BERTAHAP" },
        { main: "PAKAI UANG DINGIN", detail: "BUKAN DANA DARURAT", detailColor: RED },
        { main: "LEGAL DAN LOGIS", detail: "PRINSIP 2L · OJK", detailColor: "#8a6f55" },
        { main: "CEK IZIN DI OJK" },
      ];
      const LIST = (f, o) => `<g transform="translate(90 510)"><rect x="0" y="0" width="800" height="548" rx="22" fill="#f6efe1" stroke="${INK}" stroke-width="6"/>
<text x="40" y="66" font-family="Oswald" font-weight="600" font-size="42" letter-spacing="4" fill="${INK}">CARA PEGANG EMAS</text>
${ITEMS.map((it, i) => {
  const p = F1.ramp(f, o.ticks[i] - 2, 10, F1.expoOut);
  const y = 100 + 92 * i;
  const detail = it.detail ? F1.ramp(f, i === 1 ? o.bukan : o.ticks[i], 10, F1.expoOut) : 0;
  return `<g opacity="${n(0.3 + 0.7 * p, 3)}" transform="translate(${n(-20 * (1 - p))} 0)"><rect x="36" y="${y + 6}" width="54" height="54" rx="10" fill="#fff" stroke="${INK}" stroke-width="5"/>${p > 0 ? `<path d="M47 ${y + 33} L61 ${y + 48} L82 ${y + 16}" stroke="#4e8a4f" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="${n(60 * (1 - p))}"/>` : ""}<text x="112" y="${y + 40}" font-family="Oswald" font-weight="600" font-size="36" letter-spacing="1" fill="${INK}">${it.main}</text>${it.detail ? `<text x="114" y="${y + 70}" font-family="Oswald" font-weight="600" font-size="26" letter-spacing="2" fill="${it.detailColor}" opacity="${n(detail, 3)}">${it.detail}</text>` : ""}</g>`;
}).join("")}
<text x="40" y="500" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#8a6f55">Sumber: Pegadaian (7 Jun 2026): beli bertahap, dana darurat</text><text x="40" y="526" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#8a6f55">OJK via Investortrust (6 Apr 2026): prinsip 2L, legal dan logis</text></g>`;
      // the jar: the bar is drawn first (arc in, then drop), the glass front over it
      const JAR = (f, o) => {
        const a = o.arc;
        const d = o.drop;
        const bx = 1010 - 225 * a;
        const by = 900 + 40 * a - 150 * Math.sin(Math.PI * a) + 200 * d;
        const bar = o.arc > 0 ? GOLD(bx, by, 0.4, false) : "";
        return `<g transform="translate(785 1200) scale(0.68) translate(-785 -1160)">${bar}<path d="M702 996 H868 V1140 Q868 1160 848 1160 H722 Q702 1160 702 1140 Z" fill="#cde8f2" opacity="0.5" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><rect x="690" y="976" width="190" height="24" rx="10" fill="#e9e2d3" stroke="${INK}" stroke-width="6"/><rect x="722" y="1008" width="26" height="110" rx="12" fill="#fff" opacity="0.45"/><g><rect x="728" y="1018" width="114" height="38" rx="8" fill="#fffaf0" stroke="${INK}" stroke-width="4"/><text x="785" y="1046" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="18" letter-spacing="0" fill="${INK}">UANG DINGIN</text></g></g>`;
      };
      const BG = (f, o) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="pelajaran-glow" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff1d4"/><stop offset="1" stop-color="#ead9bb"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#pelajaran-glow)"/>
${DRIFT(f, { seed: 360, count: 7, y0: 420, y1: 1050, color: "#f2c27a", a: 0.26 })}
${SWEEP(f, { color: "#ffffff", a: 0.22, y0: 300, y1: 1100 })}
<rect x="0" y="1170" width="1080" height="750" fill="#c9ae84"/>
${W.dust(f, { x: 120, y: 540, w: 840, h: 600, count: 18, seed: 5, color: "#fff3cf", alpha: 0.5 })}
${LIST(f, o)}${JAR(f, o)}</svg>`;
      // background-only ambient motion: deterministic, continuous in f (works with fractional frames at 60 fps)
      const DRIFT = (f, { seed, count, y0, y1, color, a }) => `<g fill="${color}" opacity="${a}">${Array.from({ length: count }, (_, i) => { const h = (k) => F1.world.hash(seed + i * 5 + k); return `<circle cx="${F1.n(60 + 960 * h(1) + 26 * Math.sin(f * 0.035 * (0.6 + h(2)) + h(3) * 6.28), 1)}" cy="${F1.n(y0 + (y1 - y0) * h(4) + 34 * Math.sin(f * 0.026 * (0.6 + h(5)) + h(6) * 6.28), 1)}" r="${F1.n(8 + 18 * h(7), 1)}"/>`; }).join("")}</g>`;
      const SWEEP = (f, { color, a, y0, y1 }) => `<g style="filter:blur(26px)" opacity="${F1.n(a * (0.65 + 0.35 * Math.sin(f * 0.021)), 3)}" transform="translate(${F1.n(-260 + 1000 * (0.5 + 0.5 * Math.sin(f * 0.0175)), 1)} 0)"><polygon points="0,${y0} 200,${y0} 100,${y1} -100,${y1}" fill="${color}"/></g>`;
      window.__timelines["pelajaran"] = F1.scene("pelajaran", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, occ = 0) => F1.wordFrame(S, x, occ);
        const ticks = [w("bertahap"), w("dingin"), w("legal"), w("cek")];
        const bukan = w("bukan");
        const simpan = w("simpan");
        const ditutup = w("ditutup");
        const kamu = w("Kamu");
        const pendek = w("pendek");
        const panjang = w("panjang");
        const tulis = w("Tulis");
        const paper = F1.ramp(f, ditutup - 6, 8);
        const slam = F1.ramp(f, ditutup, 8, F1.expoOut);
        const slogan = F1.ramp(f, ditutup + 16, 12, F1.expoOut);
        const ask = F1.ramp(f, kamu, 12, F1.expoOut);
        const src = F1.ramp(f, tulis, 10, F1.expoOut);
        const o = { ticks, bukan, arc: F1.ramp(f, simpan - 12, 16, F1.easeOut), drop: F1.ramp(f, simpan + 4, 10, (t) => t * t) };
        const mono = "font-family:'JetBrains Mono',monospace";
        const hot = (p, base, color) => (p > 0 ? color : base);
        const end =
          paper <= 0
            ? ""
            : `<div style="${F1.css({ position: "absolute", inset: 0, background: "#f6efe1", opacity: n(paper, 3) })}"></div>
<div style="${F1.css({ position: "absolute", left: 0, right: 0, top: 440, display: "flex", flexDirection: "column", alignItems: "center", gap: 22, opacity: n(paper, 3) })}">
<div style="${F1.css({ marginTop: 56, padding: "12px 30px", border: "6px solid #c0392b", borderRadius: 12, transform: `rotate(-6deg) scale(${n(2.2 - 1.2 * slam, 3)})`, opacity: n(slam, 3), fontFamily: "Oswald, sans-serif", fontWeight: 600, fontSize: 72, letterSpacing: 6, color: "#c0392b" })}">KASUS DITUTUP</div>
<div style="${mono};font-weight:500;font-size:26px;letter-spacing:2px;color:#6f6a66">KASUS #06 · EMAS</div>
<div style="${F1.css({ marginTop: 6, padding: "18px 38px", borderRadius: 18, background: "#fffaf0", border: "6px solid #2a2a2e", textAlign: "center", opacity: n(slogan, 3), transform: `translateY(${n(30 * (1 - slogan))}px) rotate(-1.5deg)` })}"><div style="font-family:Oswald,sans-serif;font-weight:700;font-size:58px;line-height:1.12;letter-spacing:2px;color:#2a2a2e">EMAS = <span style="background:${C.ACCENT};padding:0 12px;border-radius:10px">JANGKA PANJANG</span></div></div>
<div style="${F1.css({ marginTop: 14, padding: "24px 40px", borderRadius: 20, background: "#2a2a2e", textAlign: "center", opacity: n(ask, 3), transform: `translateY(${n(30 * (1 - ask))}px)` })}"><div style="${mono};font-weight:700;font-size:24px;letter-spacing:2px;color:#ff5a5f">● TULIS DI KOMENTAR</div><div style="font-family:Oswald,sans-serif;font-weight:600;font-size:58px;line-height:1.15;color:#fff">JANGKA <span style="color:${hot(F1.ramp(f, pendek, 6), "#fff", "#ff7a70")}">PENDEK</span><br>ATAU <span style="color:${hot(F1.ramp(f, panjang, 6), "#fff", C.ACCENT)}">PANJANG?</span></div></div>
<div style="${mono};font-weight:500;font-size:20px;letter-spacing:1px;color:#6f6a66;opacity:${n(Math.max(src, 0.0), 3)}">SUMBER LENGKAP DI DESKRIPSI</div></div>`;
        // Title-only cover card over the outro tail (after Beni's last word), for TikTok's "Select cover".
        // Text stays inside the centred 3:4 crop (y 240-1680) used by the profile grid.
        const lastEnd = F1.line(S, 2).end;
        const cv = F1.ramp(f, lastEnd + 4, 5);
        const cover =
          cv <= 0
            ? ""
            : `<div style="${F1.css({ position: "absolute", inset: 0, zIndex: 50, background: "#f1e7d3", opacity: n(cv, 3), display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 34 })}">
<div style="${F1.css({ padding: "10px 26px", border: "6px solid #c0392b", borderRadius: 12, transform: "rotate(-5deg)", fontFamily: "Oswald, sans-serif", fontWeight: 600, fontSize: 52, letterSpacing: 6, color: "#c0392b" })}">KASUS #06</div>
<div style="${F1.css({ textAlign: "center", fontFamily: "Oswald, sans-serif", fontWeight: 700, color: "#2a2a2e", lineHeight: 1.04, letterSpacing: 2 })}"><div style="font-size:118px">EMAS KATANYA</div><div style="font-size:118px">AMAN, KOK</div><div style="font-size:118px;margin-top:22px">TURUN <span style="display:inline-block;line-height:1.1;color:#fff;background:#d0413a;padding:0 18px;border-radius:16px">20%?</span></div></div>
<svg width="300" height="130" viewBox="-150 -110 300 130"><g stroke="#2a2a2e" stroke-width="6" stroke-linejoin="round"><path d="M-104 -66 L104 -66 L80 -98 L-80 -98 Z" fill="#f5d878"/><path d="M-130 0 L130 0 L104 -66 L-104 -66 Z" fill="#e0b13a"/></g><path d="M-62 -8 L-34 -8 L-10 -58 L-38 -58 Z" fill="#fff" opacity="0.38"/></svg></div>`;
        return F1.join(
          C.stage(f, D, BG(f, o), {
            zoom: 0.04,
            shots: [
              { at: 0, scale: 1.04, ox: 50, oy: 40 },
              { at: ticks[2], scale: 1.07, ox: 50, oy: 46, ease: 14 },
              { at: F1.line(S, 1).start, scale: 1.05, ox: 68, oy: 60, ease: 14 },
            ],
          }),
          C.vignette(0.22, "50% 58%", 55),
          end,
          C.progress(f, { step: 7, label: "VONIS" }),
          C.chip(f, { at: 4, text: "BUKAN SARAN INVESTASI" }),
          C.cast(S, f, [
            { src: C.CAST.muklisSenyum, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380 },
            { src: C.CAST.beni, x: 540, y: 1200, w: 400 },
          ]),
          cover,
        );
      });
    })();
  </script>
