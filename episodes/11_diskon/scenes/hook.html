<!-- Hook: warm cream desk. Frame 0 is fully drawn (thumbnail): Beni's phone with a big "11.11" banner and a green bubble "HEMAT Rp100 RB!" plus a paper receipt on the right. On "Sebelas-sebelas" the banner pops; on "seratus" the green bubble bounces; Nisa takes over (line 2): on "Hemat" a red "?" lands on the bubble, on "struknya" a magnifier slides over the receipt. All figures are a SIMULASI. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #f4e4c8;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="hook-sfx-sebelas" class="clip" src="public/sfx/pop-in.wav" data-at="word:Sebelas-sebelas" data-track-index="12" data-volume="0.14"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="hook-sfx-seratus" class="clip" src="public/sfx/ding.wav" data-at="word:seratus" data-track-index="13" data-volume="0.15"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="hook-sfx-hemat" class="clip" src="public/sfx/swoosh-soft.wav" data-at="word:Hemat" data-track-index="14" data-volume="0.15"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="hook-sfx-struk" class="clip" src="public/sfx/shutter.wav" data-at="word:struknya" data-track-index="15" data-volume="0.2"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const GREEN = "#3fae5a";
      const PHONE = (f, { wave, pop, bub, q }) => `<g transform="translate(330 800) rotate(${n(-6 + wave, 2)})">
<rect x="-190" y="-300" width="380" height="600" rx="42" fill="#33343a" stroke="${INK}" stroke-width="8"/>
<rect x="-166" y="-262" width="332" height="524" rx="22" fill="#fffaf0"/>
<rect x="-40" y="-286" width="80" height="12" rx="6" fill="#111"/>
<g transform="translate(0 -150) scale(${n(1 + 0.12 * pop, 3)})"><rect x="-146" y="-70" width="292" height="140" rx="16" fill="#d0413a" stroke="${INK}" stroke-width="5"/>
<text x="0" y="36" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="112" letter-spacing="3" fill="#fffaf0">11.11</text></g>
<rect x="-146" y="-60" width="292" height="40" rx="10" fill="#ddd3bf"/>
<text x="0" y="-30" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="3" fill="#8a7a62">PROMO BELANJA</text>
<g transform="translate(0 ${n(60 - 14 * bub, 2)}) scale(${n(1 + 0.1 * bub, 3)})"><rect x="-140" y="-48" width="280" height="96" rx="26" fill="${GREEN}" stroke="${INK}" stroke-width="5"/>
<path d="M-40 46 L-62 78 L-8 48 Z" fill="${GREEN}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
<text x="0" y="-6" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="30" letter-spacing="4" fill="#fffaf0">HEMAT</text>
<text x="0" y="30" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="38" letter-spacing="2" fill="#fffaf0">Rp100 RB!</text>
<text x="118" y="-30" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="${n(80 * q, 2)}" fill="#d0413a" stroke="${INK}" stroke-width="4" paint-order="stroke" opacity="${n(q, 2)}">?</text></g>
<rect x="-146" y="150" width="292" height="12" rx="6" fill="#ddd3bf"/><rect x="-146" y="178" width="200" height="12" rx="6" fill="#ddd3bf"/>
<g transform="translate(0 232)"><text x="0" y="0" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="18" letter-spacing="3" fill="#8a7a62">SIMULASI</text></g></g>`;
      const RECEIPT = (f, { mag }) => `<g transform="translate(780 ${n(930 + 6 * Math.sin(f / 9), 2)}) rotate(5)">
<path d="M-150 -230 H150 V230 l-25 -18 l-25 18 l-25 -18 l-25 18 l-25 -18 l-25 18 l-25 -18 l-25 18 l-25 -18 l-25 18 l-25 -18 l-25 18 Z" fill="#fffdf6" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
<text x="0" y="-186" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="42" letter-spacing="6" fill="${INK}">STRUK</text>
<line x1="-120" y1="-160" x2="120" y2="-160" stroke="#8a7a62" stroke-width="3" stroke-dasharray="8 8"/>
${[-110, -60, -10, 40].map((y, i) => `<rect x="-120" y="${y}" width="${[150, 110, 130, 90][i]}" height="14" rx="7" fill="#ddd3bf"/><rect x="${[70, 80, 76, 84][i]}" y="${y}" width="${[50, 40, 44, 36][i]}" height="14" rx="7" fill="#ddd3bf"/>`).join("")}
<line x1="-120" y1="90" x2="120" y2="90" stroke="#8a7a62" stroke-width="3" stroke-dasharray="8 8"/>
<text x="-120" y="146" font-family="Oswald" font-weight="700" font-size="34" letter-spacing="2" fill="${INK}">TOTAL</text>
<text x="120" y="146" text-anchor="end" font-family="Oswald" font-weight="700" font-size="40" fill="#d0413a">Rp ???</text>
<text x="0" y="198" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="16" letter-spacing="3" fill="#8a7a62">SIMULASI</text>
<g transform="translate(${n(200 - 190 * mag, 2)} ${n(-170 + 130 * mag, 2)}) rotate(${n(-20 + 20 * mag, 2)})" opacity="${n(Math.min(1, mag * 3), 2)}">
<circle cx="0" cy="0" r="86" fill="#cfeaf5" fill-opacity="0.45" stroke="${INK}" stroke-width="12"/>
<path d="M-24 -50 A56 56 0 0 1 36 -34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
<line x1="62" y1="62" x2="150" y2="150" stroke="${INK}" stroke-width="26" stroke-linecap="round"/><line x1="62" y1="62" x2="150" y2="150" stroke="#8a6f55" stroke-width="12" stroke-linecap="round"/></g></g>`;
      window.__timelines["hook"] = F1.scene("hook", (f, { S, D }) => {
        const C = F1.cine;
        const sebelas = F1.wordFrame(S, "Sebelas-sebelas");
        const seratus = F1.wordFrame(S, "seratus");
        const hemat = F1.wordFrame(S, "Hemat");
        const struk = F1.wordFrame(S, "struknya");
        const pulse = (at, len) => (f >= at && f < at + len ? Math.sin((Math.PI * (f - at)) / len) : 0);
        const pop = pulse(sebelas, 18);
        const bub = pulse(seratus, 20);
        const q = F1.ramp(f, hemat, 12, F1.expoOut);
        const mag = F1.ramp(f, struk - 6, 22, F1.expoOut);
        const wave = f < hemat ? 4 * Math.sin(f / 5) : 4 * Math.sin(hemat / 5) * (1 - F1.ramp(f, hemat, 14));
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="hook-glow" cx="50%" cy="46%" r="58%"><stop offset="0" stop-color="#fff3d6"/><stop offset="1" stop-color="#f1dfbf"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#hook-glow)"/>
<g fill="#f2c27a" opacity="0.5">${Array.from({ length: 14 }, (_, i) => `<circle cx="${n(80 + 920 * W.hash(i * 3 + 1))}" cy="${n(500 + 640 * W.hash(i * 3 + 2))}" r="${n(10 + 22 * W.hash(i * 3 + 3))}"/>`).join("")}</g>
<rect x="0" y="1140" width="1080" height="780" fill="#e3c9a0"/><rect x="0" y="1140" width="1080" height="14" fill="#c8ab7c"/>
${PHONE(f, { wave, pop, bub, q })}${RECEIPT(f, { mag })}</svg>`;
        return F1.join(
          C.stage(f, D, BG, {
            whip: false,
            zoom: 0.04,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 60 },
              { at: seratus - 4, scale: 1.08, ox: 34, oy: 56, ease: 12 },
              { at: F1.line(S, 1).start, scale: 1.04, ox: 66, oy: 58, ease: 14 },
            ],
          }),
          C.vignette(0.22, "50% 58%", 50),
          C.progress(f, { step: 1, label: "LAPORAN MASUK" }),
          C.hud(f, { at: -14, kicker: "LAPORAN MASUK", big: "DISKON 11.11: HEMAT?", sub: "SIMULASI · BUKAN DATA NYATA", bigSize: 46, w: 640 }),
          C.cast(S, f, [
            { src: C.CAST.beni, x: 540, y: 1200, w: 420, at: -14 },
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
