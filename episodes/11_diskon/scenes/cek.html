<!-- Cek: Muklis cites the law card "UU 8/1999 PASAL 11" (source JDIH BPK, D3); a DILARANG stamp lands on "melarang". On "riwayat" an illustrative price-history chart "CEK RIWAYAT HARGA" draws; then Nisa's checklist ticks one row per word: MINIMAL BELANJA, BATAS POTONGAN, KUOTA, METODE BAYAR, ONGKIR. Muklis, Nisa. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #efe6d4;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="cek" data-width="1080" data-height="1920">
    <div id="cek-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="cek-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="0.5" id="cek-sfx-1" class="clip" src="public/sfx/pop-in.wav" data-at="word:Undang-undang" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="3" id="cek-sfx-2" class="clip" src="public/sfx/stamp.wav" data-at="word:melarang+6" data-track-index="13" data-volume="0.3"></audio>
    <audio data-hf-media-start-basis="local" data-start="5" id="cek-sfx-3" class="clip" src="public/sfx/whoosh.wav" data-at="word:riwayat" data-track-index="14" data-volume="0.12"></audio>
    <audio data-hf-media-start-basis="local" data-start="7" id="cek-sfx-4" class="clip" src="public/sfx/tick.wav" data-at="word:minimal" data-track-index="15" data-volume="0.16"></audio>
    <audio data-hf-media-start-basis="local" data-start="8" id="cek-sfx-5" class="clip" src="public/sfx/tick.wav" data-at="word:batas" data-track-index="16" data-volume="0.16"></audio>
    <audio data-hf-media-start-basis="local" data-start="9" id="cek-sfx-6" class="clip" src="public/sfx/tick.wav" data-at="word:kuota" data-track-index="17" data-volume="0.16"></audio>
    <audio data-hf-media-start-basis="local" data-start="10" id="cek-sfx-7" class="clip" src="public/sfx/tick.wav" data-at="word:metode" data-track-index="18" data-volume="0.16"></audio>
    <audio data-hf-media-start-basis="local" data-start="11" id="cek-sfx-8" class="clip" src="public/sfx/ding.wav" data-at="word:ongkir" data-track-index="19" data-volume="0.12"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const INK = "#2a2a2e";
      const mono = "JetBrains Mono";
      window.__timelines["cek"] = F1.scene("cek", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const uu = w("Undang-undang");
        const melarang = w("melarang");
        const riwayat = w("riwayat");
        const items = ["minimal", "batas", "kuota", "metode", "ongkir"].map((k) => w(k));
        const labels = ["MINIMAL BELANJA", "BATAS POTONGAN", "KUOTA", "METODE BAYAR", "ONGKIR"];
        const pLaw = F1.ramp(f, uu - 2, 14, F1.expoOut);
        const pChart = F1.ramp(f, riwayat - 4, 14, F1.expoOut);
        const draw = F1.ramp(f, riwayat, 40, F1.expoOut);
        const pList = F1.ramp(f, items[0] - 12, 14, F1.expoOut);

        const law =
          pLaw <= 0
            ? ""
            : `<g opacity="${n(pLaw, 3)}" transform="translate(0 ${n(40 * (1 - pLaw))})">
<rect x="70" y="200" width="940" height="290" rx="22" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<rect x="70" y="200" width="940" height="62" rx="22" fill="${INK}"/><rect x="70" y="240" width="940" height="22" fill="${INK}"/>
<text x="540" y="244" text-anchor="middle" font-family="${mono}" font-weight="700" font-size="28" letter-spacing="2" fill="#f4e9d2">UU 8/1999 · PERLINDUNGAN KONSUMEN</text>
<text x="540" y="324" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="60" fill="${INK}">PASAL 11</text>
<text x="540" y="384" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="44" fill="#c0392b">DILARANG MENAIKKAN HARGA</text>
<text x="540" y="430" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="44" fill="#c0392b">SEBELUM OBRAL</text>
<text x="540" y="473" text-anchor="middle" font-family="${mono}" font-weight="500" font-size="20" fill="#6f6a66">Sumber: UU 8/1999 Pasal 11 huruf f (JDIH BPK)</text></g>`;

        // price history chart (illustration): flat, a hike, then the "obral" price
        const pts = [
          [0, 0.45], [60, 0.45], [120, 0.47], [180, 0.45], [240, 0.8], [300, 0.82], [360, 0.8], [420, 0.5], [480, 0.5], [540, 0.5], [600, 0.5],
        ];
        const X = (x) => 160 + x * 1.3;
        const Y = (v) => 800 - v * 190;
        const full = pts.map(([x, v], i) => `${i ? "L" : "M"}${n(X(x))} ${n(Y(v))}`).join(" ");
        const chart =
          pChart <= 0
            ? ""
            : `<g opacity="${n(pChart, 3)}" transform="translate(0 ${n(40 * (1 - pChart))})">
<rect x="70" y="520" width="940" height="330" rx="22" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<text x="110" y="572" font-family="${mono}" font-weight="700" font-size="28" letter-spacing="3" fill="${INK}">CEK RIWAYAT HARGA</text>
<path d="M150 600 V810 H950" stroke="#b7ab97" stroke-width="3" fill="none"/>
<path d="${full}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${n(1 - draw, 3)}" fill="none" stroke="#c0392b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="${n(X(300))}" y="${n(Y(0.82) - 18)}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="30" fill="#c0392b" opacity="${n(F1.ramp(f, riwayat + 18, 10, F1.backOut), 3)}">NAIK DULU?</text>
<text x="${n(X(520))}" y="${n(Y(0.5) + 44)}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="30" fill="${INK}" opacity="${n(F1.ramp(f, riwayat + 32, 10, F1.backOut), 3)}">OBRAL</text>
<text x="950" y="838" text-anchor="end" font-family="${mono}" font-weight="500" font-size="19" fill="#6f6a66">ILUSTRASI · BUKAN DATA NYATA</text></g>`;

        const rows = labels
          .map((t, i) => {
            const y = 960 + i * 90;
            const p = F1.ramp(f, items[i], 10, F1.backOut);
            const tick =
              p > 0
                ? `<path d="M92 ${y} l22 24 l44 -52" fill="none" stroke="#2e8b57" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${n(1 - p, 3)}"/>`
                : "";
            return `<rect x="82" y="${y - 34}" width="80" height="68" rx="12" fill="#fffaf0" stroke="${INK}" stroke-width="5"/>${tick}<text x="190" y="${y + 17}" font-family="Oswald" font-weight="700" font-size="50" fill="${p > 0 ? INK : "#7d7468"}">${t}</text>`;
          })
          .join("");
        const list =
          pList <= 0
            ? ""
            : `<g opacity="${n(pList, 3)}" transform="translate(0 ${n(30 * (1 - pList))})"><text x="82" y="896" font-family="${mono}" font-weight="700" font-size="26" letter-spacing="3" fill="#6b5f52">BACA SYARATNYA</text>${rows}</g>`;

        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="cek-glow" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff4da"/><stop offset="1" stop-color="#ead9bb"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#cek-glow)"/>
<rect x="0" y="1420" width="1080" height="500" fill="#c9ae84"/>
${F1.world.dust(f, { x: 100, y: 500, w: 840, h: 620, count: 14, seed: 33, color: "#fff3cf", alpha: 0.4 })}
<g transform="translate(0 70)">${law}${chart}${list}</g>
</svg>`;
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.02,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 50 },
              { at: riwayat - 6, scale: 1.03, ox: 50, oy: 48, ease: 14 },
              { at: items[0] - 8, scale: 1.04, ox: 45, oy: 58, ease: 14 },
            ],
          }),
          C.vignette(0.2, "50% 55%", 55),
          C.progress(f, { step: 6, label: "BUKTI 4 · CEK DULU" }),
          C.stamp(f, { at: melarang + 6, x: 815, y: 312, rot: -6, text: "DILARANG", size: 28 }),
          C.cast(S, f, [
            { src: C.CAST.muklis, x: 770, y: 1200, w: 340, at: 0 },
            { src: C.CAST.nisa, x: 770, y: 1200, w: 340 },
          ]),
        );
      });
    })();
  </script>
</template>
