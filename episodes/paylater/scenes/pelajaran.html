<path d="M-8 -30 l22 18 M10 -42 l20 16 M-26 -22 l20 16" fill="none" stroke-width="5"/>
<rect x="-116" y="32" width="238" height="24" rx="12" fill="#e9e2d3"/></g>`;
      const BG = (f, o) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="pelajaran-glow" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff1d4"/><stop offset="1" stop-color="#ead9bb"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#pelajaran-glow)"/>
<rect x="0" y="1160" width="1080" height="760" fill="#c9ae84"/>
${F1.world.dust(f, { x: 120, y: 560, w: 840, h: 560, count: 18, seed: 5, color: "#fff3cf", alpha: 0.5 })}
${LIST(f, o.ticks)}
${o.shoe > 0 ? `<g transform="translate(${n(300 + (1 - o.shoe) * 300)} ${n(1100 - 40 * Math.sin(Math.PI * Math.min(1, (1 - o.shoe) * 3)) )})" opacity="${n(o.shoe, 3)}">${SNEAKER(0, 0, 0.62)}</g>` : ""}</svg>`;
      window.__timelines["pelajaran"] = F1.scene("pelajaran", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, occ = 0) => F1.wordFrame(S, x, occ);
        const ticks = [w("total"), w("kebutuhan"), w("bayar"), w("jangan")];
        const oke = F1.line(S, 1).start;
        const ditutup = w("ditutup");
        const utang = w("utang");
        const kamu = w("Kamu");
        const paper = F1.ramp(f, ditutup - 6, 8);

        const slogan = F1.ramp(f, utang - 6, 12, F1.expoOut);
        const ask = F1.ramp(f, kamu, 12, F1.expoOut);

<div style="${F1.css({ marginTop: 14, padding: "22px 36px", borderRadius: 20, background: "#2a2a2e", textAlign: "center", opacity: n(ask, 3), transform: `translateY(${n(30 * (1 - ask))}px)` })}"><div style="${mono};font-weight:700;font-size:24px;letter-spacing:2px;color:#ff5a5f">● PERNAH TELAT BAYAR?</div><div style="font-family:Oswald,sans-serif;font-weight:600;font-size:60px;line-height:1.15;color:#fff">CERITA DI <span style="color:${C.ACCENT}">KOMENTAR</span></div></div>

          C.chip(f, { at: 4, text: "YANG BISA KAMU LAKUKAN" }),
          C.tag(f, { at: w("gajian"), x: 520, y: 1088, rot: -4, text: "NUNGGU GAJIAN", size: 36, light: true }),
          end,
          C.progress(f, { step: 7, label: "VONIS" }),
          C.cast(S, f, [
            { src: C.CAST.muklisSenyum, x: 540, y: 1200, w: 380, at: 0 },
