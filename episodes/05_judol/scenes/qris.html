<!-- QRIS (bukti 2): a street cart "CILOK" with a QRIS stand. Nisa asks: a red BAHAYA? bubble on "bahaya", struck out on "Bukan". The card BUKAN QRIS-NYA / penyalahgunaan merchant slides in (PPATK 4 Agu 2026). On "merchant" a tag MERCHANT PALSU / FIKTIF, on "palsu" a PALSU stamp on the cart. On "Bank" the cart moves left and a ledger of repeated "Rp50.000" rows fills on "terus-terusan ... sama" (BI's example via Katadata, 21 Okt 2026; amount shown as an illustrative example). Never implies QRIS itself is dangerous. Nisa, Muklis. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #efe1c4;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="qris" data-width="1080" data-height="1920">
    <div id="qris-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="qris-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="20" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="0.8333" id="qris-sfx-q" class="clip" src="public/sfx/pop-in.wav" data-at="word:bahaya" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="1.4333" id="qris-sfx-no" class="clip" src="public/sfx/click.wav" data-at="word:Bukan" data-track-index="13" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.2" id="qris-sfx-tag" class="clip" src="public/sfx/pop-in.wav" data-at="word:merchant" data-track-index="14" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.7333" id="qris-sfx-stamp" class="clip" src="public/sfx/stamp.wav" data-at="word:palsu" data-track-index="15" data-volume="0.45"></audio>
    <audio data-hf-media-start-basis="local" data-start="5.8" id="qris-sfx-bank" class="clip" src="public/sfx/pop-in.wav" data-at="word:Bank" data-track-index="16" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="9.4" id="qris-sfx-rows" class="clip" src="public/sfx/tick.wav" data-at="word:terima" data-track-index="17" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="11.0667" id="qris-sfx-same" class="clip" src="public/sfx/ding-num.wav" data-at="word:sama" data-track-index="18" data-volume="0.07"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const QRG = (x, y, s, seed) => {
        let cells = "";
        for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) if (W.hash(seed * 49 + r * 7 + c) > 0.45 || (r < 2 && c < 2) || (r < 2 && c > 4) || (r > 4 && c < 2)) cells += `<rect x="${c * 12}" y="${r * 12}" width="12" height="12"/>`;
        return `<g transform="translate(${x} ${y}) scale(${s})" fill="${INK}">${cells}</g>`;
      };
      // the cilok cart, feet at (0,0); `pulse` pops the QRIS stand
      const CART = (f, o) => {
        const stripes = Array.from({ length: 8 }, (_, i) => `<path d="M${-260 + i * 65} -330 h65 l${i % 2 ? 6 : -6} 70 h-65 z" fill="${i % 2 ? "#fffaf0" : "#d0413a"}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`).join("");
        return `<g transform="translate(${n(o.cx)} 1120) scale(${n(o.s, 3)})">
<rect x="-250" y="-250" width="500" height="170" rx="14" fill="#b9783e" stroke="${INK}" stroke-width="7"/>
<rect x="-250" y="-270" width="500" height="28" rx="10" fill="#d9a05f" stroke="${INK}" stroke-width="6"/>
<path d="M-230 -230 h460 M-230 -160 h460" stroke="${INK}" stroke-width="3" opacity="0.35"/>
<circle cx="-150" cy="-52" r="52" fill="#4a4a50" stroke="${INK}" stroke-width="7"/><circle cx="-150" cy="-52" r="14" fill="#c9c3b6" stroke="${INK}" stroke-width="4"/>
<circle cx="150" cy="-52" r="52" fill="#4a4a50" stroke="${INK}" stroke-width="7"/><circle cx="150" cy="-52" r="14" fill="#c9c3b6" stroke="${INK}" stroke-width="4"/>
<path d="M-250 -340 V-270 M250 -340 V-270" stroke="${INK}" stroke-width="10" stroke-linecap="round"/>
${stripes}<path d="M-270 -330 H270" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>
<g transform="translate(0 -330)"><path d="M-70 0 V50 M70 0 V50" stroke="${INK}" stroke-width="4"/><rect x="-110" y="50" width="220" height="64" rx="10" fill="#fffaf0" stroke="${INK}" stroke-width="6"/><text x="0" y="98" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="46" letter-spacing="6" fill="${INK}">CILOK</text></g>
<g transform="translate(-150 -270)"><ellipse cx="0" cy="-34" rx="62" ry="12" fill="#6f6a66" stroke="${INK}" stroke-width="5"/><path d="M-62 -34 L-52 0 H52 L62 -34" fill="#8d8a84" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/></g>
<g transform="translate(150 ${n(-270 - 12 * o.pulse)}) scale(${n(1 + 0.08 * o.pulse, 3)})"><path d="M-8 0 L-14 20 H94 L88 0" fill="#c9c3b6" stroke="${INK}" stroke-width="5"/><rect x="-14" y="-150" width="108" height="150" rx="10" fill="#fffaf0" stroke="${INK}" stroke-width="6"/><rect x="-14" y="-150" width="108" height="30" rx="8" fill="${INK}"/><text x="40" y="-128" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="22" letter-spacing="3" fill="#fff">QRIS</text>${QRG(0, -112, 0.8, 3)}</g>
${o.tag > 0 ? `<g transform="translate(0 -22) rotate(-3) scale(${n(0.6 + 0.4 * o.tag, 3)})" opacity="${n(o.tag, 3)}"><rect x="-210" y="-26" width="420" height="52" rx="8" fill="#111"/><text x="0" y="12" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="31" letter-spacing="2" fill="#fff">MERCHANT PALSU / FIKTIF</text></g>` : ""}
${o.stamp > 0 ? `<g transform="translate(-10 -150) rotate(-10) scale(${n(2.2 - 1.2 * o.stamp, 3)})" opacity="${n(o.stamp, 3)}"><rect x="-130" y="-52" width="260" height="104" rx="12" fill="rgba(246,239,225,0.6)" stroke="#c0392b" stroke-width="7"/><text x="0" y="26" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="80" letter-spacing="8" fill="#c0392b">PALSU</text></g>` : ""}
</g>`;
      };
      const BUBBLE = (p, strike, f) => p <= 0.001 ? "" : `<g transform="translate(790 ${n(760 + 4 * Math.sin(f / 10))}) scale(${n(0.5 + 0.5 * p, 3)})" opacity="${n(p, 3)}"><path d="M-110 -50 Q-110 -90 -70 -90 H70 Q110 -90 110 -50 V10 Q110 50 70 50 H10 L-30 90 L-30 50 H-70 Q-110 50 -110 10 Z" fill="#fffaf0" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><text x="0" y="14" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="52" letter-spacing="2" fill="#c0392b">BAHAYA?</text>${strike > 0 ? `<path d="M-100 40 L${n(-100 + 200 * strike)} ${n(40 - 80 * strike)}" stroke="#2a2a2e" stroke-width="10" stroke-linecap="round"/>` : ""}</g>`;
      const NOTICE = (p) => p <= 0.001 ? "" : `<g transform="translate(${n(90 - 60 * (1 - p))} 540)" opacity="${n(p, 3)}"><rect width="840" height="130" rx="20" fill="#fffaf0" stroke="${INK}" stroke-width="7"/>
<text x="36" y="58" font-family="Oswald" font-weight="700" font-size="46" letter-spacing="2" fill="${INK}">BUKAN <tspan fill="#4e8a4f">QRIS</tspan>-NYA</text>
<text x="36" y="96" font-family="Oswald" font-weight="500" font-size="30" fill="${INK}">tapi penyalahgunaan merchant</text>
<text x="36" y="120" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#8a6f55">Sumber: PPATK (4 Agu 2026)</text></g>`;
      const LEDGER = (f, o) => {
        if (o.led <= 0.001) return "";
        const rows = Array.from({ length: 6 }, (_, i) => {
          const p = F1.ramp(f, o.rowAt + i * o.rowStep, 8, F1.expoOut);
          if (p <= 0) return "";
          return `<g transform="translate(0 ${n(i * 58 + 12 * (1 - p))})" opacity="${n(p, 3)}"><rect x="20" y="0" width="300" height="48" rx="10" fill="#fffaf0" stroke="${INK}" stroke-width="4"/><text x="40" y="35" font-family="JetBrains Mono" font-weight="700" font-size="30" fill="${INK}">Rp50.000</text><path d="M268 24 l12 12 l24 -26" stroke="#4e8a4f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
        }).join("");
        const same = F1.ramp(f, o.sameAt, 8, F1.expoOut);
        return `<g transform="translate(${n(610 + 70 * (1 - o.led))} 590)" opacity="${n(o.led, 3)}"><rect width="340" height="545" rx="20" fill="#f6efe1" stroke="${INK}" stroke-width="7"/><rect width="340" height="62" rx="20" fill="${INK}"/><rect y="34" width="340" height="28" fill="${INK}"/>
<text x="170" y="42" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="26" letter-spacing="3" fill="#fff">UANG MASUK</text>
<g transform="translate(0 86)">${rows}</g>
${same > 0 ? `<g transform="translate(170 456) rotate(-3) scale(${n(1.5 - 0.5 * same, 3)})" opacity="${n(same, 3)}"><rect x="-150" y="-30" width="300" height="60" rx="10" fill="#d0413a" stroke="${INK}" stroke-width="5"/><text x="0" y="12" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="34" letter-spacing="3" fill="#fff">JUMLAH SAMA</text></g>` : ""}
<text x="170" y="530" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="14" fill="#8a6f55">CONTOH ILUSTRASI</text></g>`;
      };
      const BG = (f, o) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="qris-glow" cx="50%" cy="42%" r="62%"><stop offset="0" stop-color="#fff1d4"/><stop offset="1" stop-color="#efe1c4"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#qris-glow)"/>
<rect x="0" y="1120" width="1080" height="800" fill="#cfb68b"/><rect x="0" y="1120" width="1080" height="10" fill="#b79c6f"/>
${W.dust(f, { x: 100, y: 560, w: 880, h: 560, count: 12, seed: 14, color: "#fff3cf", alpha: 0.4 })}
${CART(f, o)}${BUBBLE(o.bubble, o.strike, f)}${NOTICE(o.notice)}${LEDGER(f, o)}</svg>`;
      window.__timelines["qris"] = F1.scene("qris", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, occ = 0) => F1.wordFrame(S, x, occ);
        const bahaya = w("bahaya");
        const bukan = w("Bukan");
        const merchant = w("merchant");
        const palsu = w("palsu");
        const bank = w("Bank");
        const terus = w("terus-terusan");
        const sama = w("sama");
        const move = F1.ramp(f, bank - 8, 16, F1.expoOut);
        const o = {
          cx: 540 - 210 * move,
          s: 1.05 - 0.19 * move,
          bubble: F1.ramp(f, bahaya - 2, 10, F1.expoOut) * (1 - F1.ramp(f, bukan + 20, 8)),
          strike: F1.ramp(f, bukan, 8, F1.expoOut),
          notice: F1.ramp(f, bukan + 4, 12, F1.expoOut) * (1 - F1.ramp(f, bank - 10, 8)),
          tag: F1.ramp(f, merchant, 10, F1.expoOut),
          stamp: F1.ramp(f, palsu, 8, F1.expoOut),
          pulse: 0,
          led: F1.ramp(f, bank, 14, F1.expoOut),
          rowAt: terus,
          rowStep: (sama - terus) / 6,
          sameAt: sama,
        };
        // the QRIS stand pops each time a row lands
        for (let i = 0; i < 6; i++) {
          const t = terus + i * ((sama - terus) / 6);
          if (f >= t && f < t + 8) o.pulse = Math.max(o.pulse, 1 - (f - t) / 8);
        }
        const second = f >= bank - 6;
        return F1.join(
          C.stage(f, D, BG(f, o), {
            zoom: 0.04,
            shots: [
              { at: 0, scale: 1.0, ox: 50, oy: 62 },
              { at: merchant - 6, scale: 1.07, ox: 50, oy: 66, ease: 14 },
              { at: bank - 8, scale: 1.0, ox: 50, oy: 62, ease: 14 },
            ],
          }),
          C.vignette(0.22, "50% 58%", 55),
          C.progress(f, { step: 3, label: "BUKTI 2 · MERCHANT PALSU" }),
          second
            ? C.hud(f, { at: bank - 6, kicker: "CONTOH DARI BANK INDONESIA", big: "WARUNG CILOK", sub: "UANG MASUK: JUMLAH SAMA, BERULANG", src: "BI via Katadata (21 Okt 2026)", w: 560, bigSize: 52 })
            : C.hud(f, { at: 4, kicker: "MODUS BARU", big: "MERCHANT PALSU", sub: "WARUNG FIKTIF PENYAMAR SETORAN", src: "PPATK via Okezone/RCTI+ (23 Jul 2026)", w: 560, bigSize: 52 }),
          C.cast(S, f, [
            { src: C.CAST.nisaKaget, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
