<!-- Hook: Beni's phone floats in a warm backdrop. Frame 0 is fully drawn (thumbnail): a plain screen with "Rp10.000 SEKALI MAIN" and a glowing generic MAIN button (no game, no site). On "menang" a thought bubble asks SIAPA TAHU MENANG BESAR?. On "stop" Nisa's hand slaps the phone, it shakes, the button greys out and a red STOP stamp slams; on "judol" a JUDOL tag. Beni, then Nisa. Educational and anti-gambling: no real site or game is drawn. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #f4e4c8;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="1.1333" id="hook-sfx-main" class="clip" src="public/sfx/pop-in.wav" data-at="word:sekali" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.6667" id="hook-sfx-bubble" class="clip" src="public/sfx/pop-in.wav" data-at="word:menang" data-track-index="13" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="3.8" id="hook-sfx-slap" class="clip" src="public/sfx/click.wav" data-at="word:stop-4" data-track-index="14" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="3.9333" id="hook-sfx-stamp" class="clip" src="public/sfx/stamp.wav" data-at="word:stop" data-track-index="15" data-volume="0.4"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.5667" id="hook-sfx-tag" class="clip" src="public/sfx/pop-in.wav" data-at="word:judol" data-track-index="16" data-volume="0.09"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const SKIN = "#d9a07a";
      // the phone: a plain screen with a price and a glowing generic button (dims once stopped)
      const PHONE = (f, { glow, dead, buzz }) => {
        const pulse = 0.5 + 0.5 * Math.sin(f / 5);
        const btn = dead > 0.5 ? "#c9c3b6" : "#c6f432";
        const halo = dead > 0.5 ? "" : `<rect x="${n(-150 - 14 * pulse)}" y="${n(168 - 14 * pulse)}" width="${n(300 + 28 * pulse)}" height="${n(84 + 28 * pulse)}" rx="46" fill="#c6f432" opacity="${n(0.28 + 0.22 * pulse, 3)}"/>`;
        return `<g transform="translate(540 850) rotate(${n(buzz, 2)}) scale(0.92)"><rect x="-190" y="-315" width="380" height="630" rx="44" fill="${INK}"/>
<clipPath id="hook-scr"><rect x="-168" y="-285" width="336" height="570" rx="22"/></clipPath><g clip-path="url(#hook-scr)">
<rect x="-168" y="-285" width="336" height="570" fill="#fffaf0"/>
<rect x="-168" y="-285" width="336" height="64" fill="${INK}"/><text x="0" y="-242" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="28" letter-spacing="5" fill="#fff">SEKALI MAIN</text>
<rect x="-130" y="-190" width="260" height="14" rx="7" fill="#e3dccd"/><rect x="-130" y="-160" width="190" height="14" rx="7" fill="#e3dccd"/>
<text x="0" y="-30" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="62" fill="${INK}">Rp10.000</text>
<text x="0" y="14" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="18" letter-spacing="2" fill="#8a6f55">ILUSTRASI</text>
${halo}<g transform="translate(0 ${n(210 + 5 * dead)}) scale(${n(1 - 0.05 * dead, 3)})"><rect x="-140" y="-40" width="280" height="80" rx="40" fill="${btn}" stroke="${INK}" stroke-width="6"/><text x="0" y="14" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="34" letter-spacing="1" fill="${dead > 0.5 ? "#8d877b" : INK}">MAIN Rp10.000</text></g>
</g><rect x="-40" y="-306" width="80" height="12" rx="6" fill="#111"/></g>`;
      };
      const BUBBLE = (p, f) => p <= 0 ? "" : `<g transform="translate(${n(790)} ${n(600 + 4 * Math.sin(f / 14))}) scale(${n(0.5 + 0.5 * p, 3)})" opacity="${n(p, 3)}">
<circle cx="-120" cy="110" r="12" fill="#fffaf0" stroke="${INK}" stroke-width="5"/><circle cx="-84" cy="84" r="19" fill="#fffaf0" stroke="${INK}" stroke-width="5"/>
<path d="M-150 -20 Q-150 -90 -80 -92 Q-40 -130 20 -100 Q80 -118 130 -70 Q170 -40 150 10 Q150 70 70 66 Q0 90 -60 62 Q-150 66 -150 -20 Z" fill="#fffaf0" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
<text x="0" y="-38" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="31" letter-spacing="1" fill="${INK}">SIAPA TAHU</text>
<text x="0" y="2" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="36" letter-spacing="1" fill="#c0392b">MENANG BESAR?</text></g>`;
      // Nisa's hand slapping in from the right
      const HAND = (p, out) => {
        const a = p * (1 - out);
        if (a <= 0.001) return "";
        const hx = 1150 + (600 - 1150) * p + out * 520;
        const hy = 640 + (900 - 640) * p - out * 120;
        return `<g opacity="${n(Math.min(1, a * 3), 3)}"><path d="M1250 420 L${n(hx)} ${n(hy)}" stroke="${INK}" stroke-width="92" stroke-linecap="round"/><path d="M1250 420 L${n(hx)} ${n(hy)}" stroke="#4e6a8f" stroke-width="76" stroke-linecap="round"/>
<circle cx="${n(hx)}" cy="${n(hy)}" r="62" fill="${SKIN}" stroke="${INK}" stroke-width="6"/><path d="M${n(hx - 38)} ${n(hy - 40)} l-6 -26 M${n(hx - 12)} ${n(hy - 54)} l-2 -30 M${n(hx + 14)} ${n(hy - 54)} l4 -28" stroke="${INK}" stroke-width="8" stroke-linecap="round"/></g>`;
      };
      const BG = (f, front) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="hook-glow" cx="50%" cy="46%" r="55%"><stop offset="0" stop-color="#fff3d6"/><stop offset="1" stop-color="#f4e4c8"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#hook-glow)"/>
<g fill="#f2c27a" opacity="0.5">${Array.from({ length: 14 }, (_, i) => `<circle cx="${n(80 + 920 * W.hash(i * 3 + 1))}" cy="${n(540 + 600 * W.hash(i * 3 + 2))}" r="${n(10 + 22 * W.hash(i * 3 + 3))}"/>`).join("")}</g>
<rect x="0" y="1150" width="1080" height="770" fill="#e3c9a0"/><rect x="0" y="1150" width="1080" height="14" fill="#c8ab7c"/>
${W.dust(f, { x: 100, y: 540, w: 880, h: 600, count: 16, seed: 21, color: "#fff3cf", alpha: 0.45 })}
${front}</svg>`;
      window.__timelines["hook"] = F1.scene("hook", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, occ = 0) => F1.wordFrame(S, x, occ);
        const menang = w("menang");
        const stop = w("stop");
        const judol = w("judol");
        const bubble = F1.ramp(f, menang - 2, 12, F1.expoOut);
        const slap = F1.ramp(f, stop - 6, 6, F1.expoOut);
        const away = F1.ramp(f, stop + 16, 10);
        const dead = F1.ramp(f, stop, 3);
        // the phone shakes on impact, else floats
        const hit = f >= stop - 1 && f < stop + 12 ? 4 * Math.sin((f - stop) * 2.4) * (1 - (f - stop + 1) / 13) : 0;
        const buzz = hit + (f < stop ? 0.8 * Math.sin(f / 9) : 0);
        const bob = 8 * Math.sin(f / 22);
        const phone = `<g transform="translate(0 ${n(bob * (1 - dead))})">${PHONE(f, { dead, buzz })}</g>${BUBBLE(bubble * (1 - F1.ramp(f, stop, 6)), f)}`;
        const stopped = f >= stop;
        return F1.join(
          C.stage(f, D, BG(f, phone + HAND(slap, away)), {
            whip: false,
            zoom: 0.03,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 60 },
              { at: stop - 4, scale: 1.05, ox: 50, oy: 62, ease: 10 },
              { at: F1.line(S, 1).start + 40, scale: 1, ox: 50, oy: 60, ease: 14 },
            ],
          }),
          C.vignette(0.22, "50% 58%", 50),
          C.stamp(f, { at: stop, x: 330, y: 790, rot: -9, text: "STOP", size: 128, color: "#c0392b" }),
          C.tag(f, { at: judol, x: 590, y: 1080, rot: 4, text: "ITU JUDOL", size: 40, light: true }),
          C.progress(f, { step: 1, label: "LAPORAN MASUK" }),
          C.hud(f, {
            at: -14,
            kicker: "LAPORAN MASUK",
            big: stopped ? "JUDOL" : "Rp10.000",
            sub: stopped ? "AJAKAN 'COBA SEKALI'" : "SEKALI MAIN · ILUSTRASI",
            w: 500,
            bigSize: 64,
          }),
          C.cast(S, f, [
            { src: C.CAST.beniKaget, x: 540, y: 1200, w: 420, at: -14 },
            { src: C.CAST.nisaKaget, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
