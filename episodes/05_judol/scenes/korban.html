<!-- Korban: ten standing figures in two rows; on "tujuh puluh satu persen" seven turn red one by one and the HUD counts 71% (PPATK via Kontan, reported 15 Mei 2025; 7 of 10 is only the picture of 71%). On "Keluarganya" the rows give way to one red figure with six empty ghost outlines around it; from "sekitar" to "lain" the six fill in and get linked (WHO fact sheet, 2 Des 2024: about six others affected per high-risk gambler). Muklis, Nisa, Muklis. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #efe3cb;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="korban" data-width="1080" data-height="1920">
    <div id="korban-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="korban-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="0.4" id="korban-sfx-row" class="clip" src="public/sfx/pop-in.wav" data-at="word:paling" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.5667" id="korban-sfx-red" class="clip" src="public/sfx/tick.wav" data-at="word:tujuh" data-track-index="13" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="5" id="korban-sfx-pct" class="clip" src="public/sfx/ding-num.wav" data-at="word:persen" data-track-index="14" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="9.7" id="korban-sfx-fam" class="clip" src="public/sfx/pop-in.wav" data-at="word:Keluarganya" data-track-index="15" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="13.7667" id="korban-sfx-risk" class="clip" src="public/sfx/click.wav" data-at="word:berisiko" data-track-index="16" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="15.3667" id="korban-sfx-six" class="clip" src="public/sfx/tick.wav" data-at="word:sekitar" data-track-index="17" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="15.7667" id="korban-sfx-n" class="clip" src="public/sfx/ding-num.wav" data-at="word:enam" data-track-index="18" data-volume="0.07"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const KINDS = ["man", "hijab", "peci", "man", "hijab", "kid", "man", "old", "hijab", "peci"];
      const NEUTRAL = ["#b5ac9c", "#a9b3bd", "#c2b7a3", "#9fae9f", "#b9a9b4"];
      // ten players in two rows; the first `red` of them are highlighted (picture of 71% = 7 of 10)
      const ROWS = (f, o) => Array.from({ length: 10 }, (_, i) => {
        const col = i % 5;
        const row = Math.floor(i / 5);
        const x = 180 + col * 180;
        const y = 810 + row * 225;
        const p = F1.ramp(f, o.rowAt + i * 2, 10, F1.expoOut);
        const hot = F1.ramp(f, o.hotAt + i * o.hotStep, 8, F1.expoOut) * (i < 7 ? 1 : 0);
        const pop = hot > 0 && hot < 1 ? 1 : 0;
        const halo = hot > 0 ? `<circle cx="${x}" cy="${y - 110}" r="${n(70 * hot)}" fill="#d0413a" opacity="${n(0.2 * hot, 3)}"/><ellipse cx="${x}" cy="${y + 4}" rx="${n(48 * hot)}" ry="10" fill="#d0413a" opacity="0.45"/>` : "";
        return `<g opacity="${n(p * o.rows, 3)}">${halo}${W.person(f, { x, y: y + 20 * (1 - p), s: 1.0 + 0.04 * pop, kind: KINDS[i], cloth: hot > 0.5 ? "#d0413a" : NEUTRAL[i % 5], skin: ["#c68a5e", "#a8724c", "#d9a07a"][i % 3], veil: hot > 0.5 ? "#7a2a26" : "#c9c0ae", amp: 0 })}</g>`;
      }).join("");
      // the family view: a red centre figure with six ghosts that fill in and get linked
      const RING = [
        [200, 830],
        [370, 715],
        [710, 715],
        [880, 830],
        [710, 975],
        [370, 975],
      ];
      const FAMILY = (f, o) => {
        if (o.fam <= 0.001) return "";
        const cx = 540;
        const cy = 930;
        const ghosts = RING.map((r, i) => `<g opacity="0.32">${W.person(f, { x: r[0], y: r[1], s: 0.85, kind: KINDS[i + 3], cloth: "#e3dccd", skin: "#e8dcc3", veil: "#e3dccd", pants: "#cfc4ad", amp: 0 })}</g>`).join("");
        const filled = RING.map((r, i) => {
          const p = F1.ramp(f, o.fillAt + i * o.fillStep, 10, F1.expoOut);
          if (p <= 0) return { link: "", fig: "" };
          const link = `<path d="M${cx} ${cy - 100} L${r[0]} ${r[1] - 80}" stroke="#d0413a" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round" opacity="${n(p, 3)}" fill="none"/>`;
          const fig = `<g opacity="${n(p, 3)}">${W.person(f, { x: r[0], y: r[1] + 14 * (1 - p), s: 0.85 + 0.05 * (1 - p), kind: KINDS[i + 3], cloth: ["#e2b6c0", "#d9a441", "#7fa88a", "#4e6a8f", "#c98a6a", "#8fae8c"][i], skin: ["#c68a5e", "#a8724c", "#d9a07a", "#b98058", "#8c5a3c", "#c68a5e"][i], veil: "#7a6a9a", amp: 0 })}</g>`;
          return { link, fig };
        });
        const risk = F1.ramp(f, o.riskAt, 10, F1.expoOut);
        const centre = `<ellipse cx="${cx}" cy="${cy + 4}" rx="${n(66 + 6 * Math.sin(f / 8) * risk, 1)}" ry="12" fill="#d0413a" opacity="${n(0.2 + 0.3 * risk, 3)}"/>
<g transform="translate(0 ${n(-6 * risk * Math.abs(Math.sin(f / 12)))})">${W.person(f, { x: cx, y: cy, s: 1.2, kind: "man", cloth: "#d0413a", skin: "#a8724c", amp: 0 })}</g>`;
        return `<g opacity="${n(o.fam, 3)}">${ghosts}${filled.map((x) => x.link).join("")}${centre}${filled.map((x) => x.fig).join("")}</g>`;
      };
      const BG = (f, o) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="korban-glow" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff3d6"/><stop offset="1" stop-color="#efe3cb"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#korban-glow)"/>
<rect x="0" y="1160" width="1080" height="760" fill="#cfb68b"/>
${W.dust(f, { x: 100, y: 540, w: 880, h: 600, count: 14, seed: 41, color: "#fff3cf", alpha: 0.4 })}
${o.rows > 0.001 ? ROWS(f, o) : ""}${FAMILY(f, o)}
${o.noteA > 0.001 ? `<g opacity="${n(o.noteA * o.rows, 3)}" transform="translate(90 1066)"><rect width="840" height="80" rx="16" fill="#fffaf0" stroke="${INK}" stroke-width="6"/><text x="420" y="38" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="27" letter-spacing="1" fill="${INK}">ILUSTRASI: 7 DARI 10 ≈ 71% DARI 1.066.000 PEMAIN</text><text x="420" y="66" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#8a6f55">Sumber: PPATK via Kontan (15 Mei 2025)</text></g>` : ""}
${o.noteB > 0.001 ? `<g opacity="${n(o.noteB, 3)}" transform="translate(90 1066)"><rect width="840" height="80" rx="16" fill="#fffaf0" stroke="${INK}" stroke-width="6"/><text x="420" y="38" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="27" letter-spacing="1" fill="${INK}">1 PENJUDI BERISIKO TINGGI → ±6 ORANG LAIN IKUT TERDAMPAK</text><text x="420" y="66" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#8a6f55">Sumber: WHO (2 Des 2024)</text></g>` : ""}</svg>`;
      window.__timelines["korban"] = F1.scene("korban", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, occ = 0) => F1.wordFrame(S, x, occ);
        const tujuh = w("tujuh");
        const persen = w("persen");
        const pemainnya = w("pemainnya");
        const kel = w("Keluarganya");
        const who = w("WHO");
        const sekitar = w("sekitar");
        const lain = w("lain");
        const o = {
          rows: 1 - F1.ramp(f, kel - 8, 10),
          rowAt: 6,
          hotAt: tujuh,
          hotStep: (pemainnya - tujuh) / 7,
          noteA: F1.ramp(f, tujuh, 12, F1.expoOut),
          fam: F1.ramp(f, kel - 4, 12, F1.expoOut),
          riskAt: w("penjudi"),
          fillAt: sekitar,
          fillStep: (lain + 4 - sekitar) / 6,
          noteB: F1.ramp(f, who, 12, F1.expoOut),
        };
        const pct = F1.ramp(f, tujuh, persen + 6 - tujuh, F1.easeOut);
        const hud =
          f < kel - 6
            ? C.hud(f, { at: 4, kicker: "KORBAN", big: f < tujuh ? "?" : Math.round(71 * pct) + "%", sub: "PEMAIN BERPENGHASILAN < Rp5 JUTA/BULAN", src: "PPATK via Kontan (15 Mei 2025)", w: 560, bigSize: 72 })
            : f < who - 4
              ? C.hud(f, { at: kel - 6, kicker: "DAMPAK KE KELUARGA", big: "KELUARGA", sub: "IKUT TERDAMPAK", w: 560, bigSize: 56 })
              : C.hud(f, { at: who - 4, kicker: "DAMPAK KE KELUARGA", big: "±6 ORANG", sub: "PER 1 PENJUDI BERISIKO TINGGI", src: "WHO (2 Des 2024)", w: 560, bigSize: 60 });
        return F1.join(
          C.stage(f, D, BG(f, o), {
            zoom: 0.04,
            shots: [
              { at: 0, scale: 1.02, ox: 50, oy: 62 },
              { at: tujuh - 6, scale: 1.05, ox: 50, oy: 64, ease: 14 },
              { at: kel - 8, scale: 1.02, ox: 50, oy: 62, ease: 14 },
              { at: sekitar - 6, scale: 1.05, ox: 50, oy: 62, ease: 14 },
            ],
          }),
          C.vignette(0.22, "50% 58%", 55),
          C.progress(f, { step: 6, label: "KORBAN" }),
          hud,
          C.cast(S, f, [
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.nisaKaget, x: 540, y: 1200, w: 380 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
