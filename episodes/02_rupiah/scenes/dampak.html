<!-- Dampak: market stalls with swaying awnings and shoppers walking past. The HP box hops on "HP", the KEDELAI IMPOR sack on "Kedelai", tahu and tempe on "tahu", the medicine strip on "obat"; fact tags pop beside them and an IMPOR stamp slams onto the sack on "impor"; cuts on "Kedelai" and "Bahan". Muklis, Nisa asks about medicine, Muklis. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #d9d4c8;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="dampak" data-width="1080" data-height="1920">
    <div id="dampak-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="dampak-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="20" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="1.1667" id="dampak-sfx-hp" class="clip" src="public/sfx/pop-in.wav" data-at="word:HP" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.0667" id="dampak-sfx-kedelai" class="clip" src="public/sfx/pop-in.wav" data-at="word:Kedelai" data-track-index="13" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.6333" id="dampak-sfx-tahu" class="clip" src="public/sfx/pop-in.wav" data-at="word:tahu" data-track-index="14" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.6667" id="dampak-sfx-impor" class="clip" src="public/sfx/stamp.wav" data-at="word:impor" data-track-index="15" data-volume="0.3"></audio>
    <audio data-hf-media-start-basis="local" data-start="5.9" id="dampak-sfx-obat" class="clip" src="public/sfx/pop-in.wav" data-at="word:obat" data-track-index="16" data-volume="0.09"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      // an item hops when it is named: a quick jump with a squash on landing
      const hop = (f, at) => {
        const t = f - at;
        if (t < 0 || t > 16) return { y: 0, sq: 1 };
        return t < 10 ? { y: -70 * Math.sin((Math.PI * t) / 10), sq: 1 } : { y: 0, sq: 1 - 0.12 * Math.sin((Math.PI * (t - 10)) / 6) };
      };
      const item = (h, cx, by, body) => `<g transform="translate(${cx} ${n(by + h.y)}) scale(${n(2 - h.sq, 3)} ${n(h.sq, 3)}) translate(${-cx} ${-by})">${body}</g>`;
      const awning = (f, k, fill, stripe) => `<g transform="translate(240 0) skewX(${n(2.2 * Math.sin(f / 17 + k), 2)}) translate(-240 0)"><path d="M0 0 H480 L450 90 H30 Z" fill="${fill}"/><path d="M60 0 L90 90 M160 0 L170 90 M260 0 L260 90 M360 0 L350 90" stroke="${stripe}" stroke-width="22"/></g>`;
      const BG = (f, hp) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#d6d9d4"/>
<g style="filter:blur(3px)"><path d="M0 640 L180 520 L330 610 L520 470 L700 600 L880 500 L1080 590 L1080 760 L0 760 Z" fill="#9b958c"/><rect x="0" y="700" width="1080" height="120" fill="#bdb3a3"/>
<g opacity="0.8">${W.row(f, { y: 800, s: 0.55, count: 10, seed: 41, speed: 1 })}</g></g>
<rect x="0" y="800" width="1080" height="1120" fill="#b8a68c"/>
<g transform="translate(40 520)">${awning(f, 0, "#3f78b5", "#6b9bd0")}
<rect x="30" y="90" width="16" height="330" fill="#5b4636"/><rect x="434" y="90" width="16" height="330" fill="#5b4636"/><rect x="10" y="300" width="460" height="40" fill="#8f6b50"/>
${item(hp.hp, 130, 300, `<rect x="70" y="170" width="120" height="130" rx="10" fill="#f6efe1" stroke="#2a2a2e" stroke-width="5"/><rect x="104" y="190" width="52" height="92" rx="9" fill="#16171c"/><text x="130" y="160" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="26" fill="#2a2a2e">HP</text>`)}
${item(hp.obat, 345, 300, `<rect x="250" y="210" width="190" height="90" rx="12" fill="#e9eef2" stroke="#2a2a2e" stroke-width="5"/><g fill="#d0413a" stroke="#2a2a2e" stroke-width="3"><rect x="268" y="230" width="34" height="20" rx="10"/><rect x="318" y="230" width="34" height="20" rx="10"/><rect x="368" y="230" width="34" height="20" rx="10"/><rect x="268" y="262" width="34" height="20" rx="10"/><rect x="318" y="262" width="34" height="20" rx="10"/><rect x="368" y="262" width="34" height="20" rx="10"/></g><text x="345" y="200" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="26" fill="#2a2a2e">OBAT</text>`)}</g>
<g transform="translate(560 520)">${awning(f, 2, "#d9a441", "#ecc56a")}
<rect x="30" y="90" width="16" height="330" fill="#5b4636"/><rect x="434" y="90" width="16" height="330" fill="#5b4636"/><rect x="10" y="300" width="460" height="40" fill="#8f6b50"/>
${item(hp.kedelai, 120, 300, `<path d="M50 300 Q40 190 70 170 L170 170 Q200 190 190 300 Z" fill="#d8c79d" stroke="#2a2a2e" stroke-width="5"/><path d="M70 170 Q120 150 170 170" stroke="#2a2a2e" stroke-width="5" fill="#e6d7ad"/><text x="120" y="232" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="24" fill="#5b4636">KEDELAI</text><text x="120" y="262" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="22" fill="#c0392b">IMPOR</text>`)}
${item(hp.tahu, 345, 300, `<g stroke="#2a2a2e" stroke-width="5"><rect x="250" y="236" width="80" height="64" rx="8" fill="#f3e6c4"/><rect x="290" y="196" width="80" height="44" rx="8" fill="#f3e6c4"/><rect x="340" y="246" width="110" height="54" rx="8" fill="#c9a66b"/></g><g fill="#a8854f"><circle cx="365" cy="262" r="5"/><circle cx="390" cy="280" r="5"/><circle cx="420" cy="262" r="5"/><circle cx="430" cy="284" r="5"/></g>`)}</g>
${W.row(f, { y: 1215, s: 1.05, count: 5, seed: 14, speed: 1.9 })}</svg>`;
      window.__timelines["dampak"] = F1.scene("dampak", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const kedelai = w("Kedelai");
        const bahan = w("Bahan");
        const hp = { hp: hop(f, w("HP")), kedelai: hop(f, kedelai), tahu: hop(f, w("tahu")), obat: hop(f, w("obat")) };
        return F1.join(
          C.stage(f, D, BG(f, hp), {
            zoom: 0.05,
            shots: [
              { at: 0, scale: 1.1, ox: 50, oy: 40 },
              { at: kedelai, scale: 1.3, ox: 78, oy: 40, ease: 14 },
              { at: bahan, scale: 1.3, ox: 22, oy: 40, ease: 14 },
            ],
          }),
          C.vignette(0.35, "50% 50%", 55),
          C.hud(f, {
            at: 4,
            kicker: "DAMPAK",
            big: f < kedelai ? "IMPOR ▲" : f < bahan ? "±100%" : "85%",
            sub: f < kedelai ? "BAYARNYA PAKAI DOLAR" : f < bahan ? "KEDELAI DARI IMPOR" : "BAHAN BAKU OBAT DARI IMPOR",
            src: f < kedelai ? "" : f < bahan ? "Menko Pangan via Kompas TV (Jun 2026)" : "Menperin via IDX Channel (Nov 2025)",
            w: 500,
          }),
          C.stamp(f, { at: w("impor"), x: 560, y: 660, rot: -10, text: "IMPOR" }),
          C.tag(f, { at: w("impor") + 8, x: 600, y: 900, rot: -4, text: "TAHU TEMPE ▲" }),
          C.tag(f, { at: w("obat"), x: 120, y: 900, rot: 3, text: "OBAT ▲" }),
          C.progress(f, { step: 3, label: "BUKTI 2 · KORBAN" }),
          C.cast(S, f, [
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
