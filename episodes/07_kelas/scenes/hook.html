<!-- Hook: a warm cream desk. Frame 0 is fully drawn (thumbnail): a payslip with a lime "GAJI NAIK" badge, a paper shopping bag full of groceries and an empty open wallet. On "naik" the badge and arrow pulse; on "makin" the bag starts to shrink and its groceries drop out; on "bokek" the wallet shakes. Nisa: on "nggak" a crowd of walking extras fades in behind (not alone) and the KASUS #07 stamp slams on "sendirian". Beni (surprised), then Nisa. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #f4e4c8;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0.6333" id="hook-sfx-naik" class="clip" src="public/sfx/pop-in.wav" data-at="word:naik" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.2333" id="hook-sfx-makin" class="clip" src="public/sfx/swoosh-soft.wav" data-at="word:makin" data-track-index="13" data-volume="0.15"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.5667" id="hook-sfx-bokek" class="clip" src="public/sfx/fall.wav" data-at="word:tipis" data-track-index="14" data-volume="0.1"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.0667" id="hook-sfx-stamp" class="clip" src="public/sfx/stamp.wav" data-at="word:berikutnya" data-track-index="15" data-volume="0.4"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      // the payslip: rows with label text and grey value bars (no figures), a lime GAJI NAIK badge with an up arrow
      const SLIP = (f, { pulse, arrowY }) => `<g transform="translate(330 800) rotate(-3)">
<rect x="-230" y="-270" width="460" height="540" rx="14" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>
<rect x="-230" y="-270" width="460" height="76" rx="14" fill="${INK}"/><rect x="-230" y="-220" width="460" height="26" fill="${INK}"/>
<text x="-196" y="-216" font-family="Oswald" font-weight="600" font-size="40" letter-spacing="5" fill="#fff">SLIP GAJI</text>
<text x="206" y="-216" text-anchor="end" font-family="JetBrains Mono" font-weight="500" font-size="18" letter-spacing="2" fill="#c9c6c0">ILUSTRASI</text>
${["GAJI POKOK", "TUNJANGAN", "POTONGAN"].map((t, i) => `<text x="-196" y="${-130 + i * 62}" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="2" fill="#6b5f52">${t}</text><rect x="${i === 2 ? 20 : 60}" y="${-152 + i * 62}" width="${i === 2 ? 170 : 130}" height="26" rx="8" fill="#ddd3bf"/>`).join("")}
<line x1="-196" y1="62" x2="196" y2="62" stroke="${INK}" stroke-width="4" stroke-dasharray="10 8"/>
<g transform="translate(0 168) rotate(-4) scale(${n(1 + pulse, 3)})"><rect x="-190" y="-62" width="380" height="124" rx="22" fill="#c6f432" stroke="${INK}" stroke-width="7"/>
<text x="26" y="20" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="62" letter-spacing="2" fill="${INK}">GAJI NAIK</text>
<path d="M-140 ${n(24 + arrowY)} L-140 ${n(-30 + arrowY)} M-170 ${n(-4 + arrowY)} L-140 ${n(-34 + arrowY)} L-110 ${n(-4 + arrowY)}" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g></g>`;
      // the paper bag: groceries stick out and drop away as it shrinks
      const BAG = (f, { shrink, gone }) => {
        const sc = 1 - 0.42 * shrink;
        const items = [
          { dx: -48, ph: 0.0, draw: `<ellipse cx="0" cy="-26" rx="20" ry="42" fill="#5fae7a" stroke="${INK}" stroke-width="5"/><path d="M0 -66 V10" stroke="${INK}" stroke-width="4"/>` },
          { dx: 8, ph: 0.35, draw: `<rect x="-17" y="-70" width="34" height="84" rx="6" fill="#e9e2d3" stroke="${INK}" stroke-width="5"/><rect x="-17" y="-48" width="34" height="22" fill="#d0413a"/>` },
          { dx: 58, ph: 0.7, draw: `<ellipse cx="0" cy="-12" rx="30" ry="22" fill="#d9a441" stroke="${INK}" stroke-width="5"/><path d="M-14 -22 L-4 -10 M6 -24 L14 -10" stroke="${INK}" stroke-width="4"/>` },
        ]
          .map((it) => {
            const g = F1.ramp(gone, it.ph * 0.6, 0.4);
            return g >= 1 ? "" : `<g transform="translate(${it.dx} ${n(-120 + 140 * g * g)}) scale(${n(1 - g * 0.6, 3)})" opacity="${n(1 - g, 3)}">${it.draw}</g>`;
          })
          .join("");
        return `<g transform="translate(770 780) scale(${n(sc, 3)})">${items}
<path d="M-70 -120 Q-70 -190 0 -190 Q70 -190 70 -120" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>
<path d="M-100 -130 H100 L116 0 H-116 Z" fill="#e8c28a" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
<path d="M-100 -130 H100 L104 -100 H-104 Z" fill="#d8ab6c"/><path d="M-100 -130 H100 L116 0 H-116 Z" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
<text x="0" y="-52" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="40" letter-spacing="3" fill="#8a5f2e">BELANJA</text></g>`;
      };
      // an open, empty wallet: dust swirls and a sweat drop
      const WALLET = (f, { shake }) => `<g transform="translate(${n(770 + shake)} 970)">
<rect x="-150" y="-80" width="300" height="170" rx="26" fill="#8a6f55" stroke="${INK}" stroke-width="7"/>
<rect x="-130" y="-62" width="260" height="110" rx="16" fill="#3e3128" stroke="${INK}" stroke-width="5"/>
<path d="M-90 -20 H90" stroke="#5a4838" stroke-width="5" stroke-dasharray="8 12"/>
<path d="M-150 0 H-90 Q-70 0 -70 22 Q-70 44 -90 44 H-150 Z" fill="#a98a68" stroke="${INK}" stroke-width="6"/><circle cx="-102" cy="22" r="9" fill="#f4e4c8" stroke="${INK}" stroke-width="4"/>
<path d="M-60 6 q20 -26 40 0 t40 0 t40 0" fill="none" stroke="#c9c6c0" stroke-width="5" stroke-linecap="round" opacity="0.7" transform="translate(0 ${n(5 * Math.sin(f / 7))})"/>
<path d="M150 -70 q18 26 0 44 q-18 -18 0 -44 Z" fill="#7bc3e8" stroke="${INK}" stroke-width="5" transform="translate(30 ${n(4 * Math.sin(f / 9))})"/></g>`;
      // background-only ambient motion: deterministic, continuous in f (works with fractional frames)
      const DRIFT = (f, { seed, count, y0, y1, color, a }) => `<g fill="${color}" opacity="${a}">${Array.from({ length: count }, (_, i) => { const h = (k) => F1.world.hash(seed + i * 5 + k); return `<circle cx="${n(60 + 960 * h(1) + 26 * Math.sin(f * 0.035 * (0.6 + h(2)) + h(3) * 6.28), 1)}" cy="${n(y0 + (y1 - y0) * h(4) + 34 * Math.sin(f * 0.026 * (0.6 + h(5)) + h(6) * 6.28), 1)}" r="${n(8 + 18 * h(7), 1)}"/>`; }).join("")}</g>`;
      const SWEEP = (f, { color, a, y0, y1 }) => `<g style="filter:blur(26px)" opacity="${n(a * (0.65 + 0.35 * Math.sin(f * 0.021)), 3)}" transform="translate(${n(-260 + 1000 * (0.5 + 0.5 * Math.sin(f * 0.0175)), 1)} 0)"><polygon points="0,${y0} 200,${y0} 100,${y1} -100,${y1}" fill="${color}"/></g>`;
      window.__timelines["hook"] = F1.scene("hook", (f, { S, D }) => {
        const C = F1.cine;
        const naik = F1.wordFrame(S, "naik");
        const makin = F1.wordFrame(S, "makin");
        const bokek = F1.wordFrame(S, "tipis");
        const nggak = F1.wordFrame(S, "Kamu");
        const sendirian = F1.wordFrame(S, "berikutnya");
        const pulse = f >= naik && f < naik + 16 ? 0.14 * Math.sin((Math.PI * (f - naik)) / 16) : 0;
        const arrowY = f >= naik ? -10 * Math.abs(Math.sin((f - naik) / 5)) * (1 - F1.ramp(f, naik + 40, 20)) : 0;
        const shrink = F1.ramp(f, makin, bokek - makin + 14, F1.easeOut);
        const gone = F1.ramp(f, makin, bokek - makin + 8, F1.easeOut);
        const shake = f >= bokek ? 7 * Math.sin((f - bokek) * 2.4) * (1 - F1.ramp(f, bokek, 22)) : 0;
        const crowd = F1.ramp(f, nggak, 14, F1.expoOut);
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="hook-glow" cx="50%" cy="46%" r="58%"><stop offset="0" stop-color="#fff3d6"/><stop offset="1" stop-color="#f1dfbf"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#hook-glow)"/>
${DRIFT(f, { seed: 200, count: 8, y0: 560, y1: 1050, color: "#f2c27a", a: 0.28 })}
${SWEEP(f, { color: "#fffaf0", a: 0.22, y0: 380, y1: 1100 })}
<g fill="#f2c27a" opacity="0.5">${Array.from({ length: 14 }, (_, i) => `<circle cx="${n(80 + 920 * W.hash(i * 3 + 1))}" cy="${n(500 + 640 * W.hash(i * 3 + 2))}" r="${n(10 + 22 * W.hash(i * 3 + 3))}"/>`).join("")}</g>
<rect x="0" y="1140" width="1080" height="780" fill="#e3c9a0"/><rect x="0" y="1140" width="1080" height="14" fill="#c8ab7c"/>
<g opacity="${n(crowd * 0.9, 3)}">${crowd > 0 ? W.row(f, { y: 1130, s: 0.62, count: 12, seed: 71, speed: 0.9, bob: 8 }) : ""}</g>
${SLIP(f, { pulse, arrowY })}${BAG(f, { shrink, gone })}${WALLET(f, { shake })}</svg>`;
        return F1.join(
          C.stage(f, D, BG, {
            whip: false,
            zoom: 0.04,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 60 },
              { at: makin - 4, scale: 1.08, ox: 66, oy: 58, ease: 12 },
              { at: F1.wordFrame(S, "Kamu"), scale: 1, ox: 50, oy: 60, ease: 12 },
            ],
          }),
          C.vignette(0.22, "50% 58%", 50),
          C.stamp(f, { at: sendirian, x: 610, y: 480, rot: -6, text: "KASUS #07", size: 48 }),
          C.progress(f, { step: 1, label: "LAPORAN MASUK" }),
          C.hud(f, { at: -14, kicker: "LAPORAN MASUK", big: "GAJI NAIK ▲", sub: "ILUSTRASI · DOMPET MAKIN TIPIS", bigSize: 52, w: 540 }),
          C.cast(S, f, [
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380, at: -14 },
          ]),
        );
      });
    })();
  </script>
</template>
