<!-- Kenapa: three evidence cards stack up on Muklis's one line. "luka pandemi" (BPS: scarring effect): a cracked stair with a bandage. "Bank Dunia ... empat belas jadi delapan persen": two bars shrink 14% -> 8% (workers on middle-class wages, 2019 -> 2024). "delapan dari sepuluh": eight of ten person icons light up red (new jobs that were informal, 2019-2024, Carnegie/Chatib Basri). The HUD switches suspect by suspect. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #efe6d4;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="kenapa" data-width="1080" data-height="1920">
    <div id="kenapa-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="kenapa-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.6333" id="kenapa-sfx-1" class="clip" src="public/sfx/pop-in.wav" data-at="word:luka" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.3667" id="kenapa-sfx-2" class="clip" src="public/sfx/pop-in.wav" data-at="word:Bank" data-track-index="13" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="8.5" id="kenapa-sfx-14" class="clip" src="public/sfx/ding-num.wav" data-at="word:belas" data-track-index="14" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="8.7667" id="kenapa-sfx-8" class="clip" src="public/sfx/ding-num.wav" data-at="word:jadi" data-track-index="15" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="10.9333" id="kenapa-sfx-3" class="clip" src="public/sfx/pop-in.wav" data-at="word:Dan" data-track-index="16" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="11.7333" id="kenapa-sfx-tick" class="clip" src="public/sfx/tick.wav" data-at="word:sepuluh" data-track-index="17" data-volume="0.2"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      const INK = "#2a2a2e";
      const CX = 70;
      const CW = 870;
      const CH = 200;
      const cardY = (i) => 520 + i * 215;
      // one card: cream plate, ink outline, slides up as it appears
      const CARD = (i, p, inner) => `<g opacity="${n(p, 3)}" transform="translate(0 ${n(40 * (1 - p))})"><rect x="${CX}" y="${cardY(i)}" width="${CW}" height="${CH}" rx="22" fill="#fffaf0" stroke="${INK}" stroke-width="6"/>${inner}</g>`;
      const title = (i, t, size = 40) => `<text x="${CX + 40}" y="${cardY(i) + 58}" font-family="Oswald" font-weight="600" font-size="${size}" letter-spacing="2" fill="${INK}">${t}</text>`;
      const srcLine = (i, t) => `<text x="${CX + 40}" y="${cardY(i) + CH - 20}" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="#6f6a66">Sumber: ${t}</text>`;
      // card 1: a stair with a crack and a bandage
      const SCAR = (i, k) => {
        const x = CX + CW - 250;
        const y = cardY(i) + 40;
        return `<g transform="translate(${x} ${y})"><path d="M0 120 V92 H70 V62 H140 V32 H210 V120 Z" fill="#e0b5a8" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
<path d="M150 32 L132 66 L158 84 L136 120" fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${n(190 * k, 1)} 190"/>
<g transform="translate(138 72) rotate(-35) scale(${n(0.5 + 0.5 * k, 3)})" opacity="${n(k, 3)}"><rect x="-44" y="-15" width="88" height="30" rx="14" fill="#f2c79a" stroke="${INK}" stroke-width="5"/><rect x="-16" y="-15" width="32" height="30" fill="#e8b17a" stroke="${INK}" stroke-width="3"/></g></g>`;
      };
      // card 2: two bars, 14% (2019) and 8% (2024); full track = 20%
      const BARS = (i, a14, a8, v14, v8) => {
        const y0 = cardY(i);
        const bx = CX + 130;
        const full = 560;
        const row = (y, label, p, v, fill, val) =>
          `<text x="${CX + 40}" y="${y + 27}" font-family="JetBrains Mono" font-weight="700" font-size="22" fill="#6b5f52">${label}</text><rect x="${bx}" y="${y}" width="${full}" height="34" rx="10" fill="#ece3d0" stroke="${INK}" stroke-width="4"/><rect x="${bx}" y="${y}" width="${n(full * v * p)}" height="34" rx="10" fill="${fill}" stroke="${INK}" stroke-width="${p > 0 ? 4 : 0}"/><text x="${bx + full + 24}" y="${y + 30}" font-family="JetBrains Mono" font-weight="700" font-size="34" fill="${fill === "#d0413a" ? "#c0392b" : INK}" opacity="${n(Math.min(1, p * 3), 3)}">${val}</text>`;
        return `${row(y0 + 76, "2019", a14, 0.7, "#3f78b5", "14%")}${row(y0 + 118, "2024", a8, 0.4, "#d0413a", "8%")}`;
      };
      // card 3: ten person icons, eight light up red one by one
      const PERSON = (x, y, lit) => `<g transform="translate(${x} ${y}) scale(0.7)" stroke="${INK}" stroke-width="5" stroke-linejoin="round"><circle cx="0" cy="-44" r="22" fill="${lit ? "#d0413a" : "#e4dccb"}"/><path d="M-34 36 Q-34 -12 0 -12 Q34 -12 34 36 Z" fill="${lit ? "#d0413a" : "#e4dccb"}"/></g>`;
      window.__timelines["kenapa"] = F1.scene("kenapa", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const luka = w("luka");
        const bank = w("Bank");
        const belas = w("belas");
        const jadi = w("jadi");
        const persen = w("persen");
        const dan = w("Dan");
        const delapan1 = w("delapan", 1);
        const sepuluh = w("sepuluh");
        const p1 = F1.ramp(f, 6, 12, F1.expoOut);
        const p2 = F1.ramp(f, bank - 4, 12, F1.expoOut);
        const p3 = F1.ramp(f, dan - 4, 12, F1.expoOut);
        const k = F1.ramp(f, luka + 4, 20, F1.easeOut);
        const a14 = F1.ramp(f, belas - 14, 20, F1.easeOut);
        const a8 = F1.ramp(f, jadi - 8, 16, F1.easeOut);
        const lit = (i) => f >= delapan1 + i * 5 && i < 8;
        const icons = Array.from({ length: 10 }, (_, i) => {
          const pop = F1.ramp(f, dan + i * 2, 8, F1.backOut);
          return pop <= 0 ? "" : PERSON(CX + 76 + i * 62, cardY(2) + 134 + (1 - pop) * 14, lit(i));
        }).join("");
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs><radialGradient id="kenapa-glow" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff4da"/><stop offset="1" stop-color="#ead9bb"/></radialGradient></defs>
<rect width="1080" height="1920" fill="url(#kenapa-glow)"/>
<rect x="0" y="1160" width="1080" height="760" fill="#c9ae84"/>
${F1.world.dust(f, { x: 100, y: 500, w: 840, h: 620, count: 16, seed: 9, color: "#fff3cf", alpha: 0.45 })}
${CARD(0, p1, `${title(0, "LUKA PANDEMI")}<text x="${CX + 40}" y="${cardY(0) + 104}" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="1" fill="#6b5f52">“SCARRING EFFECT” DARI PANDEMI COVID-19</text>${SCAR(0, k)}${srcLine(0, "BPS via CNBC Indonesia (Agu 2024)")}`)}
${CARD(1, p2, `${title(1, "PEKERJA BERGAJI KELAS MENENGAH", 34)}${BARS(1, a14, a8, 0.7, 0.4)}${srcLine(1, "Bank Dunia via Investortrust (2019 → 2024)")}`)}
${CARD(2, p3, `${title(2, "8 DARI 10 LAPANGAN KERJA BARU INFORMAL", 34)}${icons}<text x="${CX + CW - 40}" y="${cardY(2) + 134}" text-anchor="end" font-family="Oswald" font-weight="700" font-size="76" fill="#c0392b" opacity="${n(F1.ramp(f, delapan1 + 30, 10), 3)}">80%</text>${srcLine(2, "Chatib Basri, Carnegie Endowment (2019–2024)")}`)}
</svg>`;
        const hud =
          f >= dan
            ? C.hud(f, { at: dan, kicker: "TERSANGKA #3", big: "8 DARI 10", sub: "LAPANGAN KERJA BARU INFORMAL", src: "Carnegie (Chatib Basri)", bigSize: 56, w: 540 })
            : f >= bank
              ? C.hud(f, { at: bank, kicker: "TERSANGKA #2", big: f < jadi ? "14%" : "14% → 8%", sub: "BERGAJI KELAS MENENGAH", src: "Bank Dunia via Investortrust", bigSize: 56, w: 540 })
              : C.hud(f, { at: 4, kicker: "TERSANGKA #1", big: "PANDEMI", sub: "“SCARRING EFFECT” (BPS)", src: "BPS via CNBC Indonesia", bigSize: 56, w: 540 });
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.03,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 58 },
              { at: bank - 6, scale: 1.04, ox: 50, oy: 56, ease: 14 },
              { at: dan - 6, scale: 1.04, ox: 50, oy: 62, ease: 14 },
            ],
          }),
          C.vignette(0.2, "50% 55%", 55),
          C.progress(f, { step: 4, label: "TERSANGKA · PENYEBAB" }),
          hud,
          C.cast(S, f, [{ src: C.CAST.muklis, x: 540, y: 1200, w: 380, at: 0 }]),
        );
      });
    })();
  </script>
</template>
