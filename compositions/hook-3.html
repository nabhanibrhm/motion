<!-- Hook 3: rewind to 2010, a sepia paddock card for the "old boys' club" and its three tags. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
  </style>
  <div id="root" data-composition-id="hook-3" data-width="1920" data-height="1080">
    <div id="hook-3-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="7.2333" id="hook-3-sfx-card" class="clip" src="public/sfx/swoosh-soft.wav" data-at="line:1-8" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="7.6333" id="hook-3-sfx-shutter" class="clip" src="public/sfx/shutter.wav" data-at="line:1+4" data-track-index="12" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.3" id="hook-3-sfx-tick" class="clip" src="public/sfx/tick.wav" data-at="word:rewind" data-track-index="13" data-volume="0.2"></audio>
  </div>
  <script>
    window.__timelines["hook-3"] = F1.scene("hook-3", (f, { S }) => {
      const { toon, objects } = F1.theme;
      const OLD = objects.old;
      const n = F1.n;
      const club = F1.line(S, 1);
      const rewind = F1.wordFrame(S, "rewind");
      const exclusive = F1.wordFrame(S, "exclusive");
      const euro = F1.wordFrame(S, "Euro-centric");
      const playground = F1.wordFrame(S, "playground");
      const lay = F1.photoLayout("card-right");
      const p = lay.photos[0];
      const t = lay.text;

      const year = Math.round(F1.interpolate(f, [rewind, rewind + 70], [2025, 2010], { ...F1.clamp, easing: (x) => 1 - Math.pow(1 - x, 3) }));
      const tickerIn = F1.ramp(f, rewind - 8, 14);
      const tickerOut = 1 - F1.ramp(f, club.start - 14, 12);
      const ticker = n(tickerIn * tickerOut, 3);
      const cardAt = club.start - 8;

      // rewind: the year runs back to 2010
      const yearBlock = `<div style="${F1.css({ position: "absolute", left: 140, top: 150, opacity: ticker })}">
<div style="${F1.css({ fontFamily: toon.font.display, fontWeight: 800, fontSize: 300, lineHeight: 1, color: OLD.cream, fontVariantNumeric: "tabular-nums" })}">${year}</div>
<div style="${F1.css({ fontFamily: toon.font.display, fontWeight: 800, fontSize: 46, color: OLD.red, marginTop: 6 })}">Rewind 15 years</div></div>`;
      const arrows = `<svg width="1920" height="1080" style="position:absolute;inset:0;opacity:${ticker}"><g fill="${OLD.amber}" opacity="0.9"><polygon points="1380,300 1380,560 1160,430"/><polygon points="1660,300 1660,560 1440,430"/></g></svg>`;

      // framed sepia paddock card
      const photo = F1.Sepia(F1.Photo({ src: "assets/archival/f1_paddock_2010.jpg", x: p.x, y: p.y, w: p.w, h: p.h, fit: "contain", at: cardAt, enter: "rise", enterFrames: 18 }, f));
      const text = `<div style="${F1.css({ position: "absolute", left: t.x, top: t.y - 20, width: t.w, opacity: n(F1.ramp(f, cardAt + 8, 16), 3), color: OLD.cream })}">
<div style="${F1.css({ fontFamily: toon.font.body, fontWeight: 800, fontSize: 26, letterSpacing: "0.14em", textTransform: "uppercase", color: OLD.red })}">Formula 1, 2010</div>
<div style="${F1.css({ fontFamily: toon.font.display, fontWeight: 800, fontSize: 84, lineHeight: 1.04, marginTop: 12 })}">Old boys&#39; club</div>
<div style="${F1.css({ width: 72, height: 6, borderRadius: 3, background: OLD.red, margin: "18px 0" })}"></div></div>`;
      const chip = { fontSize: 36, bg: OLD.tan, color: OLD.cream, border: OLD.groundDeep };
      const chips =
        F1.Chip({ ...chip, text: "Exclusive", x: t.x, y: t.y + 215, at: exclusive }, f) +
        F1.Chip({ ...chip, text: "Euro-centric", x: t.x + 250, y: t.y + 215, at: euro }, f) +
        F1.Chip({ ...chip, text: "Billionaire's playground", x: t.x, y: t.y + 305, at: playground }, f);

      const mog = F1.Mascot(
        {
          character: "mog", x: 330, y: 830, scale: 0.85, at: 0, enter: "none", facing: "right",
          look: [[0, "viewer"], [club.start, "right"]], talking: F1.isSpeaking(S, "mog", f),
          gesture: [[0, "idle"], [club.start + 20, { gesture: "point", dir: "up-right" }], [club.start + 80, "idle"]],
          expression: "neutral",
        },
        f,
      );
      const bog = F1.Mascot(
        {
          character: "bog", x: 640, y: 830, scale: 0.8, at: 0, enter: "none", facing: "left", look: "left",
          gesture: "listen", expression: [[0, "neutral"], [club.start, "confused"]], talking: false,
        },
        f,
      );
      return F1.Solid({ color: OLD.ground }) + yearBlock + arrows + photo + text + chips + mog + bog + F1.Grain({ opacity: 0.1, sepia: false, seed: 3 }, f);
    });
  </script>
</template>
