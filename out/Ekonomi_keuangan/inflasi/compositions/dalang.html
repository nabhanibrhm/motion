<!-- Dalang: dark spotlight; a Rp100.000 note appears on "nilai" and melts like ice from "sepuluh"; the HUD counts its buying power down to Rp74.400. Muklis (dimmed), then Nisa: "Kayak es batu". -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #121214;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="dalang" data-width="1080" data-height="1920">
    <div id="dalang-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="dalang-sfx-in" class="clip" src="public/sfx/whoosh.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="0" id="dalang-sfx-sub" class="clip" src="public/sfx/sub-drop.wav" data-at="0" data-track-index="15" data-volume="0.3"></audio>
    <audio data-hf-media-start-basis="local" data-start="5.3333" id="dalang-sfx-note" class="clip" src="public/sfx/pop-in.wav" data-at="word:Seratus" data-track-index="12" data-volume="0.13"></audio>
    <audio data-hf-media-start-basis="local" data-start="7" id="dalang-sfx-shrink" class="clip" src="public/sfx/fall.wav" data-at="word:sepuluh" data-track-index="13" data-volume="0.1"></audio>
    <audio data-hf-media-start-basis="local" data-start="12.6667" id="dalang-sfx-ice" class="clip" src="public/sfx/drip.wav" data-at="word:Kayak" data-track-index="14" data-volume="0.1"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      // the note, melting: m 0..1 squashes it down to 74,4% of its height and grows the drips under it
      const NOTE = (m, pop) => `<g transform="translate(540 970) scale(${n(pop, 3)} ${n(pop * (1 - 0.256 * m), 3)}) translate(0 -150) rotate(-6)">
<rect x="-300" y="-150" width="600" height="300" rx="18" fill="#e7a3ae" stroke="#111" stroke-width="6"/>
<rect x="-270" y="-120" width="540" height="240" rx="10" fill="none" stroke="#b7707d" stroke-width="4" stroke-dasharray="14 10"/>
<text x="-240" y="-50" font-family="Oswald" font-weight="600" font-size="78" fill="#7a2f3e">100.000</text>
<text x="-240" y="0" font-family="JetBrains Mono" font-weight="500" font-size="24" fill="#7a2f3e">SERATUS RIBU RUPIAH</text>
<circle cx="170" cy="20" r="80" fill="#f2c4cb" stroke="#b7707d" stroke-width="4"/>
<path d="M-300 120 Q -250 ${n(120 + 110 * m)} -200 140 Q -160 ${n(140 + 120 * m)} -110 150 Q -60 ${n(150 + 60 * m)} -10 150 Q 40 ${n(150 + 130 * m)} 90 150 Q 140 ${n(150 + 70 * m)} 190 150 Q 240 ${n(120 + 130 * m)} 300 120 L300 150 L-300 150 Z" fill="#e7a3ae" stroke="#111" stroke-width="6" stroke-linejoin="round"/></g>`;
      const drop = (x, y, r, k) => (k <= 0 ? "" : `<path transform="translate(${x} ${n(y + 60 * k)}) scale(${n(r * Math.min(1, k * 2), 3)})" d="M0 -30 q 12 -2 12 18 a 12 12 0 1 1 -24 0 q 0 -20 12 -18 Z" fill="#8fbfd8" opacity="${n(0.9 * (1 - Math.max(0, k - 0.8) * 5), 3)}"/>`);
      window.__timelines["dalang"] = F1.scene("dalang", (f, { S, D }) => {
        const C = F1.cine;
        const nilai = F1.wordFrame(S, "nilai");
        const sepuluh = F1.wordFrame(S, "sepuluh");
        const tujuh = F1.wordFrame(S, "tujuh");
        const kayak = F1.wordFrame(S, "Kayak");
        // the spotlight stutters on, then sways a little on its wire
        const light = F1.ramp(f, 0, 18) * (f > 3 && f < 9 && f % 2 ? 0.4 : 1);
        const sway = 26 * Math.sin(f / 37);
        const pop = f < nilai ? 0 : F1.ramp(f, nilai, 14, F1.expoOut);
        const m = F1.ramp(f, sepuluh, tujuh + 24 - sepuluh, F1.easeOut);
        const cycle = (start, period) => (f < start ? 0 : ((f - start) % period) / period);
        const drips = f < sepuluh ? "" : F1.join(drop(330, 1090, 1, cycle(sepuluh, 46)), drop(610, 1110, 1.2, cycle(sepuluh + 15, 52)), drop(745, 1070, 0.8, cycle(sepuluh + 30, 40)), drop(470, 1100, 0.9, cycle(kayak, 34)));
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#141416"/>
<path d="M440 0 L640 0 L${n(900 + sway)} 1150 L${n(180 + sway)} 1150 Z" fill="#2c2b2f" opacity="${n(0.8 * light, 3)}"/>
<g opacity="${n(light, 3)}">${F1.world.dust(f, { x: 260, y: 80, w: 560, h: 1000, count: 34, seed: 7, alpha: 0.45 })}</g>
<ellipse cx="540" cy="1150" rx="380" ry="60" fill="#2f2e33" opacity="${n(light, 3)}"/>
<ellipse cx="520" cy="1150" rx="${n(80 + 150 * m)}" ry="${n(10 + 16 * m)}" fill="#8fbfd8" opacity="${n(0.35 * Math.min(1, m * 3), 3)}"/>
${pop > 0 ? NOTE(m, pop) : ""}${drips}</svg>`;
        // buying power of Rp100.000: shown from "nilai", counts down to 74.400 from "tujuh"
        const value = Math.round((100000 - 25600 * F1.ramp(f, tujuh, 30, F1.easeOut)) / 100) * 100;
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.05,
            shots: [
              { at: 0, scale: 1.12, ox: 50, oy: 40 },
              { at: nilai, scale: 1, ox: 50, oy: 48 },
              { at: F1.wordFrame(S, "Seratus"), scale: 1.28, ox: 50, oy: 50, ease: 16 },
              { at: kayak, scale: 1.04, ox: 50, oy: 58 },
              { at: F1.wordFrame(S, "habis"), scale: 1.2, ox: 50, oy: 60, ease: 10 },
            ],
          }),
          C.vignette(0.75, "50% 45%", 30),
          C.hud(f, { at: 6, kicker: "DALANG SEBENARNYA", big: f < nilai ? "?" : "Rp" + value.toLocaleString("id-ID"), sub: "DAYA BELI Rp100.000 · 10 THN LAGI · INFLASI 3%/THN", w: 520, bigSize: 64 }),
          C.cast(S, f, [
            { src: C.CAST.muklis, x: 860, y: 1320, w: 320, at: 0, dim: 0.6 },
            { src: C.CAST.nisaKaget, x: 540, y: 1260, w: 360, dim: 0.85 },
          ]),
        );
      });
    })();
  </script>
</template>
