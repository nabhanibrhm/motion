<!-- Lesson: coins out from under the mattress into "legal & diawasi OJK"; then BOG pays Rp20.000, KASUS DITUTUP.
     The last frame mirrors the hook's first frame (receipt + evidence card, BOG centred) so the replay loops. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
  </style>
  <div id="root" data-composition-id="pelajaran" data-width="1080" data-height="1920">
    <div id="pelajaran-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="pelajaran-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="1.9" id="pelajaran-sfx-coins" class="clip" src="public/sfx/pop-in.wav" data-at="word:kasur" data-track-index="12" data-volume="0.13"></audio>
    <audio data-hf-media-start-basis="local" data-start="8.0667" id="pelajaran-sfx-ojk" class="clip" src="public/sfx/ding-num.wav" data-at="word:OJK" data-track-index="13" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="10.1333" id="pelajaran-sfx-pay" class="clip" src="public/sfx/cash.wav" data-at="word:bayar" data-track-index="14" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="14.4" id="pelajaran-sfx-stamp" class="clip" src="public/sfx/stamp.wav" data-at="word:ditutup" data-track-index="15" data-volume="0.45"></audio>
  </div>
  <script>
    window.__timelines["pelajaran"] = F1.scene("pelajaran", (f, { S }) => {
      const K = F1.kasus;
      const n = F1.n;
      const pen = K.pen("pelajaran", f);
      const bogLine = F1.line(S, 1);
      const wecLine = F1.line(S, 2);
      const kasur = F1.wordFrame(S, "kasur");
      const tumbuh = F1.wordFrame(S, "tumbuh");
      const legal = F1.wordFrame(S, "legal");
      const ditutup = F1.wordFrame(S, "ditutup");
      const swap = bogLine.start - 8;
      const partA = 1 - F1.ramp(f, swap, 10);

      // part A: the mattress, the coins it hides, then the "legal + OJK" shield
      const shieldIn = F1.ramp(f, legal - 4, 14);
      const coins = [0, 1, 2, 3].map((i) => {
        const at = kasur + i * 3;
        if (f < at) return "";
        const p = F1.ramp(f, at, 16, F1.expoOut);
        const to = F1.ramp(f, legal - 4 + i * 2, 16, F1.expoInOut);
        const x = F1.lerp(150 + i * 92, 290, to);
        const y = F1.lerp(F1.lerp(760, 590 - (i % 2) * 40, p), 680, to);
        return `<div style="${F1.css({ position: "absolute", left: n(x - 45), top: n(y - 45), opacity: n(1 - to, 3) })}">${K.Icon("coin", 90)}</div>`;
      }).join("");
      const mattress = `<div style="${F1.css({ position: "absolute", left: 290 - 190, top: 600, opacity: n(1 - shieldIn, 3) })}">${K.Icon("mattress", 380)}</div>`;
      const shield = f < legal - 4 ? "" : K.Pop({ x: 290, y: 680, at: legal - 4, frames: 16 }, f, K.Icon("shield", 240));
      const shieldLabel = f < legal - 4 ? "" : K.Pop({ x: 290, y: 850, at: legal, frames: 14 }, f, K.Label("legal & diawasi OJK", { size: 36, color: "#2f8f5b" }));
      const disclaimer = f < legal ? "" : `<div style="${F1.css({ position: "absolute", left: 60, width: 460, top: 930, opacity: n(F1.ramp(f, legal, 12), 3) })}">${K.Label("Bukan saran investasi", { size: 28 })}</div>`;
      const partAHtml = F1.join(
        K.sk(F1.join(mattress, coins, shield), { opacity: n(partA, 3) }),
        `<div style="${F1.css({ position: "absolute", inset: 0, opacity: n(partA, 3) })}">${F1.join(
          shieldLabel,
          disclaimer,
          K.Card({
            at: 0, kicker: "PELAJARAN", big: f < tumbuh ? "JANGAN" : "TUMBUH", bigSize: 88,
            label: f < tumbuh ? "DIAM DI KASUR" : "MINIMAL = INFLASI", sub: f < legal ? "uang diam, nilainya makin kecil" : "pilih yang legal & diawasi OJK",
            bar: { k: F1.ramp(f, tumbuh, 30, F1.easeOut), text: "3%/thn" },
          }, f),
        )}</div>`,
      );

      // part B: back to the hook's composition, case closed
      const partB =
        f < swap
          ? ""
          : F1.join(
              K.Receipt({ x: 70, y: 530, w: 450, at: swap, price: 20000, oldPrice: 5000, strikeAt: swap - 60 }, f),
              K.Card({ at: swap, kicker: "BARANG BUKTI", big: "4X", label: "LEBIH MAHAL", sub: "dulu Rp5.000, sekarang Rp20.000", bar: { k: 1, text: "x4" } }, f),
              K.Stamp({ text: "KASUS DITUTUP", x: 540, y: 740, at: ditutup, rot: -8, size: 84 }, f),
            );

      return F1.join(
        pen,
        partAHtml,
        partB,
        K.inked(F1.join(
          F1.Mascot(
            {
              character: "mog", x: 290, scale: 1.25, facing: "right", look: [[0, "viewer"], [legal, "up"], [bogLine.start, { x: 540, y: 1300 }]], talking: F1.isSpeaking(S, "mog", f),
              gesture: [[0, "idle"], [tumbuh - 4, { gesture: "point", dir: "up-right" }], [legal + 30, "idle"], [wecLine.start, "wave"]],
              expression: [[0, "neutral"], [bogLine.start, "happy"]],
              exitAt: swap, exitFrames: 8,
            },
            f,
          ),
          F1.Mascot({ character: "mog", x: 220, scale: 0.95, at: wecLine.start - 4, enter: "pop", facing: "right", look: { x: 540, y: 1300 }, gesture: "wave", expression: "happy" }, f),
          F1.Mascot(
            {
              character: "wec", x: 790, scale: 1.1, facing: "left", look: [[0, { x: 290, y: 1300 }], [wecLine.start - 4, "viewer"]], talking: F1.isSpeaking(S, "wec", f),
              gesture: [[0, "listen"], [kasur, "startle"], [kasur + 40, "listen"], [wecLine.start - 4, "cheer"]],
              expression: [[0, "neutral"], [kasur, "surprised"], [legal, "happy"]],
              exitAt: swap, exitFrames: 8,
            },
            f,
          ),
          F1.Mascot({ character: "wec", x: 840, scale: 0.95, at: wecLine.start - 4, enter: "pop", facing: "left", look: "viewer", gesture: "cheer", expression: "happy", talking: F1.isSpeaking(S, "wec", f) }, f),
          F1.Mascot(
            {
              character: "bog", x: 540, scale: 1.3, at: swap + 2, enter: "pop", facing: "front", look: "viewer", talking: F1.isSpeaking(S, "bog", f),
              gesture: [[0, "shrug"], [bogLine.end, "idle"]], expression: [[0, "neutral"], [bogLine.start + 40, "happy"]],
            },
            f,
          ),
        )),
      );
    });
  </script>
</template>
