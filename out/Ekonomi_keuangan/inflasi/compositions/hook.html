<!-- Hook: Warung Pak Ujang at night. Extras walk past, steam rises; the Rp20.000 board drops and swings on "dua puluh ribu", the camera moves to it on "Dulu"; on "Siapa" the street freezes, the bulbs stutter and the camera cuts in on Beni. Frame 0 is fully drawn (thumbnail). -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #23252c;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="1.1333" id="hook-sfx-cash" class="clip" src="public/sfx/cash.wav" data-at="word:dua" data-track-index="11" data-volume="0.3"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.6333" id="hook-sfx-pop" class="clip" src="public/sfx/pop-in.wav" data-at="word:Siapa" data-track-index="12" data-volume="0.13"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      // lights: 0..1 brightness of the string bulbs and the windows; board: the price board's drop/swing
      const BG = (f, { lights, board, freeze }) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0;filter:blur(3px)">
<rect width="1080" height="1920" fill="#2a2d36"/>
<rect x="-40" y="380" width="380" height="900" fill="#3a3a42"/><rect x="760" y="300" width="360" height="980" fill="#34353d"/>
<g fill="#f2b35b" opacity="${n(lights, 3)}"><rect x="40" y="470" width="110" height="150" opacity="0.55"/><rect x="190" y="470" width="110" height="150" opacity="0.25"/><rect x="820" y="420" width="120" height="160" opacity="0.4"/></g>
<g opacity="0.75">${W.row(f, { y: 1010, s: 0.62, count: 9, seed: 4, speed: 1.1, freeze })}</g>
<path d="M0 360 Q 540 470 1080 340" stroke="#1a1b20" stroke-width="4" fill="none"/>
<g fill="#ffd27a" opacity="${n(0.25 + 0.75 * lights, 3)}"><circle cx="90" cy="385" r="11"/><circle cx="250" cy="410" r="11"/><circle cx="420" cy="428" r="11"/><circle cx="600" cy="430" r="11"/><circle cx="780" cy="410" r="11"/><circle cx="950" cy="378" r="11"/></g>
${W.row(f, { y: 1150, s: 0.95, count: 6, seed: 9, speed: 1.7, freeze })}
<rect x="180" y="760" width="720" height="70" rx="8" fill="#b5523b"/>
<text x="540" y="808" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="40" fill="#f6e7c8" letter-spacing="4">NASI GORENG PAK UJANG</text>
${board.p > 0 ? `<g transform="translate(700 830) rotate(${n(board.swing, 2)}) translate(0 ${n(-60 * (1 - board.p))})" opacity="${n(board.p, 3)}"><path d="M-40 0 L0 -2 L40 0" stroke="#1a1b20" stroke-width="3" fill="none"/><rect x="-95" y="0" width="190" height="96" rx="8" fill="#f6efe1" stroke="#1a1b20" stroke-width="5"/><text x="0" y="62" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="48" fill="#c0392b">Rp20.000</text></g>` : ""}
<rect x="210" y="830" width="20" height="300" fill="#5b4636"/><rect x="850" y="830" width="20" height="300" fill="#5b4636"/>
<rect x="160" y="1080" width="760" height="260" rx="10" fill="#7a5a43"/><rect x="160" y="1080" width="760" height="40" fill="#8f6b50"/>
<ellipse cx="430" cy="1070" rx="120" ry="26" fill="#1e1e22"/>
<path d="M380 1040 q 20 -60 50 -10 q 20 -50 45 0" stroke="#f2b35b" stroke-width="10" fill="none" opacity="${n(0.5 + 0.2 * Math.sin(f / 2.7), 3)}"/>
${W.steam(f, { x: 430, y: 1030, count: 5, rise: 260 })}
<rect x="0" y="1340" width="1080" height="580" fill="#3b332e"/></svg>`;
      window.__timelines["hook"] = F1.scene("hook", (f, { S, D }) => {
        const C = F1.cine;
        const dua = F1.wordFrame(S, "dua");
        const dulu = F1.wordFrame(S, "Dulu");
        const siapa = F1.wordFrame(S, "Siapa");
        // the price board drops in on "dua puluh ribu" and swings to rest
        const bp = F1.ramp(f, dua - 2, 10, F1.expoOut);
        const swing = f < dua ? 0 : 9 * Math.exp(-(f - dua) / 14) * Math.sin((f - dua) / 3.2);
        // on "Siapa" the street goes quiet: everyone stops, the bulbs stutter and dim
        const stutter = f >= siapa && f < siapa + 6 ? (f - siapa) % 3 === 1 ? 0.15 : 0.7 : 1;
        const lights = (f < siapa ? 0.85 + 0.15 * Math.sin(f / 7) * Math.sin(f / 3.1) : 0.55) * stutter;
        const shake = f >= siapa && f < siapa + 8 ? 6 * Math.sin(f * 2.1) * (1 - (f - siapa) / 8) : 0;
        return F1.join(
          `<div style="position:absolute;inset:0;transform:translate(${n(shake)}px,0)">`,
          C.stage(f, D, BG(f, { lights, board: { p: bp, swing }, freeze: siapa }), {
            zoom: 0.05,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 60 },
              { at: dulu, scale: 1.22, ox: 66, oy: 46, ease: 12 },
              { at: siapa, scale: 1.4, ox: 50, oy: 62 },
            ],
          }),
          `<div style="position:absolute;inset:0;background:rgba(242,179,91,${n(0.05 * lights, 3)})"></div>`,
          C.vignette(f < siapa ? 0.55 : 0.75, "50% 58%", 40),
          C.cast(S, f, [{ src: C.CAST.beniKaget, x: 540, y: 1180, w: 420, at: -14 }]),
          C.hud(f, { at: -14, kicker: "KASUS #01", big: "19:40", sub: "KASUS NASI GORENG · EPISODE 1" }),
          `</div>`,
        );
      });
    })();
  </script>
</template>
