<!-- Suspect 2, the ingredients: chilli, rice, egg, gas pop up (each with an up arrow); the card counts up food inflation +6,21% (Dec 2025). Stamp: BERSALAH... SEBAGIAN. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
  </style>
  <div id="root" data-composition-id="bahan" data-width="1080" data-height="1920">
    <div id="bahan-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="bahan-sfx-card" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="0.2" id="bahan-sfx-cabai" class="clip" src="public/sfx/pop-in.wav" data-at="word:Cabai" data-track-index="12" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="1.2667" id="bahan-sfx-beras" class="clip" src="public/sfx/pop-in.wav" data-at="word:beras" data-track-index="13" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.1667" id="bahan-sfx-telur" class="clip" src="public/sfx/pop-in.wav" data-at="word:telur" data-track-index="14" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="3" id="bahan-sfx-gas" class="clip" src="public/sfx/pop-in.wav" data-at="word:gas" data-track-index="15" data-volume="0.09"></audio>
    <audio data-hf-media-start-basis="local" data-start="9.8667" id="bahan-sfx-stat" class="clip" src="public/sfx/ding-num.wav" data-at="word:enam" data-track-index="16" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="11.7667" id="bahan-sfx-stamp" class="clip" src="public/sfx/stamp.wav" data-at="word:sebagian" data-track-index="17" data-volume="0.4"></audio>
  </div>
  <script>
    window.__timelines["bahan"] = F1.scene("bahan", (f, { S }) => {
      const K = F1.kasus;
      const pen = K.pen("bahan", f);
      const mogLine = F1.line(S, 1);
      const enam = F1.wordFrame(S, "enam");
      const sebagian = F1.wordFrame(S, "sebagian");
      const ITEMS = [
        { icon: "chili", label: "cabai", word: "Cabai", x: 185, y: 610 },
        { icon: "rice", label: "beras", word: "beras", x: 395, y: 610 },
        { icon: "egg", label: "telur", word: "telur", x: 185, y: 820 },
        { icon: "gas", label: "gas", word: "gas", x: 395, y: 820 },
      ];
      const ats = ITEMS.map((it) => F1.wordFrame(S, it.word));
      const count = ats.filter((a) => f >= a).length;
      const drawings = ITEMS.map((it, i) => K.Pop({ x: it.x, y: it.y, at: ats[i] }, f, K.Icon(it.icon, 140)) + K.Up({ x: it.x + 62, y: it.y - 58, at: ats[i] + 6, size: 54 }, f)).join("");
      const labels = ITEMS.map((it, i) => K.Pop({ x: it.x, y: it.y + 92, at: ats[i] + 2 }, f, K.Label(it.label, { size: 32 }))).join("");
      const s = F1.ramp(f, enam - 4, 24, F1.easeOut);
      return F1.join(
        pen,
        K.sk(drawings),
        labels,
        K.Card({
          at: 0, kicker: "TERSANGKA 2 DARI 3", big: f < enam - 4 ? "?" : `+${(6.21 * s).toFixed(2).replace(".", ",")}%`, bigSize: 84, label: "HARGA PANGAN", sub: "inflasi pangan, Des 2025",
          bar: { k: count / 4, text: `${count} / 4 naik` },
        }, f),
        K.Stamp({ text: "BERSALAH... SEBAGIAN", x: 540, y: 950, at: sebagian, rot: -5, size: 54 }, f),
        K.inked(F1.join(
          F1.Mascot(
            {
              character: "mog", x: 290, scale: 1.25, facing: "right", look: [[0, { x: 780, y: 1300 }], [mogLine.start - 4, "viewer"]], talking: F1.isSpeaking(S, "mog", f),
              gesture: [[0, "listen"], [enam - 6, { gesture: "point", dir: "up-right" }], [sebagian, "idle"]], expression: [[0, "neutral"], [sebagian, "smug"]],
            },
            f,
          ),
          F1.Mascot(
            {
              character: "wec", x: 790, scale: 1.1, facing: "left", look: [[0, "up"], [mogLine.start, { x: 290, y: 1300 }]], talking: F1.isSpeaking(S, "wec", f),
              gesture: [[0, "cheer"], [mogLine.start - 4, "listen"]], expression: [[0, "surprised"], [mogLine.start, "neutral"]],
            },
            f,
          ),
        )),
      );
    });
  </script>
</template>
