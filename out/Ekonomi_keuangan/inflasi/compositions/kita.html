<!-- Kita: the Lebaran market crowd walks (two rows of extras); from "semua orang belanja barengan" a front row pushes in and everyone walks faster; HARGA tags pop over the shops on "Harga ikut naik". Beni, then Muklis. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #cdd5d6;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="kita" data-width="1080" data-height="1920">
    <div id="kita-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="kita-sfx-card" class="clip" src="public/sfx/whoosh.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="1.5333" id="kita-sfx-thr" class="clip" src="public/sfx/pop-in.wav" data-at="word:THR" data-track-index="12" data-volume="0.13"></audio>
    <audio data-hf-media-start-basis="local" data-start="5.0667" id="kita-sfx-coins" class="clip" src="public/sfx/cash.wav" data-at="word:Uang" data-track-index="13" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="7.5667" id="kita-sfx-up" class="clip" src="public/sfx/pop-in.wav" data-at="word:Harga" data-track-index="14" data-volume="0.13"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      // rush 0..1: from "semua orang belanja barengan" a front row of shoppers pushes in; `time` makes everyone walk faster
      const BG = (f, rush, prices, time) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#d3d8d5"/>
<g style="filter:blur(3px)"><rect x="60" y="330" width="960" height="560" fill="#b9ab97"/><rect x="60" y="330" width="960" height="90" fill="#8b3f30"/>
<text x="540" y="392" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="52" fill="#f6e7c8" letter-spacing="6">PASAR · JELANG LEBARAN</text>
<rect x="140" y="470" width="220" height="420" fill="#6f6257"/><rect x="430" y="470" width="220" height="420" fill="#6f6257"/><rect x="720" y="470" width="220" height="420" fill="#6f6257"/></g>
${[250, 540, 830].map((x, i) => {
  const p = prices[i];
  return p <= 0 ? "" : `<g transform="translate(${x} 520) scale(${n(0.6 + 0.4 * p, 3)}) rotate(${(i - 1) * 4})" opacity="${n(p, 3)}"><rect x="-80" y="-34" width="160" height="68" rx="8" fill="#111"/><text x="0" y="14" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="38" fill="#fff">HARGA ▲</text></g>`;
}).join("")}
<rect x="0" y="880" width="1080" height="1040" fill="#a99a84"/>
<g style="filter:blur(2px)">${W.row(f, { y: 1000, s: 0.62, count: 16, seed: 41, speed: 1.2, time })}</g>
<g style="filter:blur(1px)">${W.row(f, { y: 1120, s: 0.85, count: 11, seed: 42, speed: 1.6, time })}</g>
${rush > 0 ? `<g opacity="${n(Math.min(1, rush * 2), 3)}" transform="translate(0 ${n(120 * (1 - rush))})">${W.row(f, { y: 1290, s: 1.15, count: 7, seed: 43, speed: 1.8, time })}</g>` : ""}</svg>`;
      window.__timelines["kita"] = F1.scene("kita", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x) => F1.wordFrame(S, x);
        const harga = w("Harga");
        const rush = F1.ramp(f, w("semua"), 24, F1.easeOut);
        // the crowd's clock runs up to 1.7x faster once the rush starts (summed, so nobody jumps)
        let time = 0;
        for (let k = 0; k < f; k++) time += 1 + 0.7 * F1.ramp(k, w("semua"), 24, F1.easeOut);
        const prices = [0, 6, 12].map((d) => F1.ramp(f, harga + d, 10, F1.expoOut));
        return F1.join(
          C.stage(f, D, BG(f, rush, prices, time), {
            zoom: 0.05,
            shots: [
              { at: 0, scale: 1.18, ox: 50, oy: 62 },
              { at: w("Pas"), scale: 1, ox: 50, oy: 55 },
              { at: w("Uang"), scale: 1.16, ox: 45, oy: 60, ease: 16 },
              { at: harga, scale: 1.3, ox: 50, oy: 30 },
            ],
          }),
          C.vignette(0.35, "50% 55%", 55),
          C.hud(f, { at: w("THR") - 6, kicker: "TERSANGKA 3 / 3", big: "THR", sub: "UANG BANYAK · BARANG SAMA" }),
          C.cast(S, f, [
            { src: C.CAST.beniKaget, x: 540, y: 1220, w: 380, at: 0 },
            { src: C.CAST.muklis, x: 540, y: 1220, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
