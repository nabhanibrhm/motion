<!-- Penjual: the cook tosses the rice (grains fly, steam, fire flares) while customers pass behind; cut in on "Untungnya" with the SEGITU-SEGITU AJA tag, back out wide on "Bukan". Muklis smiling. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #2b2a2e;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="penjual" data-width="1080" data-height="1920">
    <div id="penjual-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="penjual-sfx-card" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="11" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.5667" id="penjual-sfx-stamp" class="clip" src="public/sfx/stamp.wav" data-at="word:Bukan" data-track-index="12" data-volume="0.4"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      // the cook tosses the rice every 36 frames: the wok tips, grains fly up and fall back in
      const TOSS = 36;
      const BG = (f) => {
        const t = (f % TOSS) / TOSS;
        const tip = t < 0.25 ? Math.sin((t / 0.25) * Math.PI) : 0;
        const fire = 0.9 + 0.12 * Math.sin(f / 2.3) * Math.sin(f / 5.7) + 0.15 * tip;
        const grains = t < 0.7 ? [[90, -1], [150, 0.2], [215, 1], [120, -0.4], [185, 0.6]].map(([x, d], i) => {
          const u = t / 0.7;
          return `<circle cx="${n(x + 40 * d * u)}" cy="${n(150 - 260 * u * (1 - u) * (1 + 0.15 * i))}" r="${i % 2 ? 6 : 8}" fill="${i % 3 ? "#e7b35a" : "#c9673f"}"/>`;
        }).join("") : "";
        return `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#2f2e33"/>
<g style="filter:blur(4px)"><rect x="0" y="300" width="1080" height="700" fill="#3c3a3f"/><rect x="80" y="380" width="160" height="200" fill="#f2b35b" opacity="0.35"/><rect x="820" y="360" width="180" height="220" fill="#f2b35b" opacity="0.3"/>
<g opacity="0.7">${W.row(f, { y: 990, s: 0.8, count: 7, seed: 21, speed: 1.4 })}</g></g>
<rect x="0" y="980" width="1080" height="940" fill="#6e5140"/><rect x="0" y="980" width="1080" height="34" fill="#87644f"/>
<g transform="translate(250 760)">
<g transform="translate(160 150) scale(1 ${n(fire, 3)}) translate(-160 -150)"><path d="M60 70 q 20 -110 60 -30 q 25 -120 60 -20 q 30 -90 55 10" stroke="#f2a03d" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M90 90 q 15 -70 40 -20 q 20 -70 45 -5" stroke="#ffd27a" stroke-width="10" fill="none" stroke-linecap="round"/></g>
<g transform="rotate(${n(-10 * tip, 2)} 330 150)"><path d="M-30 150 Q 160 290 350 150 Z" fill="#1d1d21"/><rect x="320" y="140" width="190" height="20" rx="10" fill="#1d1d21" transform="rotate(-12 320 150)"/>
<ellipse cx="160" cy="160" rx="170" ry="26" fill="#e7b35a"/>
<g fill="#c9673f"><circle cx="90" cy="150" r="9"/><circle cx="150" cy="158" r="8"/><circle cx="215" cy="150" r="9"/></g><g fill="#7aa35a"><circle cx="120" cy="162" r="6"/><circle cx="185" cy="164" r="6"/></g></g>${grains}</g>
${W.steam(f, { x: 410, y: 880, count: 6, rise: 300, size: 30 })}
<g transform="translate(560 640)"><rect x="0" y="0" width="230" height="300" rx="70" fill="#d8cdbb"/><g transform="rotate(${n(2 * Math.sin(f / 9), 2)} 115 20)"><circle cx="115" cy="-70" r="90" fill="#e9dfcf"/><rect x="45" y="-170" width="140" height="44" rx="10" fill="#f4f1ea"/>
<circle cx="88" cy="-74" r="9" fill="#2a2a2e"/><circle cx="142" cy="-74" r="9" fill="#2a2a2e"/><path d="M92 -36 q 23 14 46 0" stroke="#2a2a2e" stroke-width="6" fill="none" stroke-linecap="round"/></g>
<rect x="-70" y="120" width="140" height="34" rx="17" fill="#d8cdbb" transform="rotate(${n(-25 - 14 * tip, 2)} 0 137)"/></g></svg>`;
      };
      window.__timelines["penjual"] = F1.scene("penjual", (f, { S, D }) => {
        const C = F1.cine;
        const untung = F1.wordFrame(S, "Untungnya");
        const bukan = F1.wordFrame(S, "Bukan");
        return F1.join(
          C.stage(f, D, BG(f), {
            zoom: 0.05,
            shots: [
              { at: 0, scale: 1.12, ox: 40, oy: 52 },
              { at: untung, scale: 1.3, ox: 62, oy: 38 },
              { at: bukan, scale: 1, ox: 50, oy: 50 },
            ],
          }),
          C.vignette(0.5, "50% 55%", 45),
          C.chip(f, { at: 2, text: "TERSANGKA 1 / 3" }),
          C.tag(f, { at: untung, x: 90, y: 560, rot: -4, light: true, size: 40, text: `<div style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;letter-spacing:1px;color:#6b5f52">UNTUNG PENJUAL</div>SEGITU-SEGITU AJA` }),
          C.cast(S, f, [{ src: C.CAST.muklisSenyum, x: 830, y: 1180, w: 380, at: 0 }]),
        );
      });
    })();
  </script>
</template>
