<!-- Hook: a konter HP at night. Extras walk past the lit shop window; on "sejuta" a red "+Rp1 JUTA" sticker slaps onto the dream phone's tag and the camera moves to it; on "Siapa" the street freezes, the neon stutters and the camera cuts in on Beni. Frame 0 is fully drawn (thumbnail). -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #1f2129;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="1.5667" id="hook-sfx-cash" class="clip" src="public/sfx/cash.wav" data-at="word:sejuta" data-track-index="11" data-volume="0.3"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.3333" id="hook-sfx-pop" class="clip" src="public/sfx/pop-in.wav" data-at="word:Siapa" data-track-index="12" data-volume="0.13"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      // a phone on the display shelf: body, screen with a soft gradient, a small price tag under it
      const PHONE = (x, y, s, screen) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-38" y="-78" width="76" height="156" rx="14" fill="#16171c" stroke="#2a2a2e" stroke-width="4"/><rect x="-31" y="-68" width="62" height="134" rx="8" fill="${screen}"/></g>`;
      // neon: 0..1 brightness of the sign and the window glow; sticker: the "+Rp1 JUTA" slap (p 0..1)
      const BG = (f, { neon, sticker, freeze }) => `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#23252e"/>
<g style="filter:blur(3px)"><rect x="-40" y="300" width="300" height="1000" fill="#30313a"/><rect x="820" y="260" width="320" height="1040" fill="#2c2d35"/>
<g fill="#f2b35b"><rect x="20" y="420" width="90" height="120" opacity="${n(0.35 * neon, 3)}"/><rect x="140" y="420" width="90" height="120" opacity="${n(0.18 * neon, 3)}"/><rect x="870" y="380" width="110" height="140" opacity="${n(0.3 * neon, 3)}"/></g>
<g opacity="0.7">${W.row(f, { y: 1000, s: 0.6, count: 9, seed: 21, speed: 1.1, freeze })}</g></g>
<rect x="150" y="520" width="780" height="110" rx="14" fill="#191a20" stroke="#3ad1c4" stroke-width="6" opacity="${n(0.4 + 0.6 * neon, 3)}"/>
<text x="540" y="595" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="58" letter-spacing="8" fill="#3ad1c4" opacity="${n(0.35 + 0.65 * neon, 3)}">KONTER HP MAJU</text>
<rect x="150" y="650" width="780" height="520" rx="10" fill="#2d3a45"/>
<rect x="170" y="670" width="740" height="480" fill="#bfe3e8" opacity="${n(0.16 + 0.12 * neon, 3)}"/>
<rect x="170" y="830" width="740" height="16" fill="#5b4636"/><rect x="170" y="1000" width="740" height="16" fill="#5b4636"/>
${PHONE(260, 750, 0.85, "#4b5b73")}${PHONE(380, 750, 0.85, "#6b5b8a")}${PHONE(700, 750, 0.85, "#3f6f6a")}${PHONE(820, 750, 0.85, "#4b5b73")}
${PHONE(300, 920, 0.85, "#7a5a43")}${PHONE(780, 920, 0.85, "#6b5b8a")}
<g transform="translate(540 760)"><rect x="-70" y="-150" width="140" height="290" rx="22" fill="#16171c" stroke="#f6efe1" stroke-width="5"/><rect x="-58" y="-134" width="116" height="256" rx="12" fill="url(#hook-scr)"/></g>
<defs><linearGradient id="hook-scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2b35b"/><stop offset="1" stop-color="#c2463b"/></linearGradient></defs>
<g transform="translate(540 935)"><rect x="-120" y="-30" width="240" height="64" rx="8" fill="#f6efe1" stroke="#1a1b20" stroke-width="5"/><text x="0" y="14" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="36" fill="#1a1b20">HP IMPIAN</text></g>
${sticker > 0 ? `<g transform="translate(640 690) rotate(-10) scale(${n(2 - sticker, 3)})" opacity="${n(Math.min(1, sticker * 2), 3)}"><rect x="-130" y="-42" width="260" height="84" rx="10" fill="#d0413a" stroke="#1a1b20" stroke-width="5"/><text x="0" y="16" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="46" fill="#fff">+Rp1 JUTA</text></g>` : ""}
<rect x="0" y="1170" width="1080" height="750" fill="#34302d"/>
${W.row(f, { y: 1250, s: 0.95, count: 5, seed: 8, speed: 1.7, freeze })}</svg>`;
      window.__timelines["hook"] = F1.scene("hook", (f, { S, D }) => {
        const C = F1.cine;
        const sejuta = F1.wordFrame(S, "sejuta");
        const siapa = F1.wordFrame(S, "Siapa");
        const sticker = F1.ramp(f, sejuta, 8, F1.expoOut);
        // on "Siapa" the street goes quiet: everyone stops, the neon stutters and dims
        const stutter = f >= siapa && f < siapa + 6 ? ((f - siapa) % 3 === 1 ? 0.15 : 0.7) : 1;
        const neon = (f < siapa ? 0.85 + 0.15 * Math.sin(f / 5) * Math.sin(f / 2.3) : 0.6) * stutter;
        const shake = f >= siapa && f < siapa + 8 ? 6 * Math.sin(f * 2.1) * (1 - (f - siapa) / 8) : 0;
        return F1.join(
          `<div style="position:absolute;inset:0;transform:translate(${n(shake)}px,0)">`,
          C.stage(f, D, BG(f, { neon, sticker, freeze: siapa }), {
            zoom: 0.05,
            shots: [
              { at: 0, scale: 1, ox: 50, oy: 55 },
              { at: sejuta - 2, scale: 1.3, ox: 54, oy: 52, ease: 10 },
              { at: siapa, scale: 1.4, ox: 50, oy: 64 },
            ],
          }),
          `<div style="position:absolute;inset:0;background:rgba(58,209,196,${n(0.04 * neon, 3)})"></div>`,
          C.vignette(f < siapa ? 0.55 : 0.75, "50% 58%", 40),
          C.cast(S, f, [{ src: C.CAST.beniKaget, x: 540, y: 1200, w: 420, at: -14 }]),
          C.hud(f, { at: -14, kicker: "KASUS #02", big: f < sejuta ? "21:15" : "+Rp1 JT", sub: "KASUS RUPIAH · EPISODE 2", src: f < sejuta ? "" : "gadget naik Rp500 rb–1 jt, detikInet (Jun 2026)" }),
          `</div>`,
        );
      });
    })();
  </script>
</template>
