<!-- Kalau: a desk by the window at night; Nisa asks with her phone. Two price cards (ilustrasi, HP US$500) flip in on "sembilan" (kurs Rp18.000) and "sepuluh" (kurs Rp20.000); on "Pemerintah" the 2027 forecast HUD; on "janji" a BUKAN JANJI tag and the city lights flicker. Nisa, then Muklis. -->
<template>
  <link rel="stylesheet" href="lib/f1/f1.css" />
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #262a36;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="kalau" data-width="1080" data-height="1920">
    <div id="kalau-art" class="f1-layer"></div>
    <audio data-hf-media-start-basis="local" data-start="0" id="kalau-sfx-in" class="clip" src="public/sfx/swoosh-soft.wav" data-at="0" data-track-index="20" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="2.2333" id="kalau-sfx-9" class="clip" src="public/sfx/tick.wav" data-at="word:sembilan" data-track-index="12" data-volume="0.2"></audio>
    <audio data-hf-media-start-basis="local" data-start="4.0333" id="kalau-sfx-10" class="clip" src="public/sfx/cash.wav" data-at="word:sepuluh" data-track-index="13" data-volume="0.25"></audio>
    <audio data-hf-media-start-basis="local" data-start="5.9" id="kalau-sfx-proj" class="clip" src="public/sfx/ding-num.wav" data-at="word:Pemerintah" data-track-index="14" data-volume="0.07"></audio>
    <audio data-hf-media-start-basis="local" data-start="11.3333" id="kalau-sfx-janji" class="clip" src="public/sfx/stamp.wav" data-at="word:janji" data-track-index="15" data-volume="0.35"></audio>
  </div>
  <script>
    (() => {
      const n = F1.n;
      const W = F1.world;
      // the city through the window: lit windows that twinkle (seeded, never random), dimmer from "janji"
      const CITY = (f, dim) => {
        let out = "";
        for (let i = 0; i < 40; i++) {
          const r = (j) => W.hash(i * 7 + j);
          const on = 0.5 + 0.5 * Math.sin(f / (30 + 40 * r(1)) + i) > 0.25 ? 1 : 0.3;
          out += `<rect x="${n(140 + 800 * r(2))}" y="${n(420 + 300 * r(3))}" width="14" height="18" fill="#f2c96b" opacity="${n(on * dim * (0.4 + 0.5 * r(4)), 3)}"/>`;
        }
        return out;
      };
      // a price card: kurs on top, price below, flips in (p 0..1) around its x axis
      const CARD = (x, y, p, kurs, harga, hot) => (p <= 0 ? "" : `<g transform="translate(${x} ${y}) scale(1 ${n(p, 3)})"><rect x="-150" y="-110" width="300" height="220" rx="16" fill="#f6efe1" stroke="#111" stroke-width="6"/><text x="0" y="-55" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="26" fill="#6b5f52">KURS ${kurs}</text><text x="0" y="30" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="78" fill="${hot ? "#c0392b" : "#111"}">${harga}</text><text x="0" y="80" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="20" fill="#6b5f52">HP US$500</text></g>`);
      window.__timelines["kalau"] = F1.scene("kalau", (f, { S, D }) => {
        const C = F1.cine;
        const w = (x, o = 0) => F1.wordFrame(S, x, o);
        const hp = F1.line(S, 1).start;
        const sembilan = w("sembilan");
        const sepuluh = w("sepuluh");
        const pemerintah = w("Pemerintah");
        const janji = w("janji");
        const dim = f < janji ? 1 : 0.5 + 0.5 * F1.ramp(f, janji + 6, 20);
        const c9 = F1.ramp(f, sembilan, 10, F1.expoOut);
        const c10 = F1.ramp(f, sepuluh, 10, F1.expoOut);
        const fade = 1 - F1.ramp(f, pemerintah - 4, 10);
        const arrow = F1.ramp(f, sepuluh + 4, 12, F1.expoOut);
        const BG = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<rect width="1080" height="1920" fill="#2b2f3c"/>
<rect x="100" y="300" width="880" height="560" rx="10" fill="#1b2030" stroke="#5b4636" stroke-width="22"/>
<path d="M140 720 L240 600 L300 650 L420 520 L520 640 L620 560 L760 660 L940 580 L940 840 L140 840 Z" fill="#141826"/>
${CITY(f, dim)}
<path d="M540 300 V860 M100 580 H980" stroke="#5b4636" stroke-width="16"/>
<rect x="0" y="980" width="1080" height="40" fill="#7a5a43"/><rect x="0" y="1020" width="1080" height="900" fill="#3a3530"/>
<g transform="translate(860 960)"><rect x="-60" y="-80" width="120" height="80" rx="8" fill="#e9e2d3"/><path d="M-40 -80 Q0 -150 40 -80" fill="#f2c96b" opacity="0.6"/></g>
<g opacity="${n(fade, 3)}">${CARD(300, 700, c9, "Rp18.000", "Rp9 jt", false)}${CARD(760, 700, c10, "Rp20.000", "Rp10 jt", true)}
${arrow > 0 ? `<path d="M470 700 H${n(470 + 110 * arrow)}" stroke="#c0392b" stroke-width="14" stroke-linecap="round"/><path d="M${n(470 + 110 * arrow)} 700 l-26 -22 M${n(470 + 110 * arrow)} 700 l-26 22" stroke="#c0392b" stroke-width="14" stroke-linecap="round"/>` : ""}</g></svg>`;
        return F1.join(
          C.stage(f, D, BG, {
            zoom: 0.05,
            shots: [
              { at: 0, scale: 1.2, ox: 50, oy: 62 },
              { at: hp, scale: 1, ox: 50, oy: 45 },
              { at: sepuluh, scale: 1.14, ox: 62, oy: 40, ease: 12 },
              { at: pemerintah, scale: 1.05, ox: 50, oy: 40 },
              { at: janji, scale: 1.2, ox: 50, oy: 52, ease: 10 },
            ],
          }),
          C.vignette(0.55, "50% 45%", 40),
          f < pemerintah
            ? C.hud(f, { at: 4, kicker: "KALAU...", big: "Rp20.000?", sub: f < sembilan ? "PER US$" : "ILUSTRASI · BELUM PAJAK &amp; MARGIN", w: 500 })
            : C.hud(f, { at: pemerintah, kicker: "PERKIRAAN 2027", big: "Rp17.500", sub: "ASUMSI APBN 2027 · BI: Rp16.800–17.500", src: "Banggar DPR (Sep 2026), BI (Jun 2026)", w: 560 }),
          C.tag(f, { at: janji, x: 330, y: 760, rot: -5, light: true, size: 44, text: `<span style="color:#c0392b">BUKAN JANJI</span>` }),
          C.cast(S, f, [
            { src: C.CAST.nisa, x: 540, y: 1200, w: 380, at: 0 },
            { src: C.CAST.muklis, x: 540, y: 1200, w: 380 },
          ]),
        );
      });
    })();
  </script>
</template>
